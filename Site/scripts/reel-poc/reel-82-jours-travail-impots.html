<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Reel — 156 jours de travail pour l'État</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --text-primary: #f0f4f8;
            --text-secondary: #a89c66;
            --text-muted: #6a5e3d;
            --accent: #ffd700;
            --accent-rgb: 255, 215, 0;
            --secondary-glow: rgba(255, 71, 87, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 0; display: flex; justify-content: center; }
        .reel { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
        .bg-base  { position: absolute; inset: 0; background: linear-gradient(160deg, #0a1220 0%, #1d2540 50%, #0a1220 100%); }
        .bg-grid  { position: absolute; inset: 0; background-image: linear-gradient(rgba(var(--accent-rgb), 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accent-rgb), 0.05) 1px, transparent 1px); background-size: 50px 50px; }
        .bg-glow-1 { position: absolute; width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(var(--accent-rgb), 0.18) 0%, transparent 70%); top: 40%; left: 50%; transform: translate(-50%, -50%); }
        .bg-glow-2 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, var(--secondary-glow) 0%, transparent 70%); bottom: -200px; left: -200px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 40px 40px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 14px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4.4rem; color: var(--accent); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 2rem; font-style: italic; color: #ffffff; line-height: 1; }

        .title-block { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 30px; }
        .title { font-family: 'Instrument Serif', serif; font-size: 7.4rem; line-height: 1.02; letter-spacing: -2.2px; color: var(--text-primary); text-align: center; max-width: 1000px; }
        .title .accent { color: var(--accent); font-style: italic; display: inline-block; }
        .subtitle { font-family: 'Syne', sans-serif; font-size: 1.5rem; color: var(--text-secondary); margin-top: 22px; letter-spacing: 1.8px; text-transform: uppercase; text-align: center; }

        .hero-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        .counter-wrap {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 24px;
            filter: drop-shadow(0 0 80px rgba(var(--accent-rgb), 0.7));
        }
        .counter {
            font-family: 'JetBrains Mono', monospace;
            font-size: 17rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 0.9;
            letter-spacing: -8px;
            text-shadow: 0 0 100px rgba(var(--accent-rgb), 0.7);
            font-variant-numeric: tabular-nums;
            min-width: 4.5ch;
            text-align: right;
        }
        .counter-unit {
            font-family: 'Instrument Serif', serif;
            font-size: 5.4rem;
            font-style: italic;
            color: var(--accent);
            letter-spacing: -1.5px;
        }

        .hero-caption {
            font-family: 'Instrument Serif', serif;
            font-size: 4.8rem;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.1;
            letter-spacing: -1.2px;
            max-width: 1000px;
            opacity: 0;
        }
        .hero-caption .accent {
            color: var(--accent);
            font-style: italic;
        }

        .compare-row {
            display: flex;
            justify-content: center;
            gap: 90px;
            opacity: 0;
            margin-top: 12px;
        }
        .compare-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .compare-flag { font-size: 5rem; line-height: 1; }
        .compare-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.2;
        }
        .compare-text strong {
            color: #ffffff;
            font-weight: 700;
            font-size: 2.6rem;
            letter-spacing: -0.5px;
        }
        .compare-text.fr strong { color: var(--accent); }

        .hero-caption.run { animation: fadeUp 600ms 3300ms forwards; }
        .compare-row.run  { animation: fadeUp 600ms 4300ms forwards; }

        .footer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 18px; margin-top: 14px; border-top: 1px solid var(--glass-border); }
        .cta { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .cta-url { font-family: 'JetBrains Mono', monospace; font-size: 2.6rem; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
        .cta-handle { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 500; color: #ffffff; letter-spacing: 0.5px; }
        .source { font-size: 0.85rem; color: var(--text-muted); line-height: 1.3; text-align: center; }
        .source span { color: var(--text-secondary); }

        .cta-screen {
            position: absolute; inset: 0; z-index: 10;
            background: radial-gradient(ellipse at center, #142b48 0%, #0a1220 70%, #06080c 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 60px;
            opacity: 0; pointer-events: none;
        }
        .cta-screen.run { animation: ctaFadeIn 400ms 6000ms forwards; }
        .cta-screen-logo { font-family: 'Instrument Serif', serif; font-size: 18rem; color: var(--accent); line-height: 1; text-shadow: 0 0 80px rgba(var(--accent-rgb), 0.5); opacity: 0; }
        .cta-screen.run .cta-screen-logo { animation: popIn 500ms 6000ms forwards; }
        .cta-screen-title { font-family: 'Instrument Serif', serif; font-size: 9rem; color: #ffffff; line-height: 1; text-align: center; opacity: 0; }
        .cta-screen.run .cta-screen-title { animation: fadeUp 400ms 6200ms forwards; }
        .cta-screen-tag { font-family: 'Syne', sans-serif; font-size: 2.8rem; color: rgba(255,255,255,0.7); letter-spacing: 4px; text-transform: uppercase; opacity: 0; }
        .cta-screen.run .cta-screen-tag { animation: fadeUp 300ms 6400ms forwards; }
        .cta-screen-urls { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 30px; opacity: 0; }
        .cta-screen.run .cta-screen-urls { animation: fadeUp 400ms 6500ms forwards; }
        .cta-screen-url { font-family: 'JetBrains Mono', monospace; font-size: 4.2rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
        .cta-screen-handle { font-family: 'JetBrains Mono', monospace; font-size: 3.6rem; font-weight: 500; color: #ffffff; letter-spacing: 1px; }

        @keyframes ctaFadeIn { to { opacity: 1; } }
        @keyframes fadeUp    { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn     { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="reel">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">

            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="title-block">
                <h1 class="title">Combien de jours<br>vous travaillez<br><span class="accent">pour l'État</span> ?</h1>
            </div>

            <div class="hero-area">
                <div class="counter-wrap">
                    <span class="counter" id="counter">0</span>
                    <span class="counter-unit">jours / an</span>
                </div>
                <div class="hero-caption">…soit jusqu'au <span class="accent">6 juin</span>,<br>jour de libération fiscale.</div>
                <div class="compare-row">
                    <div class="compare-item">
                        <div class="compare-flag">🇫🇷</div>
                        <div class="compare-text fr">France : <strong>156 jours</strong></div>
                    </div>
                    <div class="compare-item">
                        <div class="compare-flag">🇨🇭</div>
                        <div class="compare-text">Suisse : <strong>99 jours</strong></div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="cta">
                    <span class="cta-url">ouvalargent.com</span>
                    <span class="cta-handle">@ouvalargentfr</span>
                </div>
                <div class="source">Source : <span>INSEE · OCDE · 2024</span></div>
            </div>
        </div>

        <div class="cta-screen">
            <div class="cta-screen-logo">€</div>
            <div class="cta-screen-title">Abonne-toi.</div>
            <div class="cta-screen-tag">Partage.</div>
            <div class="cta-screen-urls">
                <div class="cta-screen-url">ouvalargent.com</div>
                <div class="cta-screen-handle">@ouvalargentfr</div>
            </div>
        </div>
    </div>

    <script>
        const ANIMATED_SELECTORS = '.hero-caption, .compare-row, .cta-screen';
        const elements = Array.from(document.querySelectorAll(ANIMATED_SELECTORS));

        // Compteur 0 → 156 jours sur 3 secondes avec ease-out
        const counterEl = document.getElementById('counter');
        const COUNTER_TARGET = 156;
        const COUNTER_START = 200;
        const COUNTER_DURATION = 3000;

        function updateCounter(timeMs) {
            if (!counterEl) return;
            const t = Math.max(0, Math.min(1, (timeMs - COUNTER_START) / COUNTER_DURATION));
            const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
            const value = Math.round(eased * COUNTER_TARGET);
            counterEl.textContent = value;
        }

        function startAndPauseAll() {
            elements.forEach(el => el.classList.add('run'));
            requestAnimationFrame(() => {
                document.getAnimations().forEach(a => a.pause());
            });
        }

        window.__reelReady = false;
        window.setReelTime = (timeMs) => {
            document.getAnimations().forEach(a => {
                try { a.currentTime = timeMs; } catch (e) {}
            });
            updateCounter(timeMs);
        };

        window.startReel = () => {
            elements.forEach(el => el.classList.add('run'));
            const t0 = performance.now();
            const tick = () => {
                const t = performance.now() - t0;
                updateCounter(t);
                if (t < COUNTER_START + COUNTER_DURATION + 100) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        };

        if (window.location.search.includes('capture')) {
            updateCounter(0);
            startAndPauseAll();
            Promise.all([document.fonts.ready]).then(() => { window.__reelReady = true; });
        } else {
            document.fonts.ready.then(() => { window.startReel(); });
        }
    </script>
</body>
</html>

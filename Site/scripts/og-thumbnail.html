<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    .thumbnail {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #06080c 0%, #0a1628 40%, #0d1f3c 70%, #0a1628 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
    }

    /* Grille subtile */
    .thumbnail::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
    }

    /* Glow effects */
    .glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
      top: -100px;
      right: -50px;
      z-index: 1;
    }

    .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
      bottom: -100px;
      left: -50px;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 60px;
      padding: 0 80px;
      width: 100%;
    }

    /* Logo euro */
    .logo-container {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .euro-symbol {
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-size: 100px;
      color: #06080c;
      font-weight: 400;
      box-shadow:
        0 0 40px rgba(0, 212, 255, 0.3),
        0 0 80px rgba(0, 212, 255, 0.1);
    }

    /* Texte principal */
    .text-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title {
      font-family: 'Instrument Serif', serif;
      font-size: 72px;
      font-weight: 400;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .title em {
      font-style: italic;
      color: #00d4ff;
    }

    .subtitle {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.5;
      max-width: 550px;
    }

    .tags {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: #00d4ff;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.2);
      padding: 6px 14px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* URL en bas */
    .url {
      position: absolute;
      bottom: 30px;
      right: 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: rgba(0, 212, 255, 0.5);
      z-index: 2;
      letter-spacing: 0.5px;
    }

    /* Ligne décorative */
    .accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #00d4ff 0%, #ffd700 50%, #00d4ff 100%);
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="thumbnail">
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="content">
      <div class="logo-container">
        <div class="euro-symbol">&euro;</div>
      </div>

      <div class="text-section">
        <div class="title">Où va <em>l'argent</em>&thinsp;?</div>
        <div class="subtitle">Finances publiques, économie et investissement — décryptés avec rigueur.</div>
        <div class="tags">
          <span class="tag">DETTE</span>
          <span class="tag">IMPÔTS</span>
          <span class="tag">DÉPENSES</span>
          <span class="tag">BUDGET</span>
        </div>
      </div>
    </div>

    <div class="url">ouvalargent.com</div>
    <div class="accent-line"></div>
  </div>
</body>
</html>

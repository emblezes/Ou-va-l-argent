name: Daily Photo-Stat Pipeline

# Tourne chaque jour à 08:00 Paris (06:00 UTC en été/CEST ; en hiver/CET → 07:00 Paris).
# GitHub cron est en UTC et ne gère pas l'heure d'été : dérive d'1 h l'hiver, acceptable.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # déclenchement manuel (test)

permissions:
  contents: write          # pour committer l'état de déduplication

concurrency:
  group: daily-photostat
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (partiel — uniquement Site/scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /Site/scripts
            /Site/package.json
            /Site/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (incl. Chromium Puppeteer)
        working-directory: Site
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run pipeline
        working-directory: Site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/daily-photostat.js

      - name: Persist dedup state
        run: |
          git config user.name "ovla-bot"
          git config user.email "bot@ouvalargent.com"
          git add -f Site/scripts/.daily-photostat-cache.json Site/scripts/daily-photostat-modules/ovla-bank-state.json
          git commit -m "chore: état pipeline daily-photostat [skip ci]" || echo "Aucun changement d'état"
          git push || echo "Push impossible (rien à pousser)"

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Template Actualité avec Photo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        /* === PHOTO DE FOND === */
        .bg-photo {
            position: absolute;
            inset: 0;
            background-image: url('PHOTO_URL_ICI');
            background-size: cover;
            background-position: center;
        }

        /* === VOILE GRADIENT (bas → haut) === */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(6, 8, 12, 0.95) 0%,
                rgba(6, 8, 12, 0.85) 20%,
                rgba(6, 8, 12, 0.4) 45%,
                rgba(6, 8, 12, 0.15) 60%,
                rgba(6, 8, 12, 0.3) 100%
            );
        }

        /* === CONTENU === */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(6, 8, 12, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 10px;
        }

        .logo-icon {
            font-family: 'Instrument Serif', serif;
            font-size: 4rem;
            color: #00d4ff;
            line-height: 1;
        }

        .logo-text {
            font-family: 'Instrument Serif', serif;
            font-size: 1.8rem;
            font-style: italic;
            color: #ffffff;
            line-height: 1;
        }

        /* --- Zone titre (bas) --- */
        .title-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-title {
            font-family: 'Instrument Serif', serif;
            font-size: 4.8rem;
            color: #f0f4f8;
            line-height: 1.15;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .news-title .accent {
            color: #00d4ff;
            font-style: italic;
        }

        .news-title .accent-gold {
            color: #ffd700;
            font-style: italic;
        }

        .news-title .accent-red {
            color: #ff4757;
            font-style: italic;
        }

        /* --- Footer --- */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .source {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .source span {
            color: rgba(255, 255, 255, 0.7);
        }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 500;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <!--
        TEMPLATE ACTUALITÉ AVEC PHOTO
        ==============================
        Pour créer une infographie d'actualité :
        1. Remplacer PHOTO_URL_ICI par le chemin de l'image
        2. Modifier le tag (ACTU, POLITIQUE, ÉCONOMIE...)
        3. Écrire le titre (utiliser .accent, .accent-gold, .accent-red pour colorer des mots)
        4. Modifier la source
        5. Exporter en PNG avec le script export-actu-photo.js
    -->
    <div class="infographic" data-name="actu-photo-exemple">
        <div class="bg-photo"></div>
        <div class="overlay"></div>
        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent</span>
                </div>
            </div>

            <div class="title-area">
                <h1 class="news-title">
                    Titre de l'actualité<br>
                    avec un mot <span class="accent">important</span>
                </h1>
                <div class="footer">
                    <div class="source">Source : <span>AFP · Février 2026</span></div>
                    <div class="website">ouvalargent.com</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Overlay Vidéo Actualité</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: transparent; padding: 0; display: flex; justify-content: center; }

        .overlay-frame {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        /* === GRADIENT HAUT (pour lisibilité du logo) === */
        .gradient-top {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(6, 8, 12, 0.5) 0%,
                rgba(6, 8, 12, 0.2) 8%,
                rgba(6, 8, 12, 0.0) 15%
            );
        }

        /* === CONTENU === */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(6, 8, 12, 0.5);
            backdrop-filter: blur(10px);
            padding: 14px 24px 14px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 1.6rem;
            color: #06080c;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.6rem;
            color: #f0f4f8;
        }

        .tag {
            padding: 14px 30px;
            background: rgba(255, 71, 87, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 71, 87, 0.5);
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* === BANDEAU (centré verticalement, au-dessus de la zone TikTok) === */
        .banner {
            background: rgba(6, 8, 12, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 36px 40px 30px;
            margin-bottom: 35%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .news-title {
            font-family: 'Instrument Serif', serif;
            font-size: 4.2rem;
            color: #f0f4f8;
            line-height: 1.15;
        }

        .news-title .accent {
            color: #00d4ff;
            font-style: italic;
        }

        .news-title .accent-gold {
            color: #ffd700;
            font-style: italic;
        }

        .news-title .accent-red {
            color: #ff4757;
            font-style: italic;
        }

        /* --- Footer dans le bandeau --- */
        .banner-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .source {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .source span {
            color: rgba(255, 255, 255, 0.7);
        }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <!--
        TEMPLATE OVERLAY VIDÉO
        ======================
        Layout adapté pour TikTok/Reels :
        - Logo + tag en haut
        - Bandeau opaque (glassmorphism) au milieu-bas avec titre + source + site
        - 15% d'espace vide en bas pour l'UI TikTok (pseudo, description, boutons)

        Le script export-actu-video.js :
        1. Injecte le titre, tag, source via JavaScript
        2. Exporte en PNG transparent
        3. Superpose sur la vidéo avec ffmpeg
    -->
    <div class="overlay-frame" data-name="video-overlay">
        <div class="gradient-top"></div>
        <div class="content">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">€</div>
                    <span class="logo-text">Où Va l'Argent</span>
                </div>
                <div class="tag">Actu</div>
            </div>

            <div class="banner">
                <h1 class="news-title">
                    Titre de l'actualité
                </h1>
                <div class="banner-footer">
                    <div class="source">Source : <span>AFP</span></div>
                    <div class="website">ouvalargent.com</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

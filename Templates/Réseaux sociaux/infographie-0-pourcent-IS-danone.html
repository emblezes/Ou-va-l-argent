<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0% d'IS - Où Va l'Argent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --accent-orange: #ff9f43;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .infographic {
            position: relative;
            overflow: hidden;
            width: 1080px;
            height: 1080px;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 71, 87, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* HEADER - Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-family: 'Instrument Serif', serif;
            font-size: 4rem;
            color: var(--accent-electric);
            line-height: 1;
        }

        .logo-text {
            font-family: 'Instrument Serif', serif;
            font-size: 2rem;
            font-style: italic;
            color: #ffffff;
            line-height: 1;
        }

        /* CENTER - Big stat */
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .stat-number {
            font-family: 'Syne', sans-serif;
            font-size: 22rem;
            font-weight: 800;
            line-height: 0.85;
            background: linear-gradient(135deg, var(--accent-red) 0%, #ff6b81 40%, var(--accent-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 80px rgba(255, 71, 87, 0.25));
        }

        .stat-label {
            font-family: 'Syne', sans-serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.08em;
            margin-top: -15px;
        }

        /* FOOTER */
        .website {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
            line-height: 1.1;
        }
        .website-url {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--accent-electric);
            letter-spacing: 0.02em;
        }
        .website-handle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-secondary, #94a3b8);
            letter-spacing: 0.3px;
        }

        /* Export button */
        .export-btn {
            margin-top: 2rem;
            padding: 14px 32px;
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-electric), #0099cc);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 0.05em;
        }
        .export-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="infographic" id="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <!-- HAUT : Logo -->
            <div class="logo">
                <span class="logo-icon">$</span>
                <span class="logo-text">Où va l'argent</span>
            </div>

            <!-- MILIEU : 0% d'IS -->
            <div class="center">
                <span class="stat-number">0%</span>
                <span class="stat-label">d'IS</span>
            </div>

            <!-- BAS : URL -->
            <span class="website"><span class="website-url">ouvalargent.com</span><span class="website-handle">@ouvalargentfr</span></span>
        </div>
    </div>

    <button class="export-btn" onclick="exportPNG()">Exporter en PNG (1080×1080)</button>

    <script>
        async function exportPNG() {
            const el = document.getElementById('infographic');
            // Use html2canvas
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = async () => {
                const canvas = await html2canvas(el, {
                    width: 1080,
                    height: 1080,
                    scale: 1,
                    useCORS: true,
                    backgroundColor: null
                });
                const link = document.createElement('a');
                link.download = 'infographie-0-pourcent-IS-1080x1080.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            document.head.appendChild(script);
        }
    </script>
</body>
</html>

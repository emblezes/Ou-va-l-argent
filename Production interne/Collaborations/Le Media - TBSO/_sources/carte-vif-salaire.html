<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VIF — Salaire France vs Suisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --gold: #d4af37;
    --gold-bright: #e8c349;
    --text: #f5f5f5;
    --text-mute: #888;
    --border: rgba(212, 175, 55, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; display: flex; justify-content: center; }
  .card {
    width: 1080px; height: 1080px;
    background: radial-gradient(ellipse at center top, #1f1f1f 0%, #141414 70%);
    position: relative; overflow: hidden;
    padding: 50px 70px 38px;
    display: flex; flex-direction: column;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none;
  }
  .header { display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 2; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 2.4rem; color: var(--gold); letter-spacing: 8px; }
  .baseline { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--text-mute); letter-spacing: 3px; text-transform: uppercase; }
  .kicker { font-family: 'DM Sans', sans-serif; font-size: 1.05rem; font-weight: 500; color: var(--text-mute); letter-spacing: 4px; text-transform: uppercase; margin-top: 60px; text-align: center; position: relative; z-index: 2; }
  .title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 4.7rem; line-height: 1.02; color: var(--text); text-align: center; margin-top: 40px; letter-spacing: -1px; position: relative; z-index: 2; }
  .title em { color: var(--gold); font-style: normal; }
  .duel { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 140px; margin-top: 20px; padding-bottom: 12px; position: relative; z-index: 2; min-height: 0; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 320px; }
  .col-value { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 5rem; line-height: 0.95; letter-spacing: -2px; white-space: nowrap; }
  .col-value.fr { color: var(--text); }
  .col-value.ch { color: var(--gold-bright); text-shadow: 0 0 50px rgba(212, 175, 55, 0.35); }
  .col-bar { width: 110px; border-radius: 2px 2px 0 0; }
  .col-bar.fr { background: linear-gradient(180deg, #555 0%, #2c2c2c 100%); height: 170px; }
  .col-bar.ch { background: linear-gradient(180deg, var(--gold-bright) 0%, #8a6f15 100%); height: 250px; box-shadow: 0 0 70px rgba(212, 175, 55, 0.3); }
  .col-flag { font-size: 2.6rem; line-height: 1; }
  .col-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2rem; color: var(--text); letter-spacing: 2px; text-transform: uppercase; }
  .col-label.ch { color: var(--gold-bright); }
  .catch { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2.3rem; color: var(--text); text-align: center; padding: 22px 0 16px; letter-spacing: 0.5px; position: relative; z-index: 2; border-top: 1px solid var(--border); }
  .catch em { color: var(--gold-bright); font-style: italic; }
  .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-mute); letter-spacing: 1.2px; text-transform: uppercase; position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">VIF</div>
    </div>
    <div class="title">Un Suisse gagne<br><em>1 200 € de plus</em><br>qu'un Français à travail égal</div>
    <div class="duel">
      <div class="col">
        <div class="col-value fr">2 640 €</div>
        <div class="col-bar fr"></div>
        <div class="col-flag">🇫🇷</div>
        <div class="col-label">France</div>
      </div>
      <div class="col">
        <div class="col-value ch">3 850 €</div>
        <div class="col-bar ch"></div>
        <div class="col-flag">🇨🇭</div>
        <div class="col-label ch">Suisse</div>
      </div>
    </div>
    <div class="catch">L'État français prélève <em>deux fois plus</em> sur le même travail</div>
    <div class="footer">
      <div>Source · OCDE 2024 · 5 000 € de salaire · Coin fiscal célibataire</div>
    </div>
  </div>
</body>
</html>

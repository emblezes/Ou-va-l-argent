<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VIF — Évolution PIB par habitant France vs Suisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --gold: #d4af37;
    --gold-bright: #e8c349;
    --text: #f5f5f5;
    --text-mute: #888;
    --border: rgba(212, 175, 55, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; display: flex; justify-content: center; }
  .card {
    width: 1080px; height: 1080px;
    background: radial-gradient(ellipse at center top, #1f1f1f 0%, #141414 70%);
    position: relative; overflow: hidden;
    padding: 50px 70px 38px;
    display: flex; flex-direction: column;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none;
  }
  .header { display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 2; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 2.4rem; color: var(--gold); letter-spacing: 8px; }
  .title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 4.7rem; line-height: 1.02; color: var(--text); text-align: center; margin-top: 30px; letter-spacing: -1px; position: relative; z-index: 2; }
  .title em { color: var(--gold-bright); font-style: normal; }

  .chart-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 0 20px; position: relative; z-index: 2; min-height: 0; }
  .chart { width: 100%; height: 100%; }

  .legend { display: flex; justify-content: center; gap: 40px; padding: 8px 0 4px; position: relative; z-index: 2; }
  .legend-item { display: flex; align-items: center; gap: 12px; font-family: 'DM Sans', sans-serif; font-size: 1.15rem; font-weight: 500; color: var(--text-mute); letter-spacing: 2px; text-transform: uppercase; }
  .legend-swatch { width: 36px; height: 4px; border-radius: 2px; }
  .legend-swatch.fr { background: #888; }
  .legend-swatch.ch { background: var(--gold-bright); box-shadow: 0 0 12px rgba(212, 175, 55, 0.5); }

  .catch { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2.3rem; color: var(--text); text-align: center; padding: 18px 0 14px; letter-spacing: 0.5px; position: relative; z-index: 2; border-top: 1px solid var(--border); }
  .catch em { color: var(--gold-bright); font-style: italic; }
  .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-mute); letter-spacing: 1.2px; text-transform: uppercase; position: relative; z-index: 2; }

  /* SVG */
  .axis-line { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
  .axis-label { font-family: 'DM Sans', sans-serif; font-size: 18px; fill: var(--text-mute); letter-spacing: 1.5px; text-transform: uppercase; }
  .gridline { stroke: rgba(255,255,255,0.04); stroke-width: 1; stroke-dasharray: 2 4; }
  .curve { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .curve.fr { stroke: #888; }
  .curve.ch { stroke: var(--gold-bright); filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.45)); }
  .point { stroke-width: 4; }
  .point.fr { fill: #0a0a0a; stroke: #888; }
  .point.ch { fill: #0a0a0a; stroke: var(--gold-bright); }
  .point-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 38px; }
  .point-label.fr { fill: var(--text); }
  .point-label.ch { fill: var(--gold-bright); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">VIF</div>
    </div>
    <div class="title">L'écart de richesse<br>France / Suisse<br><em>multiplié par 3</em> en 50 ans</div>

    <div class="chart-wrap">
      <svg class="chart" viewBox="-50 0 990 480" preserveAspectRatio="xMidYMid meet">
        <!-- grille horizontale -->
        <line class="gridline" x1="80" y1="60"  x2="900" y2="60"/>
        <line class="gridline" x1="80" y1="160" x2="900" y2="160"/>
        <line class="gridline" x1="80" y1="260" x2="900" y2="260"/>
        <line class="gridline" x1="80" y1="360" x2="900" y2="360"/>
        <line class="axis-line" x1="80" y1="440" x2="900" y2="440"/>
        <!-- labels Y (à gauche) -->
        <text class="axis-label" x="60" y="64"  text-anchor="end">110k $</text>
        <text class="axis-label" x="60" y="264" text-anchor="end">55k $</text>
        <text class="axis-label" x="60" y="444" text-anchor="end">0</text>
        <!-- labels X (années) -->
        <text class="axis-label" x="100" y="468" text-anchor="middle">1970</text>
        <text class="axis-label" x="364" y="468" text-anchor="middle">1990</text>
        <text class="axis-label" x="640" y="468" text-anchor="middle">2010</text>
        <text class="axis-label" x="880" y="468" text-anchor="middle">2024</text>

        <!-- Échelle :
             x = 80 + (year-1970)/54 * 820   (de x=80 à x=900)
             y = 440 - value/110000 * 380   (de y=440 à y=60)
             Points :
             1970 : x=100   FR=3000 y=429    CH=3700 y=427
             1990 : x=364   FR=22000 y=364   CH=40000 y=302
             2010 : x=640   FR=42000 y=295   CH=75000 y=181
             2024 : x=880   FR=47000 y=278   CH=106000 y=74
        -->

        <!-- Courbe France -->
        <path class="curve fr" d="M 100,429 L 364,364 L 640,295 L 880,278"/>
        <!-- Courbe Suisse -->
        <path class="curve ch" d="M 100,427 L 364,302 L 640,181 L 880,74"/>

        <!-- Points France -->
        <circle class="point fr" cx="100" cy="429" r="7"/>
        <circle class="point fr" cx="364" cy="364" r="7"/>
        <circle class="point fr" cx="640" cy="295" r="7"/>
        <circle class="point fr" cx="880" cy="278" r="7"/>
        <!-- Points Suisse -->
        <circle class="point ch" cx="100" cy="427" r="7"/>
        <circle class="point ch" cx="364" cy="302" r="7"/>
        <circle class="point ch" cx="640" cy="181" r="7"/>
        <circle class="point ch" cx="880" cy="74"  r="7"/>

        <!-- Labels valeurs (France en bas des points, Suisse en haut) -->
        <text class="point-label fr" x="100" y="455" text-anchor="middle">3 k$</text>
        <text class="point-label fr" x="640" y="320" text-anchor="middle">42 k$</text>
        <text class="point-label fr" x="880" y="305" text-anchor="end">47 k$</text>
        <text class="point-label ch" x="100" y="412" text-anchor="middle">3,7 k$</text>
        <text class="point-label ch" x="640" y="165" text-anchor="middle">75 k$</text>
        <text class="point-label ch" x="880" y="58" text-anchor="end">106 k$</text>
      </svg>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch fr"></span>France</div>
      <div class="legend-item"><span class="legend-swatch ch"></span>Suisse</div>
    </div>

    <div class="catch">En 1970, presque <em>à égalité</em>. En 2024, l'écart est <em>de 1 à 2</em>.</div>
    <div class="footer">
      <div>Source · Banque Mondiale · PIB par habitant · USD courants</div>
    </div>
  </div>
</body>
</html>

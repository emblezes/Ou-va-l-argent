<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VIF — Prélèvements obligatoires France vs Suisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --gold: #d4af37;
    --gold-bright: #e8c349;
    --text: #f5f5f5;
    --text-mute: #888;
    --border: rgba(212, 175, 55, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; display: flex; justify-content: center; }
  .card {
    width: 1080px; height: 1080px;
    background: radial-gradient(ellipse at center top, #1f1f1f 0%, #141414 70%);
    position: relative; overflow: hidden;
    padding: 60px 70px 50px;
    display: flex; flex-direction: column;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none;
  }
  .header { display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 2; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 2.4rem; color: var(--gold); letter-spacing: 8px; }
  .baseline { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--text-mute); letter-spacing: 3px; text-transform: uppercase; }
  .kicker { font-family: 'DM Sans', sans-serif; font-size: 1.05rem; font-weight: 500; color: var(--text-mute); letter-spacing: 4px; text-transform: uppercase; margin-top: 60px; text-align: center; position: relative; z-index: 2; }
  .title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 5.2rem; line-height: 1; color: var(--text); text-align: center; margin-top: 18px; letter-spacing: -1px; position: relative; z-index: 2; }
  .title em { color: var(--gold); font-style: normal; }
  .duel { flex: 1; display: flex; align-items: center; justify-content: center; gap: 120px; margin-top: 40px; padding-bottom: 30px; position: relative; z-index: 2; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 360px; }
  .col-value { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14rem; line-height: 0.9; letter-spacing: -6px; }
  .col-value.fr { color: var(--text); }
  .col-value.ch { color: var(--gold-bright); text-shadow: 0 0 70px rgba(212, 175, 55, 0.4); }
  .col-flag { font-size: 3rem; line-height: 1; }
  .col-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2.2rem; color: var(--text); letter-spacing: 3px; text-transform: uppercase; }
  .col-label.ch { color: var(--gold-bright); }
  .col-sub { font-family: 'DM Sans', sans-serif; font-size: 1rem; color: var(--text-mute); letter-spacing: 2px; text-transform: uppercase; }
  .catch { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2.6rem; color: var(--text); text-align: center; padding: 30px 0 20px; letter-spacing: 0.5px; position: relative; z-index: 2; border-top: 1px solid var(--border); }
  .catch em { color: var(--gold-bright); font-style: italic; }
  .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-mute); letter-spacing: 1.2px; text-transform: uppercase; position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">VIF</div>
    </div>
    <div class="title">La France prélève<br><em>deux tiers d'impôts</em><br>de plus que la Suisse</div>
    <div class="duel">
      <div class="col">
        <div class="col-value fr">45<span style="font-size:7rem; letter-spacing:0;">%</span></div>
        <div class="col-flag">🇫🇷</div>
        <div class="col-label">France</div>
        <div class="col-sub">5<sup>e</sup> rang mondial</div>
      </div>
      <div class="col">
        <div class="col-value ch">27<span style="font-size:7rem; letter-spacing:0;">%</span></div>
        <div class="col-flag">🇨🇭</div>
        <div class="col-label ch">Suisse</div>
        <div class="col-sub">moitié moins</div>
      </div>
    </div>
    <div class="catch">Même richesse produite, <em>presque deux fois plus prélevé</em> en France</div>
    <div class="footer">
      <div>Source · OCDE 2024 · Prélèvements obligatoires en % du PIB · Total impôts et cotisations</div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VIF Video — Salaire France vs Suisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --gold: #d4af37;
    --gold-bright: #e8c349;
    --text: #f5f5f5;
    --text-mute: #888;
    --border: rgba(212, 175, 55, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #1a1a1a; display: flex; justify-content: center; }
  .reel {
    width: 1080px; height: 1920px;
    background: radial-gradient(ellipse at center top, #1f1f1f 0%, #141414 70%);
    position: relative; overflow: hidden;
    padding: 90px 80px 80px;
    display: flex; flex-direction: column;
  }
  .reel::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(212, 175, 55, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(212, 175, 55, 0.025) 1px, transparent 1px);
    background-size: 70px 70px; pointer-events: none;
  }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(212, 175, 55, 0.10) 0%, transparent 70%); pointer-events: none; }
  .glow.top { top: -300px; right: -200px; }
  .glow.bot { bottom: -300px; left: -250px; opacity: 0.6; }

  .header { display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 2; opacity: 0; }
  .header.run { animation: fadeIn 500ms 0ms forwards; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 3rem; color: var(--gold); letter-spacing: 12px; }
  .baseline { font-family: 'DM Sans', sans-serif; font-size: 1.1rem; color: var(--text-mute); letter-spacing: 4px; text-transform: uppercase; }

  .kicker { font-family: 'DM Sans', sans-serif; font-size: 1.45rem; font-weight: 500; color: var(--text-mute); letter-spacing: 5px; text-transform: uppercase; margin-top: 90px; text-align: center; position: relative; z-index: 2; opacity: 0; }
  .kicker.run { animation: fadeUp 600ms 300ms forwards; }

  .title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 8rem; line-height: 1; color: var(--text); text-align: center; margin-top: 30px; letter-spacing: -2px; position: relative; z-index: 2; opacity: 0; }
  .title em { color: var(--gold-bright); font-style: normal; }
  .title.run { animation: fadeUp 700ms 700ms forwards; }

  .duel { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 140px; margin-top: 60px; padding-bottom: 60px; position: relative; z-index: 2; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 36px; width: 360px; }
  .col-value { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 8rem; line-height: 0.9; letter-spacing: -3px; white-space: nowrap; opacity: 0; }
  .col-value.fr { color: var(--text); }
  .col-value.ch { color: var(--gold-bright); text-shadow: 0 0 70px rgba(212, 175, 55, 0.5); }
  .col-value.fr.run { animation: popIn 500ms 4200ms forwards; }
  .col-value.ch.run { animation: popIn 500ms 4500ms forwards; }

  .col-bar { width: 160px; border-radius: 4px 4px 0 0; height: 0; }
  .col-bar.fr { background: linear-gradient(180deg, #555 0%, #2c2c2c 100%); }
  .col-bar.ch { background: linear-gradient(180deg, var(--gold-bright) 0%, #8a6f15 100%); box-shadow: 0 0 80px rgba(212, 175, 55, 0.4); }
  .col-bar.fr.run { animation: barFR 1400ms 2200ms cubic-bezier(0.34, 0.05, 0.4, 1) forwards; }
  .col-bar.ch.run { animation: barCH 1700ms 2400ms cubic-bezier(0.34, 0.05, 0.4, 1) forwards; }

  .col-flag { font-size: 3.6rem; line-height: 1; opacity: 0; }
  .col-flag.run { animation: fadeUp 400ms 5000ms forwards; }

  .col-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 2.4rem; color: var(--text); letter-spacing: 3px; text-transform: uppercase; opacity: 0; }
  .col-label.ch { color: var(--gold-bright); }
  .col-label.run { animation: fadeUp 400ms 5300ms forwards; }

  .catch { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 3.2rem; color: var(--text); text-align: center; padding: 40px 0 30px; letter-spacing: 0.5px; position: relative; z-index: 2; border-top: 1px solid var(--border); opacity: 0; line-height: 1.15; }
  .catch em { color: var(--gold-bright); font-style: italic; }
  .catch.run { animation: fadeUp 600ms 6200ms forwards; }

  .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 26px; border-top: 1px solid var(--border); font-size: 1.05rem; color: var(--text-mute); letter-spacing: 1.4px; text-transform: uppercase; position: relative; z-index: 2; opacity: 0; }
  .footer.run { animation: fadeIn 500ms 7000ms forwards; }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn  { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes barFR  { from { height: 0; } to { height: 380px; } }
  @keyframes barCH  { from { height: 0; } to { height: 555px; } }
</style>
</head>
<body>
  <div class="reel">
    <div class="glow top"></div>
    <div class="glow bot"></div>
    <div class="header">
      <div class="logo">VIF</div>
    </div>
    <div class="title">Un Suisse gagne<br><em>1 200 € de plus</em><br>qu'un Français<br>à travail égal</div>
    <div class="duel">
      <div class="col">
        <div class="col-value fr">2 640 €</div>
        <div class="col-bar fr"></div>
        <div class="col-flag">🇫🇷</div>
        <div class="col-label">France</div>
      </div>
      <div class="col">
        <div class="col-value ch">3 850 €</div>
        <div class="col-bar ch"></div>
        <div class="col-flag">🇨🇭</div>
        <div class="col-label ch">Suisse</div>
      </div>
    </div>
    <div class="catch">L'État français prélève <em>deux fois plus</em><br>sur le même travail</div>
    <div class="footer">
      <div>Source · OCDE 2024 · 5 000 € de salaire · Coin fiscal célibataire</div>
    </div>
  </div>

<script>
  const SELECTORS = '.header, .kicker, .title, .col-value, .col-bar, .col-flag, .col-label, .catch, .footer';
  const els = Array.from(document.querySelectorAll(SELECTORS));
  function startAndPauseAll() {
    els.forEach(el => el.classList.add('run'));
    requestAnimationFrame(() => { document.getAnimations().forEach(a => a.pause()); });
  }
  window.__reelReady = false;
  window.setReelTime = (timeMs) => {
    document.getAnimations().forEach(a => { try { a.currentTime = timeMs; } catch(e) {} });
  };
  window.startReel = () => { els.forEach(el => el.classList.add('run')); };
  if (window.location.search.includes('capture')) {
    startAndPauseAll();
    Promise.all([document.fonts.ready]).then(() => { window.__reelReady = true; });
  } else {
    document.fonts.ready.then(() => { window.startReel(); });
  }
</script>
</body>
</html>

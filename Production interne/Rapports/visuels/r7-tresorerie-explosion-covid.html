<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>R7 — Le trésor caché : 101 Md€ de trésorerie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-gold: #ffd700;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --accent-purple: #a855f7;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1200px; height: 700px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #06080c 0%, #0a1628 50%, #06080c 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 215, 0, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 800px; height: 800px; background: radial-gradient(circle, rgba(255, 215, 0, 0.10) 0%, transparent 70%); top: -250px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(168, 85, 247, 0.05) 0%, transparent 70%); bottom: -150px; left: -100px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 38px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; justify-content: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.4rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 3.8rem; text-align: center; color: var(--text-primary); line-height: 1.05; margin-top: 12px; letter-spacing: -1px; }
        .chart-title .accent { color: var(--accent-gold); font-style: italic; }
        .subtitle { text-align: center; font-size: 1rem; color: var(--text-secondary); margin-top: 8px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }

        .chart-container { flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 8px; }
        .chart-svg { width: 100%; height: auto; max-height: 420px; }

        .axis-line { stroke: rgba(255,255,255,0.18); stroke-width: 1; }
        .grid-line { stroke: rgba(255,255,255,0.05); stroke-width: 1; stroke-dasharray: 3 3; }
        .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: var(--text-muted); }
        .year-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: var(--text-secondary); }
        .curve-pre { fill: none; stroke: var(--accent-electric); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }
        .curve-post { fill: none; stroke: var(--accent-gold); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 8px rgba(255,215,0,0.45)); }
        .area-post { fill: url(#goldGradient); opacity: 0.30; }
        .point-pre { fill: #fff; stroke: var(--accent-electric); stroke-width: 2.5; }
        .point-post { fill: var(--accent-gold); stroke: #fff; stroke-width: 2.5; }
        .point-label-pre { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; fill: #fff; }
        .point-label-post { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; fill: var(--accent-gold); }
        .zone-label { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.85rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="r7-tresorerie-explosion-covid">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">Le <span class="accent">trésor caché</span> des associations · 101 Md€</h2>
            <div class="subtitle">Patrimoine financier des ISBLSM · 2013 → T3 2024 · Md€</div>

            <div class="chart-container">
                <svg class="chart-svg" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.6"/>
                            <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.05"/>
                        </linearGradient>
                        <pattern id="hatchPattern" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                            <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,215,0,0.10)" stroke-width="2"/>
                        </pattern>
                    </defs>

                    <!--
                        Mapping :
                        X : 2013 (60) → 2024 (1040), pas annuel = 89 px/an
                        Y : 70 Md€ (370) → 105 Md€ (40), 1 Md€ = 9.43 px
                        Années : 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024
                        Valeurs estimées : 72.6, 73, 73.5, 73.5, 74, 74.5, 75, 78, 84, 90, 96, 101
                    -->

                    <!-- Zone Covid hachurée (2020 → 2024) -->
                    <rect x="683" y="40" width="357" height="330" fill="url(#hatchPattern)"/>
                    <line x1="683" y1="40" x2="683" y2="370" stroke="rgba(255,215,0,0.40)" stroke-width="1.5" stroke-dasharray="5 4"/>

                    <!-- Labels zones -->
                    <text x="370" y="32" text-anchor="middle" class="zone-label" fill="rgba(0,212,255,0.55)">Avant Covid · +2,4 Md€ en 6 ans</text>
                    <text x="860" y="32" text-anchor="middle" class="zone-label" fill="rgba(255,215,0,0.85)">Post Covid · + 26 Md€ en 4,5 ans</text>

                    <!-- Axe Y : grille horizontale -->
                    <line x1="60" y1="40" x2="1040" y2="40" class="grid-line"/>
                    <line x1="60" y1="135" x2="1040" y2="135" class="grid-line"/>
                    <line x1="60" y1="230" x2="1040" y2="230" class="grid-line"/>
                    <line x1="60" y1="325" x2="1040" y2="325" class="grid-line"/>
                    <line x1="60" y1="370" x2="1040" y2="370" class="axis-line"/>

                    <!-- Labels Y -->
                    <text x="50" y="45" text-anchor="end" class="axis-label">105 Md€</text>
                    <text x="50" y="140" text-anchor="end" class="axis-label">95</text>
                    <text x="50" y="235" text-anchor="end" class="axis-label">85</text>
                    <text x="50" y="330" text-anchor="end" class="axis-label">75</text>
                    <text x="50" y="375" text-anchor="end" class="axis-label">70</text>

                    <!-- Courbe pré-Covid 2013-2019 -->
                    <path class="curve-pre" d="
                        M 60 348
                        L 149 343
                        L 238 340
                        L 327 339
                        L 416 335
                        L 505 332
                        L 594 327
                    "/>

                    <!-- Aire post-Covid -->
                    <path class="area-post" d="
                        M 594 327
                        L 683 327
                        L 772 295
                        L 861 232
                        L 950 173
                        L 1006 132
                        L 1006 370
                        L 594 370
                        Z
                    "/>

                    <!-- Courbe post-Covid -->
                    <path class="curve-post" d="
                        M 594 327
                        L 683 327
                        L 772 295
                        L 861 232
                        L 950 173
                        L 1006 132
                    "/>

                    <!-- Points pré-Covid -->
                    <circle class="point-pre" cx="60" cy="348" r="4"/>
                    <circle class="point-pre" cx="594" cy="327" r="5"/>

                    <!-- Points post-Covid -->
                    <circle class="point-post" cx="683" cy="327" r="6"/>
                    <circle class="point-post" cx="861" cy="232" r="6"/>
                    <circle class="point-post" cx="1006" cy="132" r="9"/>

                    <!-- Annotations -->
                    <text x="60" y="340" text-anchor="middle" class="point-label-pre">73</text>
                    <text x="60" y="395" text-anchor="middle" class="year-label">2013</text>

                    <text x="594" y="318" text-anchor="middle" class="point-label-pre">75</text>
                    <text x="594" y="395" text-anchor="middle" class="year-label">2019</text>

                    <text x="683" y="395" text-anchor="middle" class="year-label" style="fill:var(--accent-gold);font-weight:700;">2020</text>
                    <text x="683" y="408" text-anchor="middle" class="year-label" style="font-size:11px;">Covid</text>

                    <text x="861" y="222" text-anchor="middle" class="point-label-post">90</text>
                    <text x="861" y="395" text-anchor="middle" class="year-label">2022</text>

                    <text x="1006" y="120" text-anchor="middle" class="point-label-post" style="font-size:22px;">101</text>
                    <text x="1006" y="395" text-anchor="middle" class="year-label" style="fill:var(--accent-gold);font-weight:700;">T3 2024</text>

                    <!-- Annotation +26 Md€ -->
                    <g transform="translate(870, 100)">
                        <text x="0" y="0" class="zone-label" fill="var(--accent-gold)" style="font-size:24px;letter-spacing:1px;">+ 26 Md€</text>
                        <text x="0" y="22" class="axis-label" fill="var(--text-secondary)" style="font-size:12px;">depuis le début Covid</text>
                    </g>
                </svg>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Rapport IGF mai 2025, p. 19 · INSEE comptes nationaux ISBLSM</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

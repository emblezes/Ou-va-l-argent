<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'espérance de vie en France</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --bg-surface: #0a0e14;
            --bg-elevated: #111820;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-gold: #ffd700;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --accent-purple: #a855f7;
            --accent-orange: #ff9f43;
            --glass: rgba(17, 24, 32, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 55px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }

        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .tag {
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.25);
            color: #00d4ff;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5rem;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: var(--accent-green);
            font-style: italic;
        }

        .chart-subtitle {
            text-align: center;
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .legend-line {
            width: 30px;
            height: 4px;
            border-radius: 2px;
        }

        .legend-line.femmes { background: #a855f7; }
        .legend-line.hommes { background: #00d4ff; }
        .legend-femmes { color: #a855f7; }
        .legend-hommes { color: #00d4ff; }

        /* ===== LINE CHART ===== */
        .chart-area {
            flex: 1;
            position: relative;
            margin: 0 5px;
        }

        .chart-area svg {
            width: 100%;
            height: 100%;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: 8px;
            border-top: 1px solid var(--glass-border);
        }

        .source {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .source span {
            color: var(--text-secondary);
        }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-electric);
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">L'espérance de vie va<br>continuer d'<span class="accent">augmenter</span></h2>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-line femmes"></div>
                    <span class="legend-femmes">Femmes</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line hommes"></div>
                    <span class="legend-hommes">Hommes</span>
                </div>
            </div>

            <div class="chart-area">
                <!--
                    Chart: 960 x 500 viewBox
                    X: 1950=60, 2070=930 → range 870px for 120 years
                    x(year) = 60 + (year-1950)/120 * 870

                    Y: 60 ans=480, 95 ans=30 → range 450px for 35 units
                    y(val) = 480 - (val-60)/35 * 450

                    Key x positions:
                    1950=60, 1960=133, 1970=205, 1980=278, 1990=350,
                    2000=423, 2010=495, 2020=568, 2025=604,
                    2040=713, 2050=785, 2070=930

                    FEMMES (y coords):
                    1950: 69.2 → y=480-(9.2/35)*450 = 480-118 = 362
                    1960: 73.6 → y=480-(13.6/35)*450 = 480-175 = 305
                    1970: 75.9 → y=480-(15.9/35)*450 = 480-204 = 276
                    1980: 78.4 → y=480-(18.4/35)*450 = 480-237 = 243
                    1990: 80.9 → y=480-(20.9/35)*450 = 480-269 = 211
                    2000: 82.8 → y=480-(22.8/35)*450 = 480-293 = 187
                    2010: 84.6 → y=480-(24.6/35)*450 = 480-316 = 164
                    2020: 85.1 → y=480-(25.1/35)*450 = 480-323 = 157
                    2025: 85.9 → y=480-(25.9/35)*450 = 480-333 = 147
                    2040: 88.3 → y=480-(28.3/35)*450 = 480-364 = 116
                    2070: 90.0 → y=480-(30/35)*450 = 480-386 = 94

                    HOMMES (y coords):
                    1950: 63.4 → y=480-(3.4/35)*450 = 480-44 = 436
                    1960: 67.0 → y=480-(7/35)*450 = 480-90 = 390
                    1970: 68.4 → y=480-(8.4/35)*450 = 480-108 = 372
                    1980: 70.2 → y=480-(10.2/35)*450 = 480-131 = 349
                    1990: 72.7 → y=480-(12.7/35)*450 = 480-163 = 317
                    2000: 75.3 → y=480-(15.3/35)*450 = 480-197 = 283
                    2010: 78.0 → y=480-(18/35)*450 = 480-231 = 249
                    2020: 79.1 → y=480-(19.1/35)*450 = 480-246 = 234
                    2025: 80.4 → y=480-(20.4/35)*450 = 480-262 = 218
                    2040: 83.5 → y=480-(23.5/35)*450 = 480-302 = 178
                    2070: 87.5 → y=480-(27.5/35)*450 = 480-354 = 126
                -->
                <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Area fill between the two curves -->
                        <linearGradient id="gapGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="rgba(168, 85, 247, 0.08)"/>
                            <stop offset="100%" stop-color="rgba(0, 212, 255, 0.06)"/>
                        </linearGradient>
                        <!-- Area fill under femmes curve -->
                        <linearGradient id="areaFemmes" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="rgba(168, 85, 247, 0.12)"/>
                            <stop offset="100%" stop-color="rgba(168, 85, 247, 0.02)"/>
                        </linearGradient>
                        <!-- Area fill under hommes curve -->
                        <linearGradient id="areaHommes" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="rgba(0, 212, 255, 0.1)"/>
                            <stop offset="100%" stop-color="rgba(0, 212, 255, 0.01)"/>
                        </linearGradient>
                    </defs>

                    <!-- Horizontal grid lines -->
                    <line x1="60" y1="157" x2="930" y2="157" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    <line x1="60" y1="287" x2="930" y2="287" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    <line x1="60" y1="416" x2="930" y2="416" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

                    <!-- Y-axis labels (ans) -->
                    <text x="45" y="98" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="17">90</text>
                    <text x="45" y="162" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="17">85</text>
                    <text x="45" y="227" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="17">80</text>
                    <text x="45" y="292" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="17">75</text>
                    <text x="45" y="356" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="17">70</text>
                    <text x="45" y="420" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="17">65</text>
                    <text x="45" y="485" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="17">60</text>

                    <!-- X-axis line -->
                    <line x1="60" y1="480" x2="930" y2="480" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

                    <!-- X-axis labels -->
                    <text x="60" y="498" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="16">1950</text>
                    <text x="205" y="498" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="16">1970</text>
                    <text x="350" y="498" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="16">1990</text>
                    <text x="495" y="498" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="16">2010</text>
                    <text x="604" y="498" text-anchor="middle" fill="#00ff88" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">2025</text>
                    <text x="785" y="498" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="16">2050</text>
                    <text x="930" y="498" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="16">2070</text>

                    <!-- Area fill under femmes curve -->
                    <path d="M60,362 C90,340 115,315 133,305 C155,292 180,282 205,276 C235,262 258,252 278,243 C308,228 330,218 350,211 C380,198 402,192 423,187 C452,177 475,168 495,164 C525,160 548,158 568,157 C580,153 594,150 604,147 C650,135 685,124 713,116 C775,104 870,97 930,94 L930,480 L60,480 Z" fill="url(#areaFemmes)" opacity="0.6"/>

                    <!-- Area fill under hommes curve -->
                    <path d="M60,436 C90,420 115,400 133,390 C155,384 180,378 205,372 C235,363 258,355 278,349 C308,335 330,325 350,317 C380,302 402,292 423,283 C452,266 475,256 495,249 C525,243 548,237 568,234 C580,228 594,223 604,218 C650,200 685,188 713,178 C775,156 870,136 930,126 L930,480 L60,480 Z" fill="url(#areaHommes)" opacity="0.5"/>

                    <!-- FEMMES — Historical curve (solid) -->
                    <path d="M60,362 C90,340 115,315 133,305 C155,292 180,282 205,276 C235,262 258,252 278,243 C308,228 330,218 350,211 C380,198 402,192 423,187 C452,177 475,168 495,164 C525,160 548,158 568,157 C580,153 594,150 604,147" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round"/>

                    <!-- FEMMES — Projected (dashed) -->
                    <path d="M604,147 C650,135 685,124 713,116 C775,104 870,97 930,94" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="10,7" stroke-linecap="round" opacity="0.7"/>

                    <!-- HOMMES — Historical curve (solid) -->
                    <path d="M60,436 C90,420 115,400 133,390 C155,384 180,378 205,372 C235,363 258,355 278,349 C308,335 330,325 350,317 C380,302 402,292 423,283 C452,266 475,256 495,249 C525,243 548,237 568,234 C580,228 594,223 604,218" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>

                    <!-- HOMMES — Projected (dashed) -->
                    <path d="M604,218 C650,200 685,188 713,178 C775,156 870,136 930,126" fill="none" stroke="#00d4ff" stroke-width="3" stroke-dasharray="10,7" stroke-linecap="round" opacity="0.7"/>

                    <!-- No vertical line -->

                    <!-- ===== DATA POINTS ===== -->

                    <!-- Femmes 1950 -->
                    <circle cx="60" cy="362" r="7" fill="#06080c" stroke="#a855f7" stroke-width="3"/>
                    <text x="78" y="380" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">69,2</text>

                    <!-- Hommes 1950 -->
                    <circle cx="60" cy="436" r="7" fill="#06080c" stroke="#00d4ff" stroke-width="3"/>
                    <text x="78" y="448" fill="#00d4ff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">63,4</text>

                    <!-- Femmes 2025 -->
                    <circle cx="604" cy="147" r="8" fill="#06080c" stroke="#a855f7" stroke-width="3.5"/>
                    <text x="604" y="130" text-anchor="middle" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700">85,9</text>

                    <!-- Hommes 2025 -->
                    <circle cx="604" cy="218" r="8" fill="#06080c" stroke="#00d4ff" stroke-width="3.5"/>
                    <text x="604" y="260" text-anchor="middle" fill="#00d4ff" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700">80,4</text>

                    <!-- Femmes 2070 -->
                    <circle cx="930" cy="94" r="7" fill="#06080c" stroke="#a855f7" stroke-width="3"/>
                    <text x="912" y="80" text-anchor="end" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">90,0</text>

                    <!-- Hommes 2070 -->
                    <circle cx="930" cy="126" r="7" fill="#06080c" stroke="#00d4ff" stroke-width="3"/>
                    <text x="912" y="160" text-anchor="end" fill="#00d4ff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">87,5</text>

                    <!-- "Projection" label -->
                    <text x="770" y="75" text-anchor="middle" fill="#8899a8" font-family="Syne, sans-serif" font-size="15" font-style="italic" opacity="0.5">projection INSEE</text>
                </svg>
            </div>

            <div class="footer">
                <div class="source">Espérance de vie à la naissance · <span>INSEE, INED · 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

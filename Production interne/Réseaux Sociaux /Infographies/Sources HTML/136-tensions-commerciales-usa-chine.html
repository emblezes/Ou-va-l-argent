<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pékin presse Washington sur les droits de douane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #081518; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-orange: #ff9f43; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #081518 0%, #0a3540 50%, #081518 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: var(--accent-electric); font-style: italic; }
        .chart-unit { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.5rem; color: var(--text-secondary); text-align: center; margin: 30px 0 40px 0; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 80px; }
        .bar-container { width: 100%; max-width: 800px; margin-bottom: 40px; }
        .bar-item { margin-bottom: 50px; }
        .bar-header { display: flex; justify-content: between; align-items: baseline; margin-bottom: 12px; }
        .bar-label { font-size: 1.8rem; color: var(--text-primary); font-weight: 500; flex: 1; }
        .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 2.8rem; font-weight: 700; color: var(--text-primary); margin-left: 20px; }
        .bar-track { width: 100%; height: 60px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; }
        .bar-fill-1 { width: 100%; background: linear-gradient(90deg, rgba(0,212,255,0.4) 0%, #00d4ff 100%); }
        .bar-fill-2 { width: 60%; background: linear-gradient(90deg, rgba(255,159,67,0.4) 0%, #ff9f43 100%); }
        .comparison-card { background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2); border-radius: 12px; padding: 30px; text-align: center; margin-top: 20px; }
        .comparison-value { font-family: 'JetBrains Mono', monospace; font-size: 3.2rem; font-weight: 700; color: var(--accent-electric); }
        .comparison-label { font-size: 1.4rem; color: var(--text-secondary); margin-top: 8px; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="tensions-commerciales-usa-chine">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">Pékin presse Washington<br><span class="accent">sur les droits de douane</span></h2>
            <div class="chart-unit">taux moyens appliqués en %</div>
            <div class="center-area">
                <div class="bar-container">
                    <div class="bar-item">
                        <div class="bar-header">
                            <div class="bar-label">Droits de douane US sur la Chine</div>
                            <div class="bar-value">25%</div>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill bar-fill-1"></div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-header">
                            <div class="bar-label">Droits de douane CN sur les USA</div>
                            <div class="bar-value">15%</div>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill bar-fill-2"></div>
                        </div>
                    </div>
                </div>
                <div class="comparison-card">
                    <div class="comparison-value">+10 pts</div>
                    <div class="comparison-label">d'écart entre les USA et la Chine</div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>Challenges · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

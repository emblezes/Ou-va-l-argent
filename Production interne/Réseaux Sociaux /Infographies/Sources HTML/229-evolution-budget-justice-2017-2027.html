<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le budget de la justice a bondi de 6,9 à 10,8 Md€</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --bg-mid:  #142b48;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0, 255, 136, 0.09) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 60px 40px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 5.2rem; text-align: center; color: var(--text-primary); line-height: 1.04; margin-top: 18px; letter-spacing: -1.8px; }
        .chart-title .accent-green { color: var(--accent-green); font-style: italic; }
        .subtitle { text-align: center; font-size: 1.15rem; color: var(--text-secondary); margin-top: 14px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }

        .chart-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0 8px; min-height: 0; }
        .line-chart-wrap { width: 100%; max-width: 980px; }
        .line-chart-wrap svg { width: 100%; height: auto; display: block; }
        .line-chart-axis-label { font-family: 'JetBrains Mono', monospace; font-size: 1rem; fill: var(--text-primary); }
        .line-chart-tick { font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; fill: var(--text-primary); }
        .line-chart-end-label { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }
        .line-chart-note { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; fill: var(--text-secondary); }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; margin-top: 6px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">Le budget de la justice a <span class="accent-green">bondi</span><br>de 6,9 à 10,8 Md€ en 10 ans</h2>
            <div class="subtitle">Budget du ministère de la Justice · 2017-2027 · Milliards €</div>

            <div class="chart-area">
                <div class="line-chart-wrap">
                    <svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg">
                        <!-- Axe Y -->
                        <g>
                            <line x1="60" y1="50" x2="60" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                            <text class="line-chart-axis-label" x="22" y="65">12</text>
                            <text class="line-chart-axis-label" x="28" y="155">9</text>
                            <text class="line-chart-axis-label" x="28" y="245">6</text>
                            <text class="line-chart-axis-label" x="28" y="335">3</text>
                            <text class="line-chart-axis-label" x="28" y="425">0</text>
                        </g>
                        <!-- Aire sous la courbe -->
                        <polygon fill="rgba(0,255,136,0.08)" points="60,213 306,195 552,132 716,114 880,98 880,420 60,420"/>
                        <!-- Segment réalisé (plein) -->
                        <polyline fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
                            points="60,213 306,195 552,132 716,114"/>
                        <!-- Segment projeté vers la cible 2027 (pointillés) -->
                        <polyline fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" opacity="0.7"
                            points="716,114 880,98"/>
                        <!-- Points -->
                        <circle cx="60"  cy="213" r="6" fill="#00ff88"/>
                        <circle cx="306" cy="195" r="6" fill="#00ff88"/>
                        <circle cx="552" cy="132" r="6" fill="#00ff88"/>
                        <circle cx="716" cy="114" r="6" fill="#00ff88"/>
                        <circle cx="880" cy="98"  r="7" fill="#00ff88" stroke="#0a1220" stroke-width="2"/>
                        <!-- Labels collés aux points -->
                        <text class="line-chart-end-label" fill="#00ff88" x="60" y="198">6,9 Md€</text>
                        <text class="line-chart-end-label" fill="#00ff88" x="770" y="80">10,8 Md€</text>
                        <text class="line-chart-note" x="788" y="100">cible 2027</text>
                        <!-- Axe X -->
                        <g>
                            <text class="line-chart-tick" x="60"  y="450" text-anchor="middle">2017</text>
                            <text class="line-chart-tick" x="306" y="450" text-anchor="middle">2020</text>
                            <text class="line-chart-tick" x="552" y="450" text-anchor="middle">2023</text>
                            <text class="line-chart-tick" x="716" y="450" text-anchor="middle">2025</text>
                            <text class="line-chart-tick" x="880" y="450" text-anchor="middle">2027</text>
                        </g>
                    </svg>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Ministère de la Justice · loi de programmation 2023-2027</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

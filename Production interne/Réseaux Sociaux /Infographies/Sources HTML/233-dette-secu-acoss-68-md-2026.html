<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La dette de la Sécu repart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220; --bg-mid: #142b48;
            --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a;
            --accent-electric: #00d4ff; --accent-red: #ff4757; --accent-green: #00ff88;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.12) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 71, 87, 0.07) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 60px 40px; display: flex; flex-direction: column; }
        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 5.4rem; text-align: center; color: var(--text-primary); line-height: 1.02; margin-top: 18px; letter-spacing: -1.8px; text-wrap: balance; }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }
        .subtitle { text-align: center; font-size: 1.55rem; color: var(--text-secondary); margin-top: 16px; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }

        .chart-area { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding: 40px 0 8px; min-height: 0; }
        .stage { position: relative; width: 660px; height: 500px; display: flex; align-items: flex-end; justify-content: center; gap: 110px; }
        .plafond { position: absolute; left: 0; right: 0; bottom: 408px; border-top: 2px dashed rgba(0, 212, 255, 0.55); }
        .plafond .plabel { position: absolute; left: 0; top: -30px; font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 600; color: var(--accent-electric); }
        .bar-group { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; color: var(--text-primary); line-height: 1; }
        .bar-value .unit { font-size: 1.4rem; color: var(--text-secondary); font-weight: 500; }
        .bar-value.last { color: var(--accent-red); font-size: 3.1rem; }
        .bar-value.last .unit { color: var(--accent-red); font-size: 1.7rem; }
        .bar-fill { width: 170px; border-radius: 12px 12px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
        .bar-fill.neutral { background: linear-gradient(180deg, #4a6580 0%, #2d4060 100%); }
        .bar-fill.last { background: linear-gradient(180deg, #ff4757 0%, #b02a36 100%); box-shadow: 0 0 50px rgba(255, 71, 87, 0.55); }
        .bar-label { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: var(--text-secondary); font-weight: 600; text-align: center; }
        .bar-label.last { color: var(--accent-red); }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; margin-top: 6px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.95rem; color: var(--text-muted); } .source span { color: var(--text-secondary); }
        .website { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
        .website-url { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); line-height: 1; }
        .socials { display: flex; align-items: center; gap: 9px; }
        .socials svg { width: 17px; height: 17px; fill: var(--text-secondary); display: block; }
        .socials .handle { font-family: 'JetBrains Mono', monospace; font-size: 1rem; color: var(--text-secondary); letter-spacing: 0.2px; }
    </style>
</head>
<body>
    <div class="infographic">

            <div class="chart-area">
                <div class="stage">
                    <div class="bar-group">
                        <div class="bar-value">59<span class="unit"> Md€</span></div>
                        <div class="bar-fill neutral" style="height: 373px;"></div>
                        <div class="bar-label">fin 2025</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-value last">68<span class="unit"> Md€</span></div>
                        <div class="bar-fill last" style="height: 430px;"></div>
                        <div class="bar-label last">fin 2026</div>
                    </div>
                </div>
            </div>

</html>

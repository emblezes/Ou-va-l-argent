<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>4 fois plus d'impôts que d'économies en 2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #0a1220 0%, #142b48 50%, #0a1220 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.10) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 255, 136, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 60px 40px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4.8rem; text-align: center; color: var(--text-primary); line-height: 1.05; margin-top: 24px; letter-spacing: -1.5px; }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }
        .subtitle { text-align: center; font-size: 1.1rem; color: var(--text-secondary); margin-top: 18px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }

        .chart-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 0; }

        .bars-stack { display: flex; flex-direction: column; align-items: center; position: relative; gap: 0; }

        .top-label { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 600; color: var(--text-primary); margin-bottom: 14px; }
        .top-value { font-family: 'JetBrains Mono', monospace; font-size: 2.6rem; font-weight: 700; color: var(--accent-red); margin-bottom: 14px; }

        .bar-up { width: 240px; height: 280px; background: linear-gradient(180deg, #ff4757 0%, #c0263a 100%); border-radius: 10px 10px 0 0; box-shadow: 0 0 40px rgba(255, 71, 87, 0.55); }
        .bar-down { width: 240px; height: 72px; background: linear-gradient(180deg, #00ff88 0%, #00cc6a 100%); border-radius: 0 0 10px 10px; box-shadow: 0 0 30px rgba(0, 255, 136, 0.45); }

        .axis { width: 480px; height: 2px; background: rgba(255,255,255,0.4); position: relative; }
        .axis-label { position: absolute; left: -32px; top: 50%; transform: translateY(-50%); font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--text-muted); }

        .bottom-value { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; color: var(--accent-green); margin-top: 14px; }
        .bottom-label { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 600; color: var(--text-primary); margin-top: 14px; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; margin-top: 22px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">4× plus <span class="accent">d'impôts</span><br>que d'économies</h2>
            <div class="subtitle">Comment l'État a réduit son déficit en 2025 · Milliards €</div>

            <div class="chart-area">
                <div class="bars-stack">
                    <div class="top-label">Nouveaux impôts</div>
                    <div class="top-value">+14,4</div>
                    <div class="bar-up"></div>
                    <div class="axis"><span class="axis-label">0</span></div>
                    <div class="bar-down"></div>
                    <div class="bottom-value">−3,7</div>
                    <div class="bottom-label">Économies pérennes</div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Cour des comptes · Le budget de l'État en 2025 · avril 2026</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

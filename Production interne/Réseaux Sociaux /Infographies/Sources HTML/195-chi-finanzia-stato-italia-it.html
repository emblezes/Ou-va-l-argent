<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo un terzo degli italiani finanzia lo Stato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --bg-surface: #0a0e14; --bg-elevated: #111820; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43; --glass: rgba(17, 24, 32, 0.85); --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 255, 136, 0.12) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%); bottom: -150px; left: -150px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 44px 55px 36px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-container { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .section-title { font-family: 'Instrument Serif', serif; font-size: 4.5rem; text-align: center; margin-bottom: 8px; color: var(--text-primary); line-height: 1.05; }
        .section-title .accent { color: var(--accent-green); font-style: italic; }
        .section-title .red { color: var(--accent-red); font-style: italic; }
        .subtitle { font-size: 1.25rem; color: var(--text-secondary); text-align: center; margin-bottom: 50px; }
        .subtitle strong { color: var(--accent-gold); }

        .pie-wrapper { display: flex; justify-content: center; align-items: center; }
        .pie-wrapper svg { overflow: visible; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: auto; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.9rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="chart-container">
                <h2 class="section-title">Solo <span class="accent">un terzo</span> degli italiani<br><span class="red">finanzia lo Stato</span></h2>
                <div class="subtitle">Su <strong>58,9 milioni</strong> di italiani, <strong>17,7 milioni</strong> finanziano i servizi pubblici</div>

                <div class="pie-wrapper">
                    <svg viewBox="-480 -320 960 640" width="960" height="640">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="4" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                            <radialGradient id="centerGrad">
                                <stop offset="0%" stop-color="#0a1628"/>
                                <stop offset="100%" stop-color="#06080c"/>
                            </radialGradient>
                        </defs>

                        <!-- DONUT — outer R=220, inner R=120 -->
                        <!-- Angles from top (0,-R), clockwise -->
                        <!-- Settore privato  30.0% →   0.0° – 108.0° -->
                        <!-- Pensionati       27.7% → 108.0° – 207.7° -->
                        <!-- Minori           16.8% → 207.7° – 268.2° -->
                        <!-- Dip. pubblici     5.4% → 268.2° – 287.6° -->
                        <!-- Studenti          3.4% → 287.6° – 299.9° -->
                        <!-- Disoccupati       2.5% → 299.9° – 308.9° -->
                        <!-- Inattivi         14.2% → 308.9° – 360.0° -->

                        <!-- Settore privato 30% (0°→108°) — green -->
                        <path d="M 0,-220 A 220,220 0 0,1 209.2,68.0 L 114.1,37.1 A 120,120 0 0,0 0,-120 Z" fill="#00ff88" filter="url(#glow)"/>

                        <!-- Pensionati 27.7% (108°→207.7°) — red -->
                        <path d="M 209.2,68.0 A 220,220 0 0,1 -102.3,194.8 L -55.8,106.2 A 120,120 0 0,0 114.1,37.1 Z" fill="#ff4757"/>

                        <!-- Minori 16.8% (207.7°→268.2°) — pink -->
                        <path d="M -102.3,194.8 A 220,220 0 0,1 -219.9,6.9 L -119.9,3.8 A 120,120 0 0,0 -55.8,106.2 Z" fill="#ff6b81"/>

                        <!-- Dipendenti pubblici 5.4% (268.2°→287.6°) — gold -->
                        <path d="M -219.9,6.9 A 220,220 0 0,1 -209.6,-66.8 L -114.3,-36.4 A 120,120 0 0,0 -119.9,3.8 Z" fill="#ffd700"/>

                        <!-- Studenti 3.4% (287.6°→299.9°) — purple -->
                        <path d="M -209.6,-66.8 A 220,220 0 0,1 -190.7,-109.7 L -104.0,-59.8 A 120,120 0 0,0 -114.3,-36.4 Z" fill="#a855f7"/>

                        <!-- Disoccupati 2.5% (299.9°→308.9°) — gray -->
                        <path d="M -190.7,-109.7 A 220,220 0 0,1 -171.4,-138.0 L -93.5,-75.3 A 120,120 0 0,0 -104.0,-59.8 Z" fill="#636e72"/>

                        <!-- Inattivi 14.2% (308.9°→360°) — dark blue -->
                        <path d="M -171.4,-138.0 A 220,220 0 0,1 0,-220 L 0,-120 A 120,120 0 0,0 -93.5,-75.3 Z" fill="#2d5a8e"/>

                        <!-- Center circle -->
                        <circle cx="0" cy="0" r="105" fill="#06080c"/>
                        <circle cx="0" cy="0" r="105" fill="url(#centerGrad)" opacity="0.5"/>

                        <!-- Center text -->
                        <text x="0" y="-8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="42" font-weight="700" fill="#00ff88">30%</text>
                        <text x="0" y="24" text-anchor="middle" font-family="Syne, sans-serif" font-size="16" fill="#8899a8">contribuiscono</text>

                        <!-- ===== LEADER LINES + LABELS ===== -->

                        <!-- Settore privato — midpoint 54° → (178, -129) → right -->
                        <line x1="178" y1="-129" x2="280" y2="-110" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
                        <line x1="280" y1="-110" x2="440" y2="-110" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
                        <circle cx="178" cy="-129" r="5" fill="#00ff88"/>
                        <text x="290" y="-130" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Settore privato</text>
                        <text x="290" y="-82" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#00ff88">17,7M</text>
                        <text x="400" y="-82" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">30%</text>

                        <!-- Pensionati — midpoint 158° → (83, 204) → right -->
                        <line x1="83" y1="204" x2="280" y2="170" stroke="#ff4757" stroke-width="2" opacity="0.7"/>
                        <line x1="280" y1="170" x2="440" y2="170" stroke="#ff4757" stroke-width="2" opacity="0.7"/>
                        <circle cx="83" cy="204" r="5" fill="#ff4757"/>
                        <text x="290" y="150" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Pensionati</text>
                        <text x="290" y="198" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#ff4757">16,3M</text>
                        <text x="400" y="198" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">27,7%</text>

                        <!-- Minori — midpoint 238° → (-187, 116) → left -->
                        <line x1="-187" y1="116" x2="-280" y2="120" stroke="#ff6b81" stroke-width="2" opacity="0.7"/>
                        <line x1="-280" y1="120" x2="-440" y2="120" stroke="#ff6b81" stroke-width="2" opacity="0.7"/>
                        <circle cx="-187" cy="116" r="5" fill="#ff6b81"/>
                        <text x="-440" y="100" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Minori</text>
                        <text x="-440" y="148" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#ff6b81">9,9M</text>
                        <text x="-360" y="148" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">16,8%</text>

                        <!-- Dipendenti pubblici — midpoint 278° → (-218, -30) → left -->
                        <line x1="-218" y1="-30" x2="-280" y2="-25" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
                        <line x1="-280" y1="-25" x2="-440" y2="-25" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
                        <circle cx="-218" cy="-30" r="5" fill="#ffd700"/>
                        <text x="-440" y="-45" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Dipendenti pubblici</text>
                        <text x="-440" y="3" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#ffd700">3,2M</text>
                        <text x="-360" y="3" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">5,4%</text>

                        <!-- Studenti — midpoint 294° → (-201, -89) → left -->
                        <line x1="-201" y1="-89" x2="-280" y2="-155" stroke="#a855f7" stroke-width="2" opacity="0.7"/>
                        <line x1="-280" y1="-155" x2="-440" y2="-155" stroke="#a855f7" stroke-width="2" opacity="0.7"/>
                        <circle cx="-201" cy="-89" r="5" fill="#a855f7"/>
                        <text x="-440" y="-175" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Studenti</text>
                        <text x="-440" y="-127" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#a855f7">2,0M</text>
                        <text x="-365" y="-127" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">3,4%</text>

                        <!-- Disoccupati — midpoint 304° → (-182, -124) → left-up -->
                        <line x1="-182" y1="-124" x2="-280" y2="-270" stroke="#636e72" stroke-width="2" opacity="0.7"/>
                        <line x1="-280" y1="-270" x2="-440" y2="-270" stroke="#636e72" stroke-width="2" opacity="0.7"/>
                        <circle cx="-182" cy="-124" r="5" fill="#636e72"/>
                        <text x="-440" y="-290" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Disoccupati</text>
                        <text x="-440" y="-242" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#636e72">1,5M</text>
                        <text x="-365" y="-242" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">2,5%</text>

                        <!-- Inattivi — midpoint 334° → (-95, -199) → right-up -->
                        <line x1="-95" y1="-199" x2="100" y2="-280" stroke="#2d5a8e" stroke-width="2" opacity="0.7"/>
                        <line x1="100" y1="-280" x2="300" y2="-280" stroke="#2d5a8e" stroke-width="2" opacity="0.7"/>
                        <circle cx="-95" cy="-199" r="5" fill="#2d5a8e"/>
                        <text x="110" y="-300" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Inattivi / Altro</text>
                        <text x="110" y="-252" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#2d5a8e">8,3M</text>
                        <text x="215" y="-252" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">14,1%</text>
                    </svg>
                </div>
            </div>

            <div class="footer">
                <div class="source">Fonte : <span>ISTAT, INPS, MUR — 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

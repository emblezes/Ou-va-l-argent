<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Évolution de la croissance française</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Variant B — Nuit profonde + Or/Ambre */
        :root {
            --bg-deep: #050d1a;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1e3d 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
            top: -200px;
            left: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.06) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 55px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #ffd700; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5.5rem;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: #ffd700;
            font-style: italic;
        }

        .chart-subtitle {
            text-align: center;
            font-size: 1.4rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .chart-area {
            flex: 1;
            position: relative;
            margin: 0 5px;
        }

        .chart-area svg {
            width: 100%;
            height: 100%;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: 8px;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: #ffd700; }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">La baisse structurelle de la<br><span class="accent">croissance</span> française</h2>
            <div class="chart-subtitle">Taux de croissance du PIB réel (%) depuis 1950 <span style="opacity:0.5; font-size:0.9rem;">(hors rebond post-COVID)</span></div>

            <div class="chart-area">
                <!--
                    Chart: 960 x 520 viewBox
                    X: 1950=60, 2025=930 → range 870px for 75 years
                    x(year) = 60 + (year-1950) * 11.6

                    Y range: -8% to +10% = 18 units
                    y(val) = 490 - ((val+8)/18) * 460
                    y(0%) = 286

                    Data points (with COVID drop, no rebound):
                    1950: +8.6% → (60, 66)
                    1960: +7.1% → (176, 104)
                    1970: +6.2% → (292, 127)
                    1975: -1.0% → (350, 311)
                    1980: +1.3% → (408, 252)
                    1990: +2.5% → (524, 222)
                    2000: +3.7% → (640, 191)
                    2009: -2.9% → (744, 360)
                    2019: +1.7% → (860, 245)
                    2020: -7.5% → (872, 477)
                    2023: +0.9% → (907, 263)
                    2025: +0.7% → (930, 268)
                -->
                <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="areaGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="rgba(255, 215, 0, 0.10)"/>
                            <stop offset="50%" stop-color="rgba(255, 171, 64, 0.08)"/>
                            <stop offset="100%" stop-color="rgba(255, 107, 107, 0.10)"/>
                        </linearGradient>
                        <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#ffd700"/>
                            <stop offset="40%" stop-color="#ffab40"/>
                            <stop offset="70%" stop-color="#ff9f43"/>
                            <stop offset="100%" stop-color="#ff6b6b"/>
                        </linearGradient>
                    </defs>

                    <!-- Horizontal grid lines -->
                    <line x1="60" y1="66" x2="930" y2="66" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    <line x1="60" y1="155" x2="930" y2="155" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    <line x1="60" y1="222" x2="930" y2="222" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                    <!-- 0% line — highlighted -->
                    <line x1="60" y1="286" x2="930" y2="286" stroke="rgba(255,215,0,0.20)" stroke-width="1.5" stroke-dasharray="8,6"/>
                    <line x1="60" y1="360" x2="930" y2="360" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

                    <!-- Y-axis labels -->
                    <text x="45" y="71" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="15">+10%</text>
                    <text x="45" y="160" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="15">+6%</text>
                    <text x="45" y="227" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="15">+2%</text>
                    <text x="45" y="291" text-anchor="end" fill="#ffd700" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">0%</text>
                    <text x="45" y="365" text-anchor="end" fill="#4a5a6a" font-family="JetBrains Mono, monospace" font-size="15">-3%</text>
                    <text x="45" y="482" text-anchor="end" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="15">-8%</text>

                    <!-- X-axis line -->
                    <line x1="60" y1="490" x2="930" y2="490" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

                    <!-- X-axis labels -->
                    <text x="60" y="510" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="15">1950</text>
                    <text x="292" y="510" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="15">1970</text>
                    <text x="524" y="510" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="15">1990</text>
                    <text x="640" y="510" text-anchor="middle" fill="#8899a8" font-family="JetBrains Mono, monospace" font-size="15">2000</text>
                    <text x="872" y="510" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">2020</text>
                    <text x="930" y="510" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600">2025</text>

                    <!-- Area fill under the curve -->
                    <path d="M60,66 C100,80 140,95 176,104 C210,115 255,122 292,127 C310,160 330,260 350,311 C370,280 390,260 408,252 C450,240 490,230 524,222 C560,215 600,200 640,191 C680,230 720,320 744,360 C770,310 820,252 860,245 C866,310 870,430 872,477 C880,380 895,280 907,263 C915,265 922,267 930,268 L930,490 L60,490 Z" fill="url(#areaGrad)" opacity="0.6"/>

                    <!-- Main curve -->
                    <path d="M60,66 C100,80 140,95 176,104 C210,115 255,122 292,127 C310,160 330,260 350,311 C370,280 390,260 408,252 C450,240 490,230 524,222 C560,215 600,200 640,191 C680,230 720,320 744,360 C770,310 820,252 860,245 C866,310 870,430 872,477 C880,380 895,280 907,263 C915,265 922,267 930,268" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

                    <!-- Annotation: Trente Glorieuses — above 1950 -->
                    <text x="80" y="22" fill="#ffd700" font-family="Syne, sans-serif" font-size="14" opacity="0.5" font-style="italic">Trente Glorieuses</text>

                    <!-- 1950: +8,6% — ABOVE -->
                    <circle cx="60" cy="66" r="7" fill="#050d1a" stroke="#ffd700" stroke-width="3"/>
                    <text x="80" y="55" fill="#ffd700" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">+8,6%</text>

                    <!-- 1960: +7,1% — ABOVE -->
                    <circle cx="176" cy="104" r="5" fill="#050d1a" stroke="#ffd700" stroke-width="2.5"/>
                    <text x="176" y="85" text-anchor="middle" fill="#ffd700" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">+7,1%</text>

                    <!-- 1970: +6,2% — ABOVE -->
                    <circle cx="292" cy="127" r="5" fill="#050d1a" stroke="#ffd700" stroke-width="2.5"/>
                    <text x="292" y="108" text-anchor="middle" fill="#ffd700" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">+6,2%</text>

                    <!-- 1975: -1,0% — BELOW (choc pétrolier) -->
                    <circle cx="350" cy="311" r="6" fill="#050d1a" stroke="#ffab40" stroke-width="3"/>
                    <text x="350" y="340" text-anchor="middle" fill="#ffab40" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">-1,0%</text>
                    <text x="350" y="358" text-anchor="middle" fill="#ffab40" font-family="Syne, sans-serif" font-size="13" opacity="0.6" font-style="italic">Choc pétrolier</text>

                    <!-- 1980: +1,3% — ABOVE -->
                    <circle cx="408" cy="252" r="5" fill="#050d1a" stroke="#ffab40" stroke-width="2.5"/>
                    <text x="408" y="233" text-anchor="middle" fill="#ffab40" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">+1,3%</text>

                    <!-- 1990: +2,5% — ABOVE -->
                    <circle cx="524" cy="222" r="5" fill="#050d1a" stroke="#ff9f43" stroke-width="2.5"/>
                    <text x="524" y="203" text-anchor="middle" fill="#ff9f43" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">+2,5%</text>

                    <!-- 2000: +3,7% — ABOVE -->
                    <circle cx="640" cy="191" r="5" fill="#050d1a" stroke="#ff9f43" stroke-width="2.5"/>
                    <text x="640" y="172" text-anchor="middle" fill="#ff9f43" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">+3,7%</text>

                    <!-- 2009: -2.9% — BELOW (crise financière) -->
                    <circle cx="744" cy="360" r="6" fill="#050d1a" stroke="#ff6b6b" stroke-width="3"/>
                    <text x="744" y="390" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700">-2,9%</text>
                    <text x="744" y="408" text-anchor="middle" fill="#ff6b6b" font-family="Syne, sans-serif" font-size="13" opacity="0.6" font-style="italic">Crise financière</text>

                    <!-- 2019: +1,7% — ABOVE -->
                    <circle cx="860" cy="245" r="5" fill="#050d1a" stroke="#ff6b6b" stroke-width="2.5"/>
                    <text x="845" y="226" text-anchor="middle" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">+1,7%</text>

                    <!-- 2020: -7,5% — BELOW (COVID) -->
                    <circle cx="872" cy="477" r="7" fill="#050d1a" stroke="#ff6b6b" stroke-width="3.5"/>
                    <text x="848" y="468" text-anchor="end" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700">-7,5%</text>
                    <text x="848" y="484" text-anchor="end" fill="#ff6b6b" font-family="Syne, sans-serif" font-size="13" opacity="0.7" font-style="italic">COVID-19</text>

                    <!-- 2025: +0,7% — BELOW, small font, far right -->
                    <circle cx="930" cy="268" r="6" fill="#050d1a" stroke="#ff6b6b" stroke-width="3"/>
                    <text x="945" y="290" text-anchor="end" fill="#ff6b6b" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">+0,7%</text>
                    <text x="945" y="305" text-anchor="end" fill="#ff6b6b" font-family="Syne, sans-serif" font-size="11" font-style="italic" opacity="0.5">prévision</text>
                </svg>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>INSEE, Banque de France · 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La construction neuve s'est effondrée en un an</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --bg-mid:  #142b48;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.10) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 40px 60px 28px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4.8rem; text-align: center; color: var(--text-primary); line-height: 1.05; margin-top: 22px; letter-spacing: -1.6px; }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }
        .subtitle { text-align: center; font-size: 1.15rem; color: var(--text-secondary); margin-top: 14px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }

        .chart-area { flex: 1; display: flex; align-items: stretch; justify-content: center; padding: 18px 0 0; min-height: 0; overflow: hidden; }
        .chart-wrap { width: 100%; max-width: 960px; min-height: 0; }
        .chart-wrap svg { width: 100%; height: 100%; display: block; }

        .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;  fill: var(--text-primary); }
        .tick       { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; fill: var(--text-primary); font-weight: 600; }
        .bar-value  { font-family: 'JetBrains Mono', monospace; font-size: 1.85rem; font-weight: 700; }
        .bar-value.from { fill: var(--text-secondary); }
        .bar-value.to   { fill: var(--accent-red); }
        .delta-label { font-family: 'Syne', sans-serif; font-size: 2.4rem; font-weight: 800; fill: var(--accent-red); }

        .legend { display: flex; justify-content: center; gap: 40px; padding: 12px 0 4px; }
        .legend-item { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
        .legend-dot { width: 22px; height: 22px; border-radius: 5px; }
        .legend-dot.from { background: linear-gradient(180deg, #4a6580 0%, #2d4060 100%); }
        .legend-dot.to   { background: linear-gradient(180deg, #ff4757 0%, #c0263a 100%); }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: 6px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">La construction neuve<br>s'est <span class="accent">effondrée</span> en un an</h2>
            <div class="subtitle">France · Variation 2022 → 2023 · Milliers</div>

            <div class="chart-area">
                <div class="chart-wrap">
                    <svg viewBox="0 0 960 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gradFrom" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#4a6580"/>
                                <stop offset="100%" stop-color="#2d4060"/>
                            </linearGradient>
                            <linearGradient id="gradTo" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#ff4757"/>
                                <stop offset="100%" stop-color="#c0263a"/>
                            </linearGradient>
                            <filter id="redGlow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                        </defs>

                        <!-- Axe Y : zone y[60..620], baseline 620. Echelle 0-500k pour permis (500=560px). 1k = 1.12px -->
                        <g>
                            <line x1="100" y1="60" x2="100" y2="620" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                            <text class="axis-label" x="88" y="68"  text-anchor="end">500</text>
                            <text class="axis-label" x="88" y="180" text-anchor="end">400</text>
                            <text class="axis-label" x="88" y="292" text-anchor="end">300</text>
                            <text class="axis-label" x="88" y="404" text-anchor="end">200</text>
                            <text class="axis-label" x="88" y="516" text-anchor="end">100</text>
                            <text class="axis-label" x="88" y="625" text-anchor="end">0</text>
                            <line x1="100" y1="180" x2="900" y2="180" stroke="rgba(255,255,255,0.05)"/>
                            <line x1="100" y1="292" x2="900" y2="292" stroke="rgba(255,255,255,0.05)"/>
                            <line x1="100" y1="404" x2="900" y2="404" stroke="rgba(255,255,255,0.05)"/>
                            <line x1="100" y1="516" x2="900" y2="516" stroke="rgba(255,255,255,0.05)"/>
                            <line x1="100" y1="620" x2="900" y2="620" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
                        </g>

                        <!-- 3 catégories. Largeur bar=58, intra-groupe=14, inter=120. Centre-groupe : 240, 510, 780 -->

                        <!-- Permis de construire : 487 → 372 (-24%) -->
                        <rect x="182" y="74"  width="58" height="546" fill="url(#gradFrom)" rx="5"/>
                        <text class="bar-value from" x="211" y="62" text-anchor="middle">487</text>
                        <rect x="254" y="203" width="58" height="417" fill="url(#gradTo)" rx="5"/>
                        <text class="bar-value to"   x="283" y="191" text-anchor="middle">372</text>
                        <text class="delta-label"    x="247" y="140" text-anchor="middle">−24 %</text>
                        <text class="tick" x="247" y="678" text-anchor="middle">Permis</text>

                        <!-- Mises en chantier : 370 → 290 (-22%) -->
                        <rect x="452" y="206" width="58" height="414" fill="url(#gradFrom)" rx="5"/>
                        <text class="bar-value from" x="481" y="194" text-anchor="middle">370</text>
                        <rect x="524" y="295" width="58" height="325" fill="url(#gradTo)" rx="5"/>
                        <text class="bar-value to"   x="553" y="283" text-anchor="middle">290</text>
                        <text class="delta-label"    x="517" y="150" text-anchor="middle">−22 %</text>
                        <text class="tick" x="517" y="678" text-anchor="middle">Chantiers</text>

                        <!-- Ventes de logements neufs : 110 → 77 (-30%) -->
                        <rect x="722" y="497" width="58" height="123" fill="url(#gradFrom)" rx="5"/>
                        <text class="bar-value from" x="751" y="485" text-anchor="middle">110</text>
                        <rect x="794" y="534" width="58" height="86"  fill="url(#gradTo)" rx="5" filter="url(#redGlow)"/>
                        <text class="bar-value to"   x="823" y="522" text-anchor="middle">77</text>
                        <text class="delta-label"    x="787" y="440" text-anchor="middle">−30 %</text>
                        <text class="tick" x="787" y="678" text-anchor="middle">Ventes neuves</text>
                    </svg>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="legend-dot from"></div>2022</div>
                <div class="legend-item"><div class="legend-dot to"></div>2023</div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Rapport du Sénat sur la crise du logement · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

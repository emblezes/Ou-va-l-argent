<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre de fonctionnaires pour 1 000 habitants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0c1a35;
            --bg-mid: #142d5c;
            --accent: #ffd700;
            --accent-electric: #ffd700;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }
        .bg-base {
            position: absolute; inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255, 215, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .bg-glow-1 {
            position: absolute; width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.12) 0%, transparent 70%);
            top: -250px; right: -150px; pointer-events: none;
        }
        .bg-glow-2 {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.06) 0%, transparent 70%);
            bottom: -200px; left: -100px; pointer-events: none;
        }
        .content {
            position: relative; z-index: 1; height: 100%;
            padding: 40px 55px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .top-row {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.5rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }
        .tag-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem; font-weight: 700;
            color: var(--accent);
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            letter-spacing: 0.05em;
        }
        .main-content {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            gap: 28px; padding: 10px 0;
        }
        .title {
            font-family: 'Instrument Serif', serif;
            font-size: 5rem;
            color: #f0f4f8;
            line-height: 1.1;
            text-align: center;
        }
        .title .accent {
            color: var(--accent);
            font-style: italic;
        }
        .ranking {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .rank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid rgba(255, 255, 255, 0.15);
            border-radius: 0 12px 12px 0;
        }
        .rank-row.first {
            background: rgba(255, 215, 0, 0.08);
            border-left-color: var(--accent);
        }
        .rank-city {
            font-family: 'Syne', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: rgba(240, 244, 248, 0.7);
        }
        .rank-row.first .rank-city {
            color: var(--accent);
            font-size: 3.2rem;
        }
        .rank-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: rgba(240, 244, 248, 0.5);
        }
        .rank-row.first .rank-value {
            color: var(--accent);
            font-size: 3.4rem;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .footer {
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .source {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.3);
        }
        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-electric);
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="top-row">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>
            <div class="main-content">
                <div class="title">Nombre de <span class="accent">fonctionnaires</span><br>pour 1 000 habitants</div>
                <div class="ranking">
                    <div class="rank-row first">
                        <div class="rank-city">Paris</div>
                        <div class="rank-value">25</div>
                    </div>
                    <div class="rank-row">
                        <div class="rank-city">Amsterdam</div>
                        <div class="rank-value">18,7</div>
                    </div>
                    <div class="rank-row">
                        <div class="rank-city">Milan</div>
                        <div class="rank-value">9,5</div>
                    </div>
                    <div class="rank-row">
                        <div class="rank-city">Madrid</div>
                        <div class="rank-value">7,9</div>
                    </div>
                    <div class="rank-row">
                        <div class="rank-city">Rome</div>
                        <div class="rank-value">7,8</div>
                    </div>
                    <div class="rank-row">
                        <div class="rank-city">Londres</div>
                        <div class="rank-value">7,5</div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="source">IFRAP, Mairies respectives · 2024</div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

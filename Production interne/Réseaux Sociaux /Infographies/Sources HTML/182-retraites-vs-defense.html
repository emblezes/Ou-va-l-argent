<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Répartition du budget : Retraite vs Défense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0f1a;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent: #ff9f43;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #1a2540 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 159, 67, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 159, 67, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 159, 67, 0.1) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; pointer-events: none; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 40px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: var(--accent); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 4.5rem; text-align: center;
            color: var(--text-primary); line-height: 1.05;
        }
        .chart-title .accent { color: var(--accent); font-style: italic; }
        .chart-subtitle { text-align: center; font-size: 1.1rem; color: var(--text-secondary); margin-top: 4px; }

        .chart-area { flex: 1; display: flex; flex-direction: column; margin-top: 15px; }

        .bars-wrapper {
            flex: 1; display: flex;
            gap: 60px; align-items: flex-end;
            justify-content: center;
            padding: 0 80px 10px;
        }

        .bar-col {
            flex: 1; max-width: 280px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            height: 100%;
        }

        .bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem; font-weight: 700;
            white-space: nowrap; margin-bottom: 8px;
            flex-shrink: 0;
        }

        .bar-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem; font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 10px; flex-shrink: 0;
        }

        .bar-up {
            width: 100%; border-radius: 14px 14px 0 0;
            display: flex; align-items: center; justify-content: center;
        }

        .bar-emoji { font-size: 5rem; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }

        .labels-row {
            display: flex; gap: 60px;
            justify-content: center;
            padding: 14px 80px 0;
            flex-shrink: 0;
        }

        .label-col {
            flex: 1; max-width: 280px;
            text-align: center;
        }

        .bar-name {
            font-family: 'Syne', sans-serif;
            font-size: 2.8rem; font-weight: 700;
            color: #ffffff; line-height: 1;
            margin-bottom: 10px; flex-shrink: 0;
        }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent); }
    </style>
</head>
<body>
    <div class="infographic" data-name="retraites-vs-defense">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">La France dépense <span class="accent">7 fois plus</span><br>pour les retraites que pour sa défense</h2>
            <div class="chart-subtitle">Budget annuel (2024)</div>

            <div class="chart-area">
                <div class="bars-wrapper">
                    <!-- Retraites: 24% → 90% height -->
                    <div class="bar-col">
                        <div class="bar-name" style="color: #ff9f43;">Retraites</div>
                        <div class="bar-up" style="height: 90%; background: linear-gradient(180deg, #ff9f43, #cc7a2e); box-shadow: 0 -4px 30px rgba(255, 159, 67, 0.35);">
                            <div style="font-family: 'JetBrains Mono', monospace; font-size: 4rem; font-weight: 700; color: #1a1a2e; text-shadow: 0 1px 4px rgba(0,0,0,0.2);">400 Md€</div>
                        </div>
                    </div>

                    <!-- Défense: 3,2% → (3.2/24)*90 = 12% height -->
                    <div class="bar-col">
                        <div class="bar-name" style="color: #6b8bff;">Défense</div>
                        <div class="bar-up" style="height: 12%; background: linear-gradient(180deg, #6b8bff, #4a66cc); box-shadow: 0 -4px 20px rgba(107, 139, 255, 0.3);">
                            <div style="font-family: 'JetBrains Mono', monospace; font-size: 2.8rem; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.4);">54 Md€</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>INSEE / Ministère des Armées · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

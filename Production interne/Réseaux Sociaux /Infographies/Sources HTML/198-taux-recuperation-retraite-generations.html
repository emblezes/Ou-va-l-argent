<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taux de récupération retraite par génération</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #08101f;
            --bg-mid: #0f1d33;
            --accent: #00d4ff;
            --boomer: #ff4757;
            --transition: #ffd700;
            --text-primary: #f0f4f8;
            --text-secondary: #9db0c4;
            --text-muted: #5c6f85;
            --glass-border: rgba(255, 255, 255, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute; inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 71, 87, 0.10) 0%, transparent 70%);
            top: -200px; left: -100px; pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
            bottom: -150px; right: -100px; pointer-events: none;
        }

        .content {
            position: relative; z-index: 1; height: 100%;
            padding: 20px 50px 20px;
            display: flex; flex-direction: column;
        }

        .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 2px;
        }

        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.5rem; color: var(--accent); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 4rem;
            color: var(--text-primary);
            line-height: 1.03;
            margin-bottom: 2px;
            text-align: center;
        }

        .chart-title .accent-red { color: var(--boomer); font-style: italic; }
        .chart-title .accent-cyan { color: var(--accent); font-style: italic; }

        .chart-subtitle {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-align: center;
            line-height: 1.3;
        }

        .chart-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        svg { overflow: visible; }

        .footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 8px;
            margin-top: 4px;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 0.9rem; color: var(--text-muted); max-width: 820px; line-height: 1.35; }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent); flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">Taux de <span class="accent-red">récupération retraite</span><br>par génération</h2>
            <div class="chart-subtitle">Pensions perçues / cotisations versées (vie entière)</div>

            <div class="chart-area">
                <svg width="980" height="780" viewBox="0 0 980 780">
                    <!--
                        Échelle Y : 0 à 320% (chiffres tweet viral, source MELETE)
                        Zone plot : x de 80 à 960, y de 40 à 720
                        Hauteur de plot : 680px → 1% = 2.125 px
                        Baseline y = 720
                    -->

                    <!-- Zones de fond (3 zones : boomers / transition / Y-Z) -->
                    <rect x="82" y="40" width="324" height="680" fill="#ff4757" fill-opacity="0.06" />
                    <rect x="406" y="40" width="135" height="680" fill="#ffd700" fill-opacity="0.05" />
                    <rect x="541" y="40" width="419" height="680" fill="#00d4ff" fill-opacity="0.05" />

                    <!-- Labels des zones -->
                    <text x="244" y="70" fill="#ff4757" font-family="'Syne', sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">BABY-BOOMERS</text>
                    <text x="750.5" y="70" fill="#00d4ff" font-family="'Syne', sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">GÉNÉRATIONS Y / Z</text>

                    <!-- Axe bas + labels Y (échelle 0 à 320%) -->
                    <line x1="80" y1="720" x2="960" y2="720" stroke="#4a5a6a" stroke-opacity="0.35" stroke-width="1" />
                    <text x="70" y="726" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" text-anchor="end">0%</text>
                    <text x="70" y="513.5" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" text-anchor="end">100%</text>
                    <text x="70" y="301" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" text-anchor="end">200%</text>
                    <text x="70" y="88.5" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" text-anchor="end">300%</text>

                    <!-- Barres (chiffres tweet viral — source France Stratégie MELETE 2016) -->
                    <!-- 1940 : 280% -->
                    <rect x="92.85" y="125" width="42" height="595" fill="#ff4757" rx="2" />
                    <text x="113.85" y="115" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">280%</text>
                    <text x="113.85" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1940</text>

                    <!-- 1945 : 260% -->
                    <rect x="160.55" y="167.5" width="42" height="552.5" fill="#ff4757" rx="2" />
                    <text x="181.55" y="157.5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">260%</text>
                    <text x="181.55" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1945</text>

                    <!-- 1950 : 240% -->
                    <rect x="228.24" y="210" width="42" height="510" fill="#ff4757" rx="2" />
                    <text x="249.24" y="200" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">240%</text>
                    <text x="249.24" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1950</text>

                    <!-- 1955 : 220% -->
                    <rect x="295.94" y="252.5" width="42" height="467.5" fill="#ff4757" rx="2" />
                    <text x="316.94" y="242.5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">220%</text>
                    <text x="316.94" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1955</text>

                    <!-- 1960 : 200% -->
                    <rect x="363.63" y="295" width="42" height="425" fill="#ff4757" rx="2" />
                    <text x="384.63" y="285" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">200%</text>
                    <text x="384.63" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1960</text>

                    <!-- 1965 : 175% (transition) -->
                    <rect x="431.32" y="348.1" width="42" height="371.9" fill="#ffd700" rx="2" />
                    <text x="452.32" y="338.1" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">175%</text>
                    <text x="452.32" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1965</text>

                    <!-- 1970 : 155% (transition) -->
                    <rect x="499.02" y="390.6" width="42" height="329.4" fill="#ffd700" rx="2" />
                    <text x="520.02" y="380.6" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">155%</text>
                    <text x="520.02" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1970</text>

                    <!-- 1975 : 130% -->
                    <rect x="566.71" y="443.75" width="42" height="276.25" fill="#00d4ff" rx="2" />
                    <text x="587.71" y="433.75" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">130%</text>
                    <text x="587.71" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1975</text>

                    <!-- 1980 : 125% -->
                    <rect x="634.41" y="454.4" width="42" height="265.6" fill="#00d4ff" rx="2" />
                    <text x="655.41" y="444.4" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">125%</text>
                    <text x="655.41" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1980</text>

                    <!-- 1985 : 122% -->
                    <rect x="702.10" y="460.75" width="42" height="259.25" fill="#00d4ff" rx="2" />
                    <text x="723.10" y="450.75" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">122%</text>
                    <text x="723.10" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1985</text>

                    <!-- 1990 : 120% -->
                    <rect x="769.80" y="465" width="42" height="255" fill="#00d4ff" rx="2" />
                    <text x="790.80" y="455" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">120%</text>
                    <text x="790.80" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1990</text>

                    <!-- 1995 : 120% -->
                    <rect x="837.49" y="465" width="42" height="255" fill="#00d4ff" rx="2" />
                    <text x="858.49" y="455" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">120%</text>
                    <text x="858.49" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">1995</text>

                    <!-- 2000 : 120% -->
                    <rect x="905.19" y="465" width="42" height="255" fill="#00d4ff" rx="2" />
                    <text x="926.19" y="455" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="21" font-weight="700" text-anchor="middle">120%</text>
                    <text x="926.19" y="748" fill="#8899a8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" text-anchor="middle">2000</text>

                    <!-- Ligne de référence discrète à 100% (pointillée blanche) -->
                    <line x1="80" y1="507.5" x2="960" y2="507.5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5,6" />

                    <!-- Axe X label -->
                    <text x="520" y="773" fill="#8899a8" font-family="'Syne', sans-serif" font-size="15" text-anchor="middle">Année de naissance</text>
                </svg>
            </div>

            <div class="footer">
                <div class="source">Source : <span>France Stratégie — Chojnicki, Navaux &amp; Ragot (2016) · Modèle MELETE · Chaire TDTE</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

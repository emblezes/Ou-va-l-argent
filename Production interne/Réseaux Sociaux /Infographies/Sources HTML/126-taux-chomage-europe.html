<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chomage en Europe : la France en milieu de tableau</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0c0608;
            --text-primary: #f0f4f8;
            --text-secondary: #a88899;
            --text-muted: #6a4a5a;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #0c0608 0%, #1e0a14 50%, #0c0608 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 71, 87, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 71, 87, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 71, 87, 0.08) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 40px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #ff4757; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 3.8rem;
            text-align: center;
            margin-bottom: 2px;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: #ff4757;
            font-style: italic;
        }

        .chart-subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 15px;
        }

        .bars-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            padding: 0 5px;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        .bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            white-space: nowrap;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .bar-up {
            width: 88%;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
        }

        .bar-flag {
            font-size: 4rem;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }

        .bar-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            text-align: center;
            margin-top: 10px;
        }

        .bar-name.highlight {
            color: #ff4757;
            font-weight: 800;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: #ff4757; }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">Chomage en Europe : la France en milieu de tableau</h2>
            <div class="chart-subtitle">Unemployment rate (2025)</div>

            <div class="chart-area">
                <div class="bars-wrapper">

                    <div class="bar-col">
                        <div class="bar-value" style="color: #a88899;">10.4</div>
                        <div class="bar-up" style="height: 85.0%; background: linear-gradient(180deg, #a88899d9, #a8889966); box-shadow: none;">
                            <div class="bar-flag">🇪🇸</div>
                        </div>
                        <div class="bar-name">Espagne</div>
                    </div>

                    <div class="bar-col">
                        <div class="bar-value" style="color: #a88899;">8.7</div>
                        <div class="bar-up" style="height: 71.2%; background: linear-gradient(180deg, #a88899c9, #a8889966); box-shadow: none;">
                            <div class="bar-flag">🇸🇪</div>
                        </div>
                        <div class="bar-name">Suède</div>
                    </div>

                    <div class="bar-col">
                        <div class="bar-value" style="color: #a88899;">8.5</div>
                        <div class="bar-up" style="height: 70.0%; background: linear-gradient(180deg, #a88899ba, #a8889966); box-shadow: none;">
                            <div class="bar-flag">🇬🇷</div>
                        </div>
                        <div class="bar-name">Grèce</div>
                    </div>

                    <div class="bar-col">
                        <div class="bar-value" style="color: #ff4757;">7.5</div>
                        <div class="bar-up" style="height: 61.8%; background: linear-gradient(180deg, #ff4757, #ff475799); box-shadow: 0 -4px 25px #ff475740;">
                            <div class="bar-flag">🇫🇷</div>
                        </div>
                        <div class="bar-name highlight">France</div>
                    </div>

                    <div class="bar-col">
                        <div class="bar-value" style="color: #a88899;">6.4</div>
                        <div class="bar-up" style="height: 52.4%; background: linear-gradient(180deg, #a888999c, #a8889966); box-shadow: none;">
                            <div class="bar-flag">🇮🇹</div>
                        </div>
                        <div class="bar-name">Italie</div>
                    </div>

                    <div class="bar-col">
                        <div class="bar-value" style="color: #a88899;">4.7</div>
                        <div class="bar-up" style="height: 38.9%; background: linear-gradient(180deg, #a888998c, #a8889966); box-shadow: none;">
                            <div class="bar-flag">🇬🇧</div>
                        </div>
                        <div class="bar-name">Roy.-Uni</div>
                    </div>

                    <div class="bar-col">
                        <div class="bar-value" style="color: #a88899;">4.2</div>
                        <div class="bar-up" style="height: 34.4%; background: linear-gradient(180deg, #a888997d, #a8889966); box-shadow: none;">
                            <div class="bar-flag">🇺🇸</div>
                        </div>
                        <div class="bar-name">États-Unis</div>
                    </div>

                    <div class="bar-col">
                        <div class="bar-value" style="color: #a88899;">3.7</div>
                        <div class="bar-up" style="height: 30.4%; background: linear-gradient(180deg, #a888996e, #a8889966); box-shadow: none;">
                            <div class="bar-flag">🇩🇪</div>
                        </div>
                        <div class="bar-name">Allemagne</div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Our World in Data · OWID · 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

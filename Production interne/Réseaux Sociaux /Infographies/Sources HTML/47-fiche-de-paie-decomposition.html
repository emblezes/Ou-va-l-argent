<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ta fiche de paie décryptée</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c; --bg-surface: #0a0e14;
            --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a;
            --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757;
            --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 212, 255, 0.10) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 215, 0, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 40px 50px 32px; display: flex; flex-direction: column; }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-bottom: 4px; }
        .title .accent { color: var(--accent-red); font-style: italic; }
        .subtitle { font-size: 1.1rem; color: var(--text-secondary); text-align: center; margin-bottom: 8px; }
        .subtitle strong { color: var(--accent-gold); }

        .sankey-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; }

        .bottom-bar { display: flex; justify-content: center; gap: 36px; padding: 10px 0 0; }
        .bottom-item { text-align: center; }
        .bottom-item .label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2px; }
        .bottom-item .value { font-family: 'JetBrains Mono', monospace; font-size: 1.35rem; font-weight: 700; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; margin-top: 10px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.9rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">

            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent</span>
                </div>
            </div>

            <div class="title">Ta fiche de <span class="accent">paie</span></div>
            <div class="subtitle">Exemple pour 1 célibataire sans enfant avec un salaire de <strong>4 000 € brut / mois</strong></div>

            <div class="sankey-wrapper">
                <svg viewBox="0 0 960 690" width="960" height="690">
                    <defs>
                        <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    </defs>

                    <!--
                        LAYOUT (URSSAF 2025 values for 4000€ brut):
                        Super brut: 5 525€ | Patron: 1 525€ | Brut: 4 000€
                        Salariales: 856€ | Net avant IR: 3 144€ | IR: 325€ | Net: 2 820€

                        LEFT BARS (y=85..645, span=560px for 5525€):
                          Super brut: x=0..110,   y=85..645  (h=560)
                          Patron:     x=273..383,  y=85..240  (h=155)
                          Brut:       x=273..383,  y=245..645 (h=400)
                          Salarial:   x=546..656,  y=245..331 (h=86)
                          Net:        x=546..656,  y=337..645 (h=308)

                        Patron sub-ranges (y=85..240, 155px for 1525€):
                          Famille   85..100  (15px, 150€)
                          Chômage  100..116  (16px, 160€)
                          Accidents 116..124 (8px, 83€)
                          Autres   124..139  (15px, 147€)
                          Santé    139..177  (38px, 370€)
                          Retr(p)  177..240  (63px, 615€)

                        Salarial sub-ranges (y=245..331, 86px):
                          Retr(s)  245..287  (42px, 418€)
                          CSG/CRDS 287..331  (44px, 438€)

                        Net sub-ranges (y=337..645, 308px):
                          IR       337..369  (32px, 325€)
                          Net fin  369..645  (276px, 2820€)

                        RIGHT DESTINATIONS (y=10..670):
                          Famille       y=10..27    (h=17)
                          Chômage       y=32..50    (h=18)
                          Accidents     y=55..64    (h=9)
                          Autres        y=69..92    (h=23)
                          Santé         y=97..139   (h=42)
                          Retraite      y=144..260  (h=116)
                          CSG/CRDS      y=265..308  (h=43)
                          IR            y=313..349  (h=36)
                          Net après IR  y=354..670  (h=316)
                    -->

                    <!-- =============================================== -->
                    <!-- INTER-COLUMN FLOWS (large area ribbons)         -->
                    <!-- =============================================== -->

                    <!-- Super brut → Patron (top slice) — VIOLET -->
                    <path d="M 110,85 C 164,85 219,85 273,85 L 273,240 C 219,240 164,240 110,240 Z" fill="rgba(168,85,247,0.08)"/>
                    <!-- Super brut → Brut (bottom slice) — BLEU -->
                    <path d="M 110,245 C 164,245 219,245 273,245 L 273,645 C 219,645 164,645 110,645 Z" fill="rgba(0,212,255,0.06)"/>
                    <!-- Brut → Salarial (top slice) — VIOLET -->
                    <path d="M 383,245 C 437,245 492,245 546,245 L 546,331 C 492,331 437,331 383,331 Z" fill="rgba(168,85,247,0.08)"/>
                    <!-- Brut → Net (bottom slice) — VERT -->
                    <path d="M 383,337 C 437,337 492,337 546,337 L 546,645 C 492,645 437,645 383,645 Z" fill="rgba(0,255,136,0.06)"/>

                    <!-- =============================================== -->
                    <!-- PATRON → DESTINATIONS (x=383 → x=819)          -->
                    <!-- =============================================== -->

                    <!-- Famille: patron y=85..100 → dest y=10..27 (fans UP) -->
                    <path d="M 383,85 C 528,85 674,10 819,10 L 819,27 C 674,27 528,100 383,100 Z" fill="rgba(255,159,67,0.12)"/>
                    <!-- Chômage: patron y=100..116 → dest y=32..50 (fans UP) -->
                    <path d="M 383,100 C 528,100 674,32 819,32 L 819,50 C 674,50 528,116 383,116 Z" fill="rgba(0,212,255,0.10)"/>
                    <!-- Accidents: patron y=116..124 → dest y=55..64 (fans UP) -->
                    <path d="M 383,116 C 528,116 674,55 819,55 L 819,64 C 674,64 528,124 383,124 Z" fill="rgba(255,107,129,0.10)"/>
                    <!-- Autres: patron y=124..139 → dest y=69..92 (fans UP slightly) -->
                    <path d="M 383,124 C 528,124 674,69 819,69 L 819,92 C 674,92 528,139 383,139 Z" fill="rgba(136,153,168,0.08)"/>
                    <!-- Santé: patron y=139..177 → dest y=97..139 (nearly horizontal) -->
                    <path d="M 383,139 C 528,139 674,97 819,97 L 819,139 C 674,139 528,177 383,177 Z" fill="rgba(255,71,87,0.10)"/>

                    <!-- ★ RETRAITE PATRON: patron y=177..240 → dest y=144..207 — VIOLET
                         Nearly horizontal, stays ABOVE salar box (y=245). -->
                    <path d="M 383,177 C 528,178 674,144 819,144 L 819,207 C 674,207 528,240 383,240 Z" fill="rgba(168,85,247,0.18)"/>

                    <!-- =============================================== -->
                    <!-- SALARIAL → DESTINATIONS (x=656 → x=819)        -->
                    <!-- =============================================== -->

                    <!-- ★ RETRAITE SALARIAL: salar y=245..287 → dest y=209..260 — VIOLET -->
                    <path d="M 656,245 C 710,245 765,209 819,209 L 819,260 C 765,260 710,287 656,287 Z" fill="rgba(168,85,247,0.18)"/>

                    <!-- CSG/CRDS: salar y=287..331 → dest y=265..308 — OR -->
                    <path d="M 656,287 C 710,287 765,265 819,265 L 819,308 C 765,308 710,331 656,331 Z" fill="rgba(255,215,0,0.10)"/>

                    <!-- =============================================== -->
                    <!-- NET → DESTINATIONS (x=656 → x=819)             -->
                    <!-- =============================================== -->

                    <!-- Impôt: net y=337..369 → dest y=313..349 — ROUGE -->
                    <path d="M 656,337 C 710,337 765,313 819,313 L 819,349 C 765,349 710,369 656,369 Z" fill="rgba(255,71,87,0.12)"/>
                    <!-- Net final: net y=369..645 → dest y=354..670 — VERT CLAIR -->
                    <path d="M 656,369 C 710,369 765,354 819,354 L 819,670 C 765,670 710,645 656,645 Z" fill="rgba(102,255,170,0.08)"/>

                    <!-- =============================================== -->
                    <!-- GROUP 1: SUPER BRUT (x=0..110, y=85..645)      -->
                    <!-- =============================================== -->
                    <rect x="0" y="85" width="110" height="560" rx="8" fill="rgba(255,159,67,0.25)" stroke="rgba(255,159,67,0.50)" stroke-width="1.5"/>
                    <text x="55" y="335" text-anchor="middle" font-family="Syne, sans-serif" font-size="15" font-weight="700" fill="#ffe0b0">Salaire</text>
                    <text x="55" y="355" text-anchor="middle" font-family="Syne, sans-serif" font-size="15" font-weight="700" fill="#ffe0b0">super brut</text>
                    <text x="55" y="390" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#ff9f43">5 525 €</text>

                    <!-- =============================================== -->
                    <!-- GROUP 2: PATRON + BRUT (x=273..383)            -->
                    <!-- =============================================== -->

                    <!-- Cotisations patronales (y=85..240, h=155) — VIOLET -->
                    <rect x="273" y="85" width="110" height="155" rx="8" fill="rgba(168,85,247,0.30)" stroke="rgba(168,85,247,0.50)" stroke-width="1.5"/>
                    <text x="328" y="130" text-anchor="middle" font-family="Syne, sans-serif" font-size="15" font-weight="700" fill="#e0d0ff">Cotisations</text>
                    <text x="328" y="150" text-anchor="middle" font-family="Syne, sans-serif" font-size="15" font-weight="700" fill="#e0d0ff">patronales</text>
                    <text x="328" y="185" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#a855f7">1 525 €</text>

                    <!-- Salaire brut (y=245..645, h=400) -->
                    <rect x="273" y="245" width="110" height="400" rx="8" fill="rgba(0,212,255,0.18)" stroke="rgba(0,212,255,0.40)" stroke-width="1.5"/>
                    <text x="328" y="425" text-anchor="middle" font-family="Syne, sans-serif" font-size="16" font-weight="700" fill="#b0e8ff">Salaire</text>
                    <text x="328" y="447" text-anchor="middle" font-family="Syne, sans-serif" font-size="16" font-weight="700" fill="#b0e8ff">brut</text>
                    <text x="328" y="485" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#00d4ff">4 000 €</text>

                    <!-- =============================================== -->
                    <!-- GROUP 3: SALAR + NET (x=546..656)              -->
                    <!-- =============================================== -->

                    <!-- Cotisations salariales (y=245..331, h=86) -->
                    <rect x="546" y="245" width="110" height="86" rx="8" fill="rgba(168,85,247,0.30)" stroke="rgba(168,85,247,0.50)" stroke-width="1.5"/>
                    <text x="601" y="274" text-anchor="middle" font-family="Syne, sans-serif" font-size="14" font-weight="700" fill="#e0d0ff">Cotisations</text>
                    <text x="601" y="292" text-anchor="middle" font-family="Syne, sans-serif" font-size="14" font-weight="700" fill="#e0d0ff">salariales</text>
                    <text x="601" y="322" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#a855f7">856 €</text>

                    <!-- Salaire net (y=337..645, h=308) -->
                    <rect x="546" y="337" width="110" height="308" rx="8" fill="rgba(0,255,136,0.18)" stroke="rgba(0,255,136,0.40)" stroke-width="1.5"/>
                    <text x="601" y="470" text-anchor="middle" font-family="Syne, sans-serif" font-size="16" font-weight="700" fill="#b0ffd8">Salaire</text>
                    <text x="601" y="492" text-anchor="middle" font-family="Syne, sans-serif" font-size="16" font-weight="700" fill="#b0ffd8">net</text>
                    <text x="601" y="530" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#00ff88">3 144 €</text>

                    <!-- =============================================== -->
                    <!-- GROUP 4: DESTINATIONS (x=819..959)             -->
                    <!-- =============================================== -->

                    <!-- Famille 150€ (y=10..27, h=17) -->
                    <rect x="819" y="10" width="140" height="17" rx="4" fill="rgba(255,159,67,0.18)" stroke="rgba(255,159,67,0.35)" stroke-width="1"/>
                    <text x="829" y="23" font-family="Syne, sans-serif" font-size="11" font-weight="600" fill="#ff9f43">Famille</text>
                    <text x="949" y="23" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ff9f43">150 €</text>

                    <!-- Chômage 160€ (y=32..50, h=18) -->
                    <rect x="819" y="32" width="140" height="18" rx="4" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.35)" stroke-width="1"/>
                    <text x="829" y="45" font-family="Syne, sans-serif" font-size="11" font-weight="600" fill="#00d4ff">Chômage</text>
                    <text x="949" y="45" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00d4ff">160 €</text>

                    <!-- Accidents travail 83€ (y=55..64, h=9) -->
                    <rect x="819" y="55" width="140" height="9" rx="3" fill="rgba(255,159,67,0.12)" stroke="rgba(255,159,67,0.25)" stroke-width="0.8"/>
                    <text x="829" y="63" font-family="Syne, sans-serif" font-size="9" font-weight="600" fill="#ff9f43">Accidents trav.</text>
                    <text x="949" y="63" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#ff9f43">83 €</text>

                    <!-- Autres 147€ (y=69..92, h=23) -->
                    <rect x="819" y="69" width="140" height="23" rx="4" fill="rgba(136,153,168,0.12)" stroke="rgba(136,153,168,0.25)" stroke-width="0.8"/>
                    <text x="829" y="84" font-family="Syne, sans-serif" font-size="11" font-weight="600" fill="#8899a8">Autres</text>
                    <text x="949" y="84" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8899a8">147 €</text>

                    <!-- Santé 370€ (y=97..139, h=42) -->
                    <rect x="819" y="97" width="140" height="42" rx="5" fill="rgba(255,71,87,0.15)" stroke="rgba(255,71,87,0.35)" stroke-width="1"/>
                    <text x="829" y="123" font-family="Syne, sans-serif" font-size="14" font-weight="600" fill="#ff6b81">Santé</text>
                    <text x="949" y="123" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#ff4757">370 €</text>

                    <!-- ===== RETRAITE — DOUBLE FLUX (y=144..260, h=116) ===== -->
                    <rect x="819" y="144" width="140" height="116" rx="6" fill="rgba(168,85,247,0.16)" stroke="rgba(168,85,247,0.50)" stroke-width="2"/>
                    <text x="889" y="192" text-anchor="middle" font-family="Syne, sans-serif" font-size="16" font-weight="700" fill="#e0d0ff">Retraite</text>
                    <text x="889" y="222" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#c084fc">1 033 €</text>

                    <!-- CSG/CRDS 383€ (y=265..308, h=43) -->
                    <rect x="819" y="265" width="140" height="43" rx="5" fill="rgba(255,215,0,0.12)" stroke="rgba(255,215,0,0.35)" stroke-width="1"/>
                    <text x="889" y="282" text-anchor="middle" font-family="Syne, sans-serif" font-size="13" font-weight="600" fill="#ffd700">CSG / CRDS</text>
                    <text x="889" y="301" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ffd700">383 €</text>

                    <!-- Impôt sur le revenu 325€ (y=313..349, h=36) -->
                    <rect x="819" y="313" width="140" height="36" rx="5" fill="rgba(255,71,87,0.15)" stroke="rgba(255,71,87,0.40)" stroke-width="1"/>
                    <text x="889" y="329" text-anchor="middle" font-family="Syne, sans-serif" font-size="11" font-weight="600" fill="#ff6b81">Impôt sur le revenu</text>
                    <text x="889" y="346" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ff4757">325 €</text>

                    <!-- ===== NET APRÈS IMPÔT (y=354..670, h=316) — VERT CLAIR ===== -->
                    <rect x="819" y="354" width="140" height="316" rx="7" fill="rgba(102,255,170,0.16)" stroke="rgba(102,255,170,0.50)" stroke-width="2"/>
                    <text x="889" y="486" text-anchor="middle" font-family="Syne, sans-serif" font-size="15" font-weight="700" fill="#c0ffe0">Salaire net</text>
                    <text x="889" y="506" text-anchor="middle" font-family="Syne, sans-serif" font-size="15" font-weight="700" fill="#c0ffe0">après impôt</text>
                    <text x="889" y="543" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700" fill="#66ffaa">2 820 €</text>

                    <!-- Percentage markers -->
                    <text x="55" y="665" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ff9f43" opacity="0.5">100%</text>
                    <text x="889" y="686" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00ff88" opacity="0.6">51,0%</text>

                </svg>
            </div>

            <div class="bottom-bar">
                <div class="bottom-item">
                    <div class="label">Revenu disponible</div>
                    <div class="value" style="color: var(--accent-green);">51,0%</div>
                </div>
                <div class="bottom-item">
                    <div class="label">Cotisations totales</div>
                    <div class="value" style="color: var(--accent-purple);">43,1%</div>
                </div>
                <div class="bottom-item">
                    <div class="label">Impôt sur le revenu</div>
                    <div class="value" style="color: var(--accent-red);">5,9%</div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Simulateur ouvalargent.com — Taux URSSAF 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

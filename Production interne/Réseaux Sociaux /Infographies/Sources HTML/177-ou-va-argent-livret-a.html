<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Où va l'argent du Livret A ?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0f1a;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-cyan: #00d4ff;
            --accent-orange: #ff9f43;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --accent-purple: #a855f7;
            --accent-gold: #ffd700;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #1a2540 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 212, 255, 0.10) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(168, 85, 247, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 40px 50px 30px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: flex-start; margin-bottom: 10px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.5rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .title { font-family: 'Instrument Serif', serif; font-size: 4.2rem; text-align: center; color: var(--text-primary); line-height: 1.05; margin-bottom: 2px; }
        .title .accent { color: var(--accent-cyan); font-style: italic; }
        .subtitle { font-size: 1.05rem; color: var(--text-secondary); text-align: center; margin-bottom: 8px; }
        .subtitle strong { color: var(--accent-cyan); }

        .sankey-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.85rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">

            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="title">Où va l'argent du <span class="accent">Livret A</span> ?</div>

            <div class="sankey-wrapper">
                <svg viewBox="0 0 960 640" width="960" height="640">
                    <defs>
                        <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    </defs>

                    <!--
                        LAYOUT (extra-wide blocks, thin flows):
                        Col 1: x=0, w=180 (Livret A)
                        Col 2: x=230, w=180 (CDC / Banques)
                        Col 3: x=630, w=330 (Destinations)

                        Flow area: y=40..600 (560px)
                        CDC: y=40..375 (335px = 60%)
                        Banques: y=387..600 (213px = 40%)
                    -->

                    <!-- =============================================== -->
                    <!-- INTER-COLUMN FLOWS Col1 → Col2                  -->
                    <!-- =============================================== -->

                    <path d="M 180,40 C 195,40 215,40 230,40 L 230,375 C 215,375 195,375 180,375 Z" fill="rgba(168,85,247,0.07)"/>
                    <path d="M 180,387 C 195,387 215,387 230,387 L 230,600 C 215,600 195,600 180,600 Z" fill="rgba(255,159,67,0.07)"/>

                    <!-- =============================================== -->
                    <!-- FLOWS Col2 → Col3 (CDC → Destinations)          -->
                    <!-- =============================================== -->

                    <path d="M 410,40 C 480,40 560,22 630,22 L 630,195 C 560,195 480,208 410,208 Z" fill="rgba(0,255,136,0.10)"/>
                    <path d="M 410,208 C 480,208 560,203 630,203 L 630,243 C 560,243 480,247 410,247 Z" fill="rgba(255,215,0,0.08)"/>
                    <path d="M 410,247 C 480,247 560,251 630,251 L 630,362 C 560,362 480,357 410,357 Z" fill="rgba(0,212,255,0.08)"/>
                    <path d="M 410,357 C 480,357 560,370 630,370 L 630,392 C 560,392 480,375 410,375 Z" fill="rgba(255,71,87,0.12)"/>

                    <!-- =============================================== -->
                    <!-- FLOWS Col2 → Col3 (Banques → Destinations)      -->
                    <!-- =============================================== -->

                    <path d="M 410,387 C 480,387 560,400 630,400 L 630,571 C 560,571 480,559 410,559 Z" fill="rgba(255,159,67,0.10)"/>
                    <path d="M 410,559 C 480,559 560,579 630,579 L 630,620 C 560,620 480,600 410,600 Z" fill="rgba(0,255,136,0.08)"/>

                    <!-- =============================================== -->
                    <!-- COL 1: LIVRET A (x=0..180, y=40..600)           -->
                    <!-- =============================================== -->

                    <rect x="0" y="40" width="180" height="560" rx="8" fill="rgba(0,212,255,0.20)" stroke="rgba(0,212,255,0.50)" stroke-width="2"/>
                    <text x="90" y="255" text-anchor="middle" font-family="Syne, sans-serif" font-size="24" font-weight="700" fill="#b0e8ff">Livret A</text>
                    <text x="90" y="288" text-anchor="middle" font-family="Syne, sans-serif" font-size="18" font-weight="600" fill="#b0e8ff">des Français</text>
                    <text x="90" y="340" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="40" font-weight="700" fill="#00d4ff">432</text>
                    <text x="90" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#00d4ff">Md€</text>

                    <!-- =============================================== -->
                    <!-- COL 2: CDC (x=230..410, y=40..375)              -->
                    <!-- =============================================== -->

                    <rect x="230" y="40" width="180" height="335" rx="8" fill="rgba(168,85,247,0.25)" stroke="rgba(168,85,247,0.50)" stroke-width="2"/>
                    <text x="320" y="155" text-anchor="middle" font-family="Syne, sans-serif" font-size="20" font-weight="700" fill="#e0d0ff">Caisse des</text>
                    <text x="320" y="182" text-anchor="middle" font-family="Syne, sans-serif" font-size="20" font-weight="700" fill="#e0d0ff">Dépôts</text>
                    <text x="320" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700" fill="#a855f7">259</text>
                    <text x="320" y="252" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#a855f7">Md€</text>
                    <text x="320" y="280" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#c084fc" opacity="0.7">60%</text>

                    <!-- =============================================== -->
                    <!-- COL 2: BANQUES (x=230..410, y=387..600)         -->
                    <!-- =============================================== -->

                    <rect x="230" y="387" width="180" height="213" rx="8" fill="rgba(255,159,67,0.25)" stroke="rgba(255,159,67,0.50)" stroke-width="2"/>
                    <text x="320" y="462" text-anchor="middle" font-family="Syne, sans-serif" font-size="20" font-weight="700" fill="#ffe0b0">Banques</text>
                    <text x="320" y="489" text-anchor="middle" font-family="Syne, sans-serif" font-size="20" font-weight="700" fill="#ffe0b0">commerciales</text>
                    <text x="320" y="532" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700" fill="#ff9f43">173</text>
                    <text x="320" y="559" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#ff9f43">Md€</text>
                    <text x="320" y="587" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#ffbf73" opacity="0.7">40%</text>

                    <!-- =============================================== -->
                    <!-- COL 3: DESTINATIONS                             -->
                    <!-- =============================================== -->

                    <!-- Logement social 130 Md€ (y=22..195, h=173) — VERT -->
                    <rect x="630" y="22" width="330" height="173" rx="7" fill="rgba(0,255,136,0.14)" stroke="rgba(0,255,136,0.45)" stroke-width="2"/>
                    <text x="795" y="62" text-anchor="middle" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#b0ffd8">Logement social</text>
                    <text x="795" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="42" font-weight="700" fill="#00ff88">130</text>
                    <text x="795" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#00ff88">Md€</text>
                    <text x="795" y="175" text-anchor="middle" font-family="Syne, sans-serif" font-size="14" font-weight="500" fill="#80ffbb" opacity="0.7">HLM, rénovation, logement intermédiaire</text>

                    <!-- Collectivités locales 30 Md€ (y=203..243, h=40) — OR -->
                    <rect x="630" y="203" width="330" height="40" rx="5" fill="rgba(255,215,0,0.12)" stroke="rgba(255,215,0,0.35)" stroke-width="1.5"/>
                    <text x="645" y="230" font-family="Syne, sans-serif" font-size="18" font-weight="600" fill="#ffd700">Collectivités locales</text>
                    <text x="945" y="230" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#ffd700">30 Md€</text>

                    <!-- Obligations & marchés 85 Md€ (y=251..362, h=111) — CYAN -->
                    <rect x="630" y="251" width="330" height="111" rx="6" fill="rgba(0,212,255,0.12)" stroke="rgba(0,212,255,0.40)" stroke-width="1.5"/>
                    <text x="795" y="288" text-anchor="middle" font-family="Syne, sans-serif" font-size="20" font-weight="700" fill="#b0e8ff">Obligations d'État</text>
                    <text x="795" y="314" text-anchor="middle" font-family="Syne, sans-serif" font-size="20" font-weight="700" fill="#b0e8ff">& marchés</text>
                    <text x="795" y="352" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" fill="#00d4ff">85 Md€</text>

                    <!-- Nucléaire EPR2 15 Md€ (y=370..392, h=22) — ROUGE -->
                    <rect x="630" y="370" width="330" height="22" rx="4" fill="rgba(255,71,87,0.15)" stroke="rgba(255,71,87,0.40)" stroke-width="1.5"/>
                    <text x="645" y="386" font-family="Syne, sans-serif" font-size="14" font-weight="700" fill="#ff6b81">Nucléaire EPR2</text>
                    <text x="945" y="387" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#ff4757">15 Md€</text>

                    <!-- PME / TPE 140 Md€ (y=400..571, h=171) — ORANGE -->
                    <rect x="630" y="400" width="330" height="171" rx="7" fill="rgba(255,159,67,0.14)" stroke="rgba(255,159,67,0.45)" stroke-width="2"/>
                    <text x="795" y="445" text-anchor="middle" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#ffe0b0">Crédits</text>
                    <text x="795" y="473" text-anchor="middle" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#ffe0b0">PME / TPE</text>
                    <text x="795" y="525" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="42" font-weight="700" fill="#ff9f43">140</text>
                    <text x="795" y="555" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#ff9f43">Md€</text>

                    <!-- Transition éco & ESS 33 Md€ (y=579..620, h=41) — VERT -->
                    <rect x="630" y="579" width="330" height="41" rx="5" fill="rgba(0,255,136,0.10)" stroke="rgba(0,255,136,0.35)" stroke-width="1.5"/>
                    <text x="645" y="606" font-family="Syne, sans-serif" font-size="17" font-weight="600" fill="#80ffbb">Transition éco & ESS</text>
                    <text x="945" y="606" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#00ff88">33 Md€</text>

                    <!-- =============================================== -->
                    <!-- COLUMN HEADERS                                  -->
                    <!-- =============================================== -->

                    <text x="90" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#8899a8" opacity="0.6">ÉPARGNANTS</text>
                    <text x="320" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#8899a8" opacity="0.6">INTERMÉDIAIRES</text>
                    <text x="795" y="10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#8899a8" opacity="0.6">DESTINATIONS</text>


                </svg>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Banque de France / Caisse des Dépôts · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

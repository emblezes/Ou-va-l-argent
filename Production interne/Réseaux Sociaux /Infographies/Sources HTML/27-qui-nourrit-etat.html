<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seul un tiers de la population française finance l'État</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --bg-surface: #0a0e14; --bg-elevated: #111820; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43; --glass: rgba(17, 24, 32, 0.85); --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 255, 136, 0.12) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%); bottom: -150px; left: -150px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 44px 55px 36px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-container { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .section-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; margin-bottom: 8px; color: var(--text-primary); line-height: 1.1; }
        .section-title .accent { color: var(--accent-green); font-style: italic; }
        .section-title .red { color: var(--accent-red); font-style: italic; }
        .subtitle { font-size: 1.25rem; color: var(--text-secondary); text-align: center; margin-bottom: 50px; }
        .subtitle strong { color: var(--accent-gold); }

        .pie-wrapper { display: flex; justify-content: center; align-items: center; }
        .pie-wrapper svg { overflow: visible; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: auto; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.9rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="chart-container">
                <h2 class="section-title">Seul <span class="accent">un tiers</span> de la population<br>française <span class="red">finance l'État</span></h2>
                <div class="subtitle">Sur <strong>68,6 millions</strong> de Français, <strong>25 millions</strong> financent les services publics</div>

                <div class="pie-wrapper">
                    <svg viewBox="-480 -320 960 640" width="960" height="640">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="4" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                            <radialGradient id="centerGrad">
                                <stop offset="0%" stop-color="#0a1628"/>
                                <stop offset="100%" stop-color="#06080c"/>
                            </radialGradient>
                        </defs>

                        <!-- DONUT SEGMENTS — outer R=220, inner R=120 -->

                        <!-- Secteur privé 36% (0°→131°) — green -->
                        <path d="M 0,-220 A 220,220 0 0,1 166.0,144.3 L 90.6,78.7 A 120,120 0 0,0 0,-120 Z" fill="#00ff88" filter="url(#glow)"/>

                        <!-- Retraités 25% (131°→222°) — red -->
                        <path d="M 166.0,144.3 A 220,220 0 0,1 -147.2,163.5 L -80.3,89.2 A 120,120 0 0,0 90.6,78.7 Z" fill="#ff4757"/>

                        <!-- Mineurs 20% (222°→293°) — pink -->
                        <path d="M -147.2,163.5 A 220,220 0 0,1 -202.5,-85.9 L -110.5,-46.9 A 120,120 0 0,0 -80.3,89.2 Z" fill="#ff6b81"/>

                        <!-- Fonctionnaires 9% (293°→324°) — gold -->
                        <path d="M -202.5,-85.9 A 220,220 0 0,1 -129.3,-178.0 L -70.5,-97.1 A 120,120 0 0,0 -110.5,-46.9 Z" fill="#ffd700"/>

                        <!-- Chômeurs 5% (324°→342°) — gray -->
                        <path d="M -129.3,-178.0 A 220,220 0 0,1 -68.0,-209.2 L -37.1,-114.1 A 120,120 0 0,0 -70.5,-97.1 Z" fill="#636e72"/>

                        <!-- Étudiants 4% (342°→360°) — purple -->
                        <path d="M -68.0,-209.2 A 220,220 0 0,1 0,-220 L 0,-120 A 120,120 0 0,0 -37.1,-114.1 Z" fill="#a855f7"/>

                        <!-- Center circle -->
                        <circle cx="0" cy="0" r="105" fill="#06080c"/>
                        <circle cx="0" cy="0" r="105" fill="url(#centerGrad)" opacity="0.5"/>

                        <!-- Center text -->
                        <text x="0" y="-8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="42" font-weight="700" fill="#00ff88">36%</text>
                        <text x="0" y="24" text-anchor="middle" font-family="Syne, sans-serif" font-size="16" fill="#8899a8">contribuent</text>

                        <!-- === LEADER LINES + LABELS (all segments) === -->

                        <!-- Secteur privé — mid ~65° → right -->
                        <line x1="173" y1="-79" x2="280" y2="-55" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
                        <line x1="280" y1="-55" x2="440" y2="-55" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
                        <circle cx="173" cy="-79" r="5" fill="#00ff88"/>
                        <text x="290" y="-76" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Secteur privé</text>
                        <text x="290" y="-28" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#00ff88">25,0M</text>
                        <text x="400" y="-28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">36%</text>

                        <!-- Retraités — mid ~176° → right-bottom -->
                        <line x1="12" y1="190" x2="280" y2="170" stroke="#ff4757" stroke-width="2" opacity="0.7"/>
                        <line x1="280" y1="170" x2="440" y2="170" stroke="#ff4757" stroke-width="2" opacity="0.7"/>
                        <circle cx="12" cy="190" r="5" fill="#ff4757"/>
                        <text x="290" y="150" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Retraités</text>
                        <text x="290" y="198" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#ff4757">17,4M</text>
                        <text x="400" y="198" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">25%</text>

                        <!-- Mineurs — mid ~257° → left-bottom -->
                        <line x1="-186" y1="41" x2="-280" y2="80" stroke="#ff6b81" stroke-width="2" opacity="0.7"/>
                        <line x1="-280" y1="80" x2="-440" y2="80" stroke="#ff6b81" stroke-width="2" opacity="0.7"/>
                        <circle cx="-186" cy="41" r="5" fill="#ff6b81"/>
                        <text x="-440" y="60" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Mineurs</text>
                        <text x="-440" y="108" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#ff6b81">13,4M</text>
                        <text x="-350" y="108" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">20%</text>

                        <!-- Fonctionnaires — mid ~308° → left -->
                        <line x1="-149" y1="-118" x2="-280" y2="-80" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
                        <line x1="-280" y1="-80" x2="-440" y2="-80" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
                        <circle cx="-149" cy="-118" r="5" fill="#ffd700"/>
                        <text x="-440" y="-100" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Fonctionnaires</text>
                        <text x="-440" y="-52" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#ffd700">5,9M</text>
                        <text x="-360" y="-52" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">9%</text>

                        <!-- Chômeurs — mid ~333° → left-top -->
                        <line x1="-86" y1="-169" x2="-280" y2="-210" stroke="#636e72" stroke-width="2" opacity="0.7"/>
                        <line x1="-280" y1="-210" x2="-440" y2="-210" stroke="#636e72" stroke-width="2" opacity="0.7"/>
                        <circle cx="-86" cy="-169" r="5" fill="#636e72"/>
                        <text x="-440" y="-230" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Chômeurs</text>
                        <text x="-440" y="-182" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#636e72">3,4M</text>
                        <text x="-365" y="-182" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">5%</text>

                        <!-- Étudiants — mid ~351° → top-left -->
                        <line x1="-30" y1="-188" x2="-100" y2="-290" stroke="#a855f7" stroke-width="2" opacity="0.7"/>
                        <line x1="-100" y1="-290" x2="-280" y2="-290" stroke="#a855f7" stroke-width="2" opacity="0.7"/>
                        <circle cx="-30" cy="-188" r="5" fill="#a855f7"/>
                        <text x="-280" y="-310" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#f0f4f8">Étudiants</text>
                        <text x="-280" y="-262" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#a855f7">3,0M</text>
                        <text x="-205" y="-262" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4a5a6a">4%</text>
                    </svg>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>INSEE, DARES, DREES, Urssaf — 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

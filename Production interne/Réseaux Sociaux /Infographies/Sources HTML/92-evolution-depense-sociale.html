<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version C — Vert / Orange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060c08;
            --bg-mid: #0a1e14;
            --text-primary: #f0f4f8;
            --text-secondary: #88a898;
            --text-muted: #4a6a5a;
            --accent-low: #00ff88;
            --accent-mid: #ff9f43;
            --accent-high: #ff6b35;
            --accent-peak: #ff4500;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 159, 67, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 159, 67, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.1) 0%, transparent 70%);
            bottom: -200px;
            right: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.06) 0%, transparent 70%);
            top: -150px;
            left: -100px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 40px 50px 35px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: var(--accent-high); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 0 15px;
        }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 4.5rem;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .chart-title .accent { color: var(--accent-high); font-style: italic; }

        .chart-subtitle {
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .chart-area {
            flex: 1;
            display: flex;
            position: relative;
            padding: 0 10px;
        }

        .bars-container {
            flex: 1;
            display: flex;
            gap: 8px;
            position: relative;
            height: 100%;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            height: 100%;
        }

        .bar {
            width: 80%;
            border-radius: 6px 6px 0 0;
            position: relative;
        }

        .bar.level-low {
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.9), rgba(0, 255, 136, 0.5));
        }

        .bar.level-mid {
            background: linear-gradient(180deg, rgba(255, 159, 67, 0.9), rgba(255, 159, 67, 0.6));
        }

        .bar.level-high {
            background: linear-gradient(180deg, var(--accent-high), rgba(255, 107, 53, 0.7));
            box-shadow: 0 -4px 20px rgba(255, 107, 53, 0.25);
        }

        .bar.level-peak {
            background: linear-gradient(180deg, var(--accent-peak), var(--accent-high));
            box-shadow: 0 -4px 25px rgba(255, 69, 0, 0.4);
        }

        .bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .bar.level-low .bar-value { color: var(--accent-low); }
        .bar.level-mid .bar-value { color: var(--accent-mid); }
        .bar.level-high .bar-value { color: var(--accent-high); }
        .bar.level-peak .bar-value { color: var(--accent-peak); font-size: 1.4rem; }

        .year-labels {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding: 0 10px;
        }

        .year-label {
            flex: 1;
            text-align: center;
        }

        .year-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: auto;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-high); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="title-area">
                <h2 class="chart-title">L'<span class="accent">explosion</span> de la dépense<br>sociale française</h2>
            </div>

            <div class="chart-subtitle">Prestations sociales en % du PIB — France (1980–2024)</div>

            <div class="chart-area">
                <div class="bars-container">
                    <div class="bar-col"><div class="bar level-low" style="height: 27.8%;"><div class="bar-value">21,4</div></div></div>
                    <div class="bar-col"><div class="bar level-low" style="height: 47.8%;"><div class="bar-value">26,0</div></div></div>
                    <div class="bar-col"><div class="bar level-low" style="height: 44.8%;"><div class="bar-value">25,3</div></div></div>
                    <div class="bar-col"><div class="bar level-mid" style="height: 59.6%;"><div class="bar-value">28,7</div></div></div>
                    <div class="bar-col"><div class="bar level-mid" style="height: 59.1%;"><div class="bar-value">28,6</div></div></div>
                    <div class="bar-col"><div class="bar level-mid" style="height: 63.5%;"><div class="bar-value">29,6</div></div></div>
                    <div class="bar-col"><div class="bar level-high" style="height: 70.9%;"><div class="bar-value">31,3</div></div></div>
                    <div class="bar-col"><div class="bar level-high" style="height: 71.7%;"><div class="bar-value">31,5</div></div></div>
                    <div class="bar-col"><div class="bar level-peak" style="height: 87.4%;"><div class="bar-value">35,1</div></div></div>
                    <div class="bar-col"><div class="bar level-high" style="height: 74.8%;"><div class="bar-value">32,2</div></div></div>
                </div>
            </div>

            <div class="year-labels">
                <div class="year-label"><div class="year-num">1980</div></div>
                <div class="year-label"><div class="year-num">1985</div></div>
                <div class="year-label"><div class="year-num">1990</div></div>
                <div class="year-label"><div class="year-num">1995</div></div>
                <div class="year-label"><div class="year-num">2000</div></div>
                <div class="year-label"><div class="year-num">2005</div></div>
                <div class="year-label"><div class="year-num">2010</div></div>
                <div class="year-label"><div class="year-num">2015</div></div>
                <div class="year-label"><div class="year-num">2020</div></div>
                <div class="year-label"><div class="year-num">2024</div></div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>DREES, Eurostat · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

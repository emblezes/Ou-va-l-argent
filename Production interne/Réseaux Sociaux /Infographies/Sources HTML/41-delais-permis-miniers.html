<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Délais permis miniers : France 10 ans vs Australie 2 ans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --bg-surface: #0a0e14; --bg-elevated: #111820; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43; --glass: rgba(17, 24, 32, 0.85); --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 71, 87, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 71, 87, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 71, 87, 0.1) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 70%); bottom: -150px; left: -150px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 48px 55px 38px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-container { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; margin-bottom: 35px; color: var(--text-primary); line-height: 1.12; }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }
        .chart-title .green { color: var(--accent-green); font-style: italic; }
        .bar-chart { display: flex; flex-direction: column; gap: 18px; }
        .bar-item { display: flex; align-items: center; gap: 18px; padding: 8px 0; }
        .bar-label { width: 160px; font-size: 1.2rem; font-weight: 600; color: var(--text-primary); text-align: right; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        .bar-flag { font-size: 1.8rem; }
        .bar-track { flex: 1; height: 52px; background: rgba(255, 255, 255, 0.05); border-radius: 12px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 12px; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px; font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; }
        .bar-fill.red { background: linear-gradient(90deg, rgba(255, 71, 87, 0.4), var(--accent-red)); color: var(--bg-deep); }
        .bar-fill.orange { background: linear-gradient(90deg, rgba(255, 159, 67, 0.4), var(--accent-orange)); color: var(--bg-deep); }
        .bar-fill.electric { background: linear-gradient(90deg, rgba(0, 212, 255, 0.4), var(--accent-electric)); color: var(--bg-deep); }
        .bar-fill.green { background: linear-gradient(90deg, rgba(0, 255, 136, 0.4), var(--accent-green)); color: var(--bg-deep); }
        .bar-fill.gold { background: linear-gradient(90deg, rgba(255, 215, 0, 0.4), var(--accent-gold)); color: var(--bg-deep); }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: auto; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.9rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent</span>
                </div>
            </div>
            <div class="chart-container">
                <h2 class="chart-title">Délais d'obtention d'un<br><span class="accent">permis minier</span></h2>
                <div class="bar-chart">
                    <div class="bar-item">
                        <div class="bar-label"><span class="bar-flag">🇫🇷</span> France</div>
                        <div class="bar-track">
                            <div class="bar-fill red" style="width: 100%">10-15 ans</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label"><span class="bar-flag">🇨🇦</span> Canada</div>
                        <div class="bar-track">
                            <div class="bar-fill orange" style="width: 33%">3-5 ans</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label"><span class="bar-flag">🇦🇺</span> Australie</div>
                        <div class="bar-track">
                            <div class="bar-fill electric" style="width: 27%">2-4 ans</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label"><span class="bar-flag">🇬🇭</span> Ghana</div>
                        <div class="bar-track">
                            <div class="bar-fill green" style="width: 13%">1-2 ans</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label"><span class="bar-flag">🇬🇾</span> Guyana</div>
                        <div class="bar-track">
                            <div class="bar-fill gold" style="width: 10%">< 1 an</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Source : <span>Banque mondiale, Fraser Institute (2024)</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

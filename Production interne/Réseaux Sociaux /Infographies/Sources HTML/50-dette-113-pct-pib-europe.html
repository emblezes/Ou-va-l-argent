<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>113% du PIB — Comparaison européenne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-orange: #ff9f43; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 71, 87, 0.1) 0%, transparent 70%); top: -200px; right: -100px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%); bottom: -200px; left: -100px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, var(--accent-electric) 0%, #0099cc 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.4rem; color: var(--bg-deep); }
        .logo-text { font-weight: 700; font-size: 1.3rem; color: var(--text-primary); }
        .tag { padding: 12px 24px; background: rgba(255, 71, 87, 0.15); border: 1px solid rgba(255, 71, 87, 0.3); border-radius: 50px; font-size: 1rem; font-weight: 600; color: var(--accent-red); text-transform: uppercase; letter-spacing: 0.1em; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }

        .h-bars { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; padding: 15px 0; }
        .h-bar-row { display: flex; align-items: center; gap: 0; }
        .h-bar-flag { font-size: 1.8rem; width: 40px; text-align: center; flex-shrink: 0; }
        .h-bar-country { font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 600; color: var(--text-secondary); width: 110px; flex-shrink: 0; }
        .h-bar-track { flex: 1; height: 44px; position: relative; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.03); }
        .h-bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; }
        .h-bar-val { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--bg-deep); }
        .h-bar-row.france .h-bar-country { color: var(--accent-red); font-size: 1.3rem; }
        .h-bar-row.france .h-bar-track { height: 56px; }
        .h-bar-row.france .h-bar-val { font-size: 1.5rem; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="50-dette-113-pct-pib-europe">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><div class="logo-icon">€</div><span class="logo-text">Où Va l'Argent</span></div>
                <div class="tag">Dette</div>
            </div>
            <h2 class="chart-title">La France, <span class="accent">3ᵉ pays</span><br>le plus endetté d'Europe</h2>

            <div class="h-bars">
                <div class="h-bar-row">
                    <div class="h-bar-flag">🇬🇷</div>
                    <div class="h-bar-country">Grèce</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 100%; background: linear-gradient(90deg, #ff1a2e, var(--accent-red));"><div class="h-bar-val">153,6 %</div></div></div>
                </div>
                <div class="h-bar-row">
                    <div class="h-bar-flag">🇮🇹</div>
                    <div class="h-bar-country">Italie</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 88.1%; background: linear-gradient(90deg, var(--accent-red), rgba(255,71,87,0.7));"><div class="h-bar-val">135,3 %</div></div></div>
                </div>
                <div class="h-bar-row france">
                    <div class="h-bar-flag">🇫🇷</div>
                    <div class="h-bar-country">France</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 73.7%; background: linear-gradient(90deg, var(--accent-orange), var(--accent-red)); box-shadow: 0 0 20px rgba(255,71,87,0.3);"><div class="h-bar-val">113,2 %</div></div></div>
                </div>
                <div class="h-bar-row">
                    <div class="h-bar-flag">🇧🇪</div>
                    <div class="h-bar-country">Belgique</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 68.2%; background: linear-gradient(90deg, var(--accent-orange), rgba(255,159,67,0.6));"><div class="h-bar-val">104,7 %</div></div></div>
                </div>
                <div class="h-bar-row">
                    <div class="h-bar-flag">🇪🇸</div>
                    <div class="h-bar-country">Espagne</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 66.3%; background: linear-gradient(90deg, var(--accent-orange), rgba(255,159,67,0.6));"><div class="h-bar-val">101,8 %</div></div></div>
                </div>
                <div class="h-bar-row">
                    <div class="h-bar-flag">🇵🇹</div>
                    <div class="h-bar-country">Portugal</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 61.8%; background: linear-gradient(90deg, var(--accent-gold), rgba(255,215,0,0.5));"><div class="h-bar-val">95,0 %</div></div></div>
                </div>
                <div class="h-bar-row">
                    <div class="h-bar-flag">🇩🇪</div>
                    <div class="h-bar-country">Allemagne</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 40.7%; background: linear-gradient(90deg, var(--accent-green), rgba(0,255,136,0.5));"><div class="h-bar-val">62,5 %</div></div></div>
                </div>
                <div class="h-bar-row">
                    <div class="h-bar-flag">🇳🇱</div>
                    <div class="h-bar-country">Pays-Bas</div>
                    <div class="h-bar-track"><div class="h-bar-fill" style="width: 28.2%; background: linear-gradient(90deg, var(--accent-green), rgba(0,255,136,0.5));"><div class="h-bar-val">43,3 %</div></div></div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>Eurostat · dette publique en % du PIB · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

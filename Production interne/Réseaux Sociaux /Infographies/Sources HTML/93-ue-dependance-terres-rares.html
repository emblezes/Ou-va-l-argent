<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépendance de l'UE à la Chine pour les métaux critiques</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0f1a;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, #1a2540 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 71, 87, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 71, 87, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 71, 87, 0.1) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 40px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #ff4757; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5rem;
            text-align: center;
            margin-bottom: 2px;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: #ff4757;
            font-style: italic;
        }

        .chart-subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
            margin-top: 20px;
            padding: 0 10px;
        }

        .h-bar-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .h-bar {
            height: 100px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
        }

        .h-bar-name {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .h-bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            margin-left: auto;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .source {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .source span {
            color: var(--text-secondary);
        }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">Dépendance de l'Europe à la <span class="accent">Chine</span> 🇨🇳</h2>
            <div class="chart-subtitle">Part de la Chine dans les importations de métaux critiques (Cour des comptes UE · 2026)</div>

            <div class="chart-area">
                <!-- Terres rares: 98% -->
                <div class="h-bar-row">
                    <div class="h-bar" style="width: 98%; background: #ff4757; box-shadow: 0 0 30px rgba(255, 71, 87, 0.3);">
                        <div class="h-bar-name">Terres rares</div>
                        <div class="h-bar-value">98 %</div>
                    </div>
                </div>

                <!-- Magnésium: 97% -->
                <div class="h-bar-row">
                    <div class="h-bar" style="width: 95%; background: #e8384f; box-shadow: 0 0 30px rgba(232, 56, 79, 0.25);">
                        <div class="h-bar-name">Magnésium</div>
                        <div class="h-bar-value">97 %</div>
                    </div>
                </div>

                <!-- Gallium: 73% -->
                <div class="h-bar-row">
                    <div class="h-bar" style="width: 73%; background: #ff9f43; box-shadow: 0 0 30px rgba(255, 159, 67, 0.25);">
                        <div class="h-bar-name">Gallium</div>
                        <div class="h-bar-value">73 %</div>
                    </div>
                </div>

                <!-- Cobalt raffiné: 68% -->
                <div class="h-bar-row">
                    <div class="h-bar" style="width: 68%; background: #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);">
                        <div class="h-bar-name">Cobalt raffiné</div>
                        <div class="h-bar-value">68 %</div>
                    </div>
                </div>

                <!-- Germanium: 45% -->
                <div class="h-bar-row">
                    <div class="h-bar" style="width: 45%; background: #a855f7; box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);">
                        <div class="h-bar-name">Germanium</div>
                        <div class="h-bar-value">45 %</div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>Cour des comptes UE / Eurostat · 2026</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

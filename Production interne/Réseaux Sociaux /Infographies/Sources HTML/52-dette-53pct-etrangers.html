<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>53% de la dette détenue par l'étranger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(168, 85, 247, 0.14) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -200px; right: -100px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 3.8rem; text-align: center; color: var(--text-primary); line-height: 1.15; margin-top: 15px; }
        .chart-title .accent { color: var(--accent-purple); font-style: italic; }

        .donut-area { flex: 1; display: flex; justify-content: center; align-items: center; }
        .donut-container { position: relative; width: 500px; height: 500px; }
        .donut-svg { width: 100%; height: 100%; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .donut-center-val { font-family: 'JetBrains Mono', monospace; font-size: 6rem; font-weight: 700; color: var(--accent-purple); line-height: 1; }
        .donut-center-label { font-size: 1.5rem; color: var(--text-secondary); margin-top: 4px; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="52-dette-53pct-etrangers">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">Plus de la moitié de notre dette<br>appartient à <span class="accent">l'étranger</span></h2>

            <div class="donut-area">
                <div class="donut-container">
                    <svg class="donut-svg" viewBox="0 0 200 200">
                        <!-- Étranger: 53% -->
                        <circle cx="100" cy="100" r="75" fill="none" stroke="#a855f7" stroke-width="36"
                            stroke-dasharray="249.9 471.2" stroke-dashoffset="117.8" />
                        <!-- France: 47% -->
                        <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(136,153,168,0.3)" stroke-width="36"
                            stroke-dasharray="221.3 471.2" stroke-dashoffset="-132.1" />
                    </svg>
                    <div class="donut-center">
                        <div class="donut-center-val">53 %</div>
                        <div class="donut-center-label">étranger</div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>Banque de France · détenteurs de la dette · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

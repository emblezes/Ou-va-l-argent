<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Les intérêts de la dette asphyxient le budget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-orange: #ff9f43; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #180a0c 0%, #451218 50%, #180a0c 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 71, 87, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 71, 87, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.1) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 71, 87, 0.08) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: #ff4757; font-style: italic; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .chart-container { width: 800px; height: 450px; margin: 20px auto; }
        .chart-svg { width: 100%; height: 100%; }
        .grid-line { stroke: rgba(255, 71, 87, 0.1); stroke-width: 1; }
        .axis-line { stroke: rgba(255, 255, 255, 0.3); stroke-width: 2; }
        .chart-line { stroke: #ff4757; stroke-width: 3; fill: none; }
        .data-point { fill: #ff4757; stroke: #ffffff; stroke-width: 2; }
        .axis-label { font-family: 'Syne', sans-serif; font-size: 14px; fill: var(--text-secondary); }
        .axis-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; fill: var(--text-primary); }
        .chart-gradient { stop-color: #ff4757; }
        .stats-row { display: flex; justify-content: space-around; margin-top: 30px; }
        .stat-item { text-align: center; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; font-weight: 700; color: #ff4757; }
        .stat-label { font-size: 1.2rem; color: var(--text-secondary); margin-top: 5px; }
        .trend-note { text-align: center; margin-top: 15px; font-size: 1.3rem; color: var(--text-secondary); }
        .trend-note strong { color: #ff4757; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="evolution-interets-dette-publique-france">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">Les intérêts de la dette<br><span class="accent">asphyxient le budget</span></h2>
            <div class="center-area">
                <div class="chart-container">
                    <svg class="chart-svg" viewBox="0 0 800 450">
                        <defs>
                            <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" class="chart-gradient" stop-opacity="0.3"/>
                                <stop offset="100%" class="chart-gradient" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        
                        <!-- Grille verticale -->
                        <line x1="120" y1="50" x2="120" y2="350" class="grid-line"/>
                        <line x1="230" y1="50" x2="230" y2="350" class="grid-line"/>
                        <line x1="340" y1="50" x2="340" y2="350" class="grid-line"/>
                        <line x1="450" y1="50" x2="450" y2="350" class="grid-line"/>
                        <line x1="560" y1="50" x2="560" y2="350" class="grid-line"/>
                        <line x1="670" y1="50" x2="670" y2="350" class="grid-line"/>
                        <line x1="780" y1="50" x2="780" y2="350" class="grid-line"/>
                        
                        <!-- Grille horizontale -->
                        <line x1="80" y1="350" x2="780" y2="350" class="grid-line"/>
                        <line x1="80" y1="290" x2="780" y2="290" class="grid-line"/>
                        <line x1="80" y1="230" x2="780" y2="230" class="grid-line"/>
                        <line x1="80" y1="170" x2="780" y2="170" class="grid-line"/>
                        <line x1="80" y1="110" x2="780" y2="110" class="grid-line"/>
                        <line x1="80" y1="50" x2="780" y2="50" class="grid-line"/>
                        
                        <!-- Axes -->
                        <line x1="80" y1="50" x2="80" y2="350" class="axis-line"/>
                        <line x1="80" y1="350" x2="780" y2="350" class="axis-line"/>
                        
                        <!-- Courbe -->
                        <path d="M 120 260 L 230 285 L 340 246 L 450 210 L 560 180 L 670 150 L 780 100" class="chart-line"/>
                        
                        <!-- Zone sous la courbe -->
                        <path d="M 120 260 L 230 285 L 340 246 L 450 210 L 560 180 L 670 150 L 780 100 L 780 350 L 120 350 Z" fill="url(#chartGradient)"/>
                        
                        <!-- Points de données -->
                        <circle cx="120" cy="260" r="5" class="data-point"/>
                        <circle cx="230" cy="285" r="5" class="data-point"/>
                        <circle cx="340" cy="246" r="5" class="data-point"/>
                        <circle cx="450" cy="210" r="5" class="data-point"/>
                        <circle cx="560" cy="180" r="5" class="data-point"/>
                        <circle cx="670" cy="150" r="5" class="data-point"/>
                        <circle cx="780" cy="100" r="5" class="data-point"/>
                        
                        <!-- Labels axe X -->
                        <text x="120" y="375" text-anchor="middle" class="axis-label">2020</text>
                        <text x="230" y="375" text-anchor="middle" class="axis-label">2021</text>
                        <text x="340" y="375" text-anchor="middle" class="axis-label">2022</text>
                        <text x="450" y="375" text-anchor="middle" class="axis-label">2023</text>
                        <text x="560" y="375" text-anchor="middle" class="axis-label">2024</text>
                        <text x="670" y="375" text-anchor="middle" class="axis-label">2025</text>
                        <text x="780" y="375" text-anchor="middle" class="axis-label">2026</text>
                        
                        <!-- Labels axe Y -->
                        <text x="70" y="355" text-anchor="end" class="axis-label">30</text>
                        <text x="70" y="295" text-anchor="end" class="axis-label">40</text>
                        <text x="70" y="235" text-anchor="end" class="axis-label">45</text>
                        <text x="70" y="175" text-anchor="end" class="axis-label">50</text>
                        <text x="70" y="115" text-anchor="end" class="axis-label">55</text>
                        <text x="70" y="55" text-anchor="end" class="axis-label">60</text>
                        
                        <!-- Valeurs sur les points -->
                        <text x="120" y="245" text-anchor="middle" class="axis-label" font-weight="600" fill="#ff4757">34,2</text>
                        <text x="230" y="270" text-anchor="middle" class="axis-label" font-weight="600" fill="#ff4757">31,8</text>
                        <text x="340" y="231" text-anchor="middle" class="axis-label" font-weight="600" fill="#ff4757">36,7</text>
                        <text x="450" y="195" text-anchor="middle" class="axis-label" font-weight="600" fill="#ff4757">42,1</text>
                        <text x="560" y="165" text-anchor="middle" class="axis-label" font-weight="600" fill="#ff4757">48,5</text>
                        <text x="670" y="135" text-anchor="middle" class="axis-label" font-weight="600" fill="#ff4757">54,2</text>
                        <text x="780" y="85" text-anchor="middle" class="axis-label" font-weight="600" fill="#ff4757">61,0</text>
                        
                        <!-- Titre axe Y -->
                        <text x="25" y="200" text-anchor="middle" class="axis-title" transform="rotate(-90, 25, 200)">Milliards d'euros</text>
                    </svg>
                </div>
                
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-value">+78%</div>
                        <div class="stat-label">depuis 2021</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">61 Md€</div>
                        <div class="stat-label">prévision 2026</div>
                    </div>
                </div>
                
                <div class="trend-note">
                    <strong>Hausse continue depuis 2021</strong> · 3e poste budgétaire
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>Ministère des Finances · 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>L'endettement de la France a été multiplié par 6 depuis 1980</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --bg-mid:  #142b48;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 0; margin: 0; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.14) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 70px 40px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5.6rem;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.02;
            margin-top: 30px;
            letter-spacing: -1.8px;
        }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }

        /* Comparaison alignée à gauche, 2 blocs + émoji à droite */
        .compare-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 30px 0 0 20px;
        }
        .compare-blocks {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 80px;
        }
        .compare-block { display: flex; flex-direction: column; gap: 18px; }
        .compare-label {
            font-family: 'Instrument Serif', serif;
            font-size: 4rem;
            font-style: italic;
            color: var(--text-primary);
            line-height: 1;
        }
        .compare-block.highlight .compare-label { color: var(--accent-red); }

        .compare-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4.2rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -1.8px;
        }
        .compare-block.highlight .compare-value {
            color: var(--accent-red);
            text-shadow: 0 0 50px rgba(255, 71, 87, 0.5);
        }

        /* Émoji graphique à droite */
        .compare-emoji {
            font-size: 18rem;
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 0 40px rgba(255, 71, 87, 0.4));
            margin-right: 30px;
        }
        .compare-block.highlight .compare-value {
            color: var(--accent-red);
            text-shadow: 0 0 50px rgba(255, 71, 87, 0.5);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            margin-top: 22px;
            border-top: 1px solid var(--glass-border);
        }
        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">L'endettement de la France<br>multiplié par <span class="accent">5,6</span> depuis 1980</h2>

            <div class="compare-area">
                <div class="compare-blocks">
                    <div class="compare-block">
                        <div class="compare-label">1980</div>
                        <div class="compare-value">21 % du PIB</div>
                    </div>

                    <div class="compare-block highlight">
                        <div class="compare-label">2025</div>
                        <div class="compare-value">117 % du PIB</div>
                    </div>
                </div>
                <div class="compare-emoji">📈</div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>INSEE · Eurostat · 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

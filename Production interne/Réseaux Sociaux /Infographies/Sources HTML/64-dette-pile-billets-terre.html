<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTF – 115ter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#0c0616;--bg-mid:#1a0c2d;--accent:#a855f7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Syne',sans-serif;background:#1a1a2e;display:flex;justify-content:center}
.infographic{width:1080px;height:1080px;position:relative;overflow:hidden}
.bg-base{position:absolute;inset:0;background:linear-gradient(145deg,var(--bg-deep) 0%,var(--bg-mid) 50%,var(--bg-deep) 100%)}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(168,85,247,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,0.04) 1px,transparent 1px);background-size:40px 40px}
.bg-glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(168,85,247,0.12) 0%,transparent 60%);bottom:-100px;left:50%;transform:translateX(-50%);pointer-events:none}
.content{position:relative;z-index:1;height:100%;padding:50px 60px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{font-family:'Instrument Serif',serif;font-size:3.5rem;color:var(--accent);line-height:1}
.logo-text{font-family:'Instrument Serif',serif;font-size:1.7rem;font-style:italic;color:#fff;line-height:1}
.center-block{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.explain{font-family:'Instrument Serif',serif;font-size:4.5rem;color:#fff;text-align:center;line-height:1.15}
/* Orbit visual */
.orbit-wrapper{position:relative;width:500px;height:500px;display:flex;align-items:center;justify-content:center}
.orbit-earth{font-size:10rem;z-index:2;position:relative}
/* Two orbit rings */
.orbit-ring{position:absolute;border:3px solid rgba(168,85,247,0.35);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.orbit-ring-1{width:380px;height:380px;border-style:dashed;border-color:var(--accent);opacity:0.5}
.orbit-ring-2{width:480px;height:480px;border-style:dashed;border-color:var(--accent);opacity:0.3}
/* Bills orbiting */
.orbit-bill{position:absolute;font-size:2.5rem;z-index:3}
.ob1{top:10px;left:50%;transform:translateX(-50%)}
.ob2{top:60px;right:30px}
.ob3{bottom:60px;right:20px}
.ob4{bottom:5px;left:50%;transform:translateX(-50%)}
.ob5{bottom:60px;left:20px}
.ob6{top:60px;left:30px}
.ob7{top:50%;right:5px;transform:translateY(-50%)}
.ob8{top:50%;left:5px;transform:translateY(-50%)}
/* Arrow showing direction */
.orbit-arrow{position:absolute;font-size:2rem;color:var(--accent)}
.oa1{top:35px;right:70px;transform:rotate(45deg)}
.oa2{bottom:35px;left:70px;transform:rotate(225deg)}
.accent-label{font-family:'JetBrains Mono',monospace;font-size:3.5rem;font-weight:700;color:var(--accent);text-align:center;text-shadow:0 0 30px rgba(168,85,247,0.3)}
.footer{width:100%;text-align:center}
.website{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;color:#fff}
</style></head><body>
<div class="infographic"><div class="bg-base"></div><div class="bg-grid"></div><div class="bg-glow"></div>
<div class="content">
<div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
<div class="center-block">
<div class="explain">Soit presque</div>
<div class="orbit-wrapper">
  <div class="orbit-ring orbit-ring-1"></div>
  <div class="orbit-ring orbit-ring-2"></div>
  <div class="orbit-earth">🌍</div>
  <div class="orbit-bill ob1">💶</div>
  <div class="orbit-bill ob2">💶</div>
  <div class="orbit-bill ob3">💶</div>
  <div class="orbit-bill ob4">💶</div>
  <div class="orbit-bill ob5">💶</div>
  <div class="orbit-bill ob6">💶</div>
  <div class="orbit-bill ob7">💶</div>
  <div class="orbit-bill ob8">💶</div>
  <div class="orbit-arrow oa1">➤</div>
  <div class="orbit-arrow oa2">➤</div>
</div>
<div class="accent-label">2 × le tour de la Terre</div>
</div>
<div class="footer"><div class="website">ouvalargent.com</div></div>
</div></div></body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dépenses publiques : de 35% à 57% du PIB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --bg-mid: #0a1628;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-gold: #ffd700;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --accent-orange: #ff9f43;
            --accent-violet: #a855f7;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
            bottom: -200px;
            right: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
            top: -150px;
            left: -100px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 40px 50px 35px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5rem;
            text-align: center;
            margin-bottom: 0;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: var(--accent-red);
            font-style: italic;
        }

        .chart-title .accent-cyan {
            color: var(--accent-electric);
            font-style: italic;
        }

        .chart-subtitle {
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* ===== BAR CHART ===== */
        .chart-area {
            flex: 1;
            display: flex;
            position: relative;
            padding: 0 10px;
        }

        .bars-container {
            flex: 1;
            display: flex;
            gap: 6px;
            position: relative;
            height: 100%;
        }

        /* Each bar column — data range: 35% to 62%, display from 30% to 65% */
        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            height: 100%;
        }

        .bar {
            width: 75%;
            border-radius: 6px 6px 0 0;
            position: relative;
            background: linear-gradient(180deg, var(--accent-violet), rgba(168, 85, 247, 0.7));
        }

        .bar.level-low {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.9), rgba(0, 212, 255, 0.5));
        }

        .bar.level-mid {
            background: linear-gradient(180deg, rgba(168, 85, 247, 0.9), rgba(168, 85, 247, 0.6));
        }

        .bar.level-high {
            background: linear-gradient(180deg, var(--accent-red), rgba(255, 71, 87, 0.7));
            box-shadow: 0 -4px 20px rgba(255, 71, 87, 0.25);
        }

        .bar.level-peak {
            background: linear-gradient(180deg, #ff1a2e, var(--accent-red));
            box-shadow: 0 -4px 25px rgba(255, 71, 87, 0.4);
        }

        /* Value labels */
        .bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.35rem;
            font-weight: 700;
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            color: var(--text-primary);
        }

        .bar.level-low .bar-value { color: var(--accent-electric); }
        .bar.level-mid .bar-value { color: var(--accent-violet); }
        .bar.level-high .bar-value { color: var(--accent-red); }
        .bar.level-peak .bar-value { color: #ff1a2e; font-size: 1.5rem; }

        /* Year labels below chart */
        .year-labels {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            padding: 0 10px;
        }

        .year-label {
            flex: 1;
            text-align: center;
        }

        .year-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: auto;
            border-top: 1px solid var(--glass-border);
        }

        .source {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .source span {
            color: var(--text-secondary);
        }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-electric);
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">Dépenses publiques :<br><span class="accent-cyan">de 35%</span> à <span class="accent">57%</span> du PIB</h2>
            <div class="chart-subtitle">Ratio dépenses publiques / PIB en France (1960–2024)</div>

            <div class="chart-area">
                <div class="bars-container">
                    <!-- 1960: 35.8% → height: (35.8-30)/(65-30) = 5.8/35 = 16.6% -->
                    <div class="bar-col">
                        <div class="bar level-low" style="height: 16.6%;">
                            <div class="bar-value">35,8</div>
                        </div>
                    </div>

                    <!-- 1965: 40.4% → (40.4-30)/35 = 29.7% -->
                    <div class="bar-col">
                        <div class="bar level-low" style="height: 29.7%;">
                            <div class="bar-value">40,4</div>
                        </div>
                    </div>

                    <!-- 1970: 41.5% → (41.5-30)/35 = 32.9% -->
                    <div class="bar-col">
                        <div class="bar level-low" style="height: 32.9%;">
                            <div class="bar-value">41,5</div>
                        </div>
                    </div>

                    <!-- 1975: 46.2% → (46.2-30)/35 = 46.3% -->
                    <div class="bar-col">
                        <div class="bar level-low" style="height: 46.3%;">
                            <div class="bar-value">46,2</div>
                        </div>
                    </div>

                    <!-- 1980: 48.0% → (48.0-30)/35 = 51.4% -->
                    <div class="bar-col">
                        <div class="bar level-mid" style="height: 51.4%;">
                            <div class="bar-value">48,0</div>
                        </div>
                    </div>

                    <!-- 1985: 54.2% → (54.2-30)/35 = 69.1% -->
                    <div class="bar-col">
                        <div class="bar level-mid" style="height: 69.1%;">
                            <div class="bar-value">54,2</div>
                        </div>
                    </div>

                    <!-- 1990: 51.6% → (51.6-30)/35 = 61.7% -->
                    <div class="bar-col">
                        <div class="bar level-mid" style="height: 61.7%;">
                            <div class="bar-value">51,6</div>
                        </div>
                    </div>

                    <!-- 1995: 56.1% → (56.1-30)/35 = 74.6% -->
                    <div class="bar-col">
                        <div class="bar level-mid" style="height: 74.6%;">
                            <div class="bar-value">56,1</div>
                        </div>
                    </div>

                    <!-- 2000: 52.6% → (52.6-30)/35 = 64.6% -->
                    <div class="bar-col">
                        <div class="bar level-mid" style="height: 64.6%;">
                            <div class="bar-value">52,6</div>
                        </div>
                    </div>

                    <!-- 2005: 54.3% → (54.3-30)/35 = 69.4% -->
                    <div class="bar-col">
                        <div class="bar level-high" style="height: 69.4%;">
                            <div class="bar-value">54,3</div>
                        </div>
                    </div>

                    <!-- 2010: 57.7% → (57.7-30)/35 = 79.1% -->
                    <div class="bar-col">
                        <div class="bar level-high" style="height: 79.1%;">
                            <div class="bar-value">57,7</div>
                        </div>
                    </div>

                    <!-- 2015: 57.6% → (57.6-30)/35 = 78.9% -->
                    <div class="bar-col">
                        <div class="bar level-high" style="height: 78.9%;">
                            <div class="bar-value">57,6</div>
                        </div>
                    </div>

                    <!-- 2020: 61.7% → (61.7-30)/35 = 90.6% -->
                    <div class="bar-col">
                        <div class="bar level-peak" style="height: 90.6%;">
                            <div class="bar-value">61,7</div>
                        </div>
                    </div>

                    <!-- 2024: 57.3% → (57.3-30)/35 = 78.0% -->
                    <div class="bar-col">
                        <div class="bar level-high" style="height: 78.0%;">
                            <div class="bar-value">57,3</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Year labels -->
            <div class="year-labels">
                <div class="year-label"><div class="year-num">1960</div></div>
                <div class="year-label"><div class="year-num">1965</div></div>
                <div class="year-label"><div class="year-num">1970</div></div>
                <div class="year-label"><div class="year-num">1975</div></div>
                <div class="year-label"><div class="year-num">1980</div></div>
                <div class="year-label"><div class="year-num">1985</div></div>
                <div class="year-label"><div class="year-num">1990</div></div>
                <div class="year-label"><div class="year-num">1995</div></div>
                <div class="year-label"><div class="year-num">2000</div></div>
                <div class="year-label"><div class="year-num">2005</div></div>
                <div class="year-label"><div class="year-num">2010</div></div>
                <div class="year-label"><div class="year-num">2015</div></div>
                <div class="year-label"><div class="year-num">2020</div></div>
                <div class="year-label"><div class="year-num">2024</div></div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>INSEE · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

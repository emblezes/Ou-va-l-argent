<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La part du logement a fortement augmenté</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --bg-mid:  #142b48;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0, 212, 255, 0.12) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 40px 50px 35px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; margin-bottom: 10px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 5.5rem; text-align: center; color: var(--text-primary); line-height: 1.05; }
        .chart-title .accent { color: var(--accent-electric); font-style: italic; }
        .subtitle { text-align: center; font-size: 1rem; color: var(--text-secondary); margin-bottom: 15px; margin-top: 8px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; }

        .chart-area { flex: 0 0 auto; height: 500px; display: flex; padding: 0 10px; align-items: flex-end; margin-top: 40px; }
        .bars-container { flex: 1; display: flex; gap: 14px; align-items: flex-end; height: 100%; }
        .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }

        .bar-up {
            width: 75%;
            border-radius: 8px 8px 0 0;
            position: relative;
            background: linear-gradient(180deg, #4a6580 0%, #2d4060 100%);
        }
        .bar-up.highlight {
            background: linear-gradient(180deg, #00d4ff 0%, #0089b3 100%);
            box-shadow: 0 -6px 30px rgba(0, 212, 255, 0.45);
        }
        .bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            color: var(--text-primary);
        }
        .bar-up.highlight .bar-value { color: var(--accent-electric); font-size: 2.4rem; }

        .year-labels { display: flex; gap: 14px; margin-top: 18px; padding: 0 10px; }
        .year-label { flex: 1; text-align: center; }
        .year-num { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--text-primary); }
        .year-label.highlight .year-num { color: var(--accent-electric); font-weight: 700; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: auto; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">La part du <span class="accent">logement</span><br>dans le budget des Français<br>a <span class="accent">fortement augmenté</span></h2>
            <div class="subtitle">Part dans la consommation finale des ménages · France · 1985-2020</div>

            <div class="chart-area">
                <div class="bars-container">
                    <!-- 1985 : 21% (réel 20,5) → height 21/30 = 70% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 70%;">
                            <div class="bar-value">21 %</div>
                        </div>
                    </div>
                    <!-- 2000 : 24% (réel 23,7) → height 24/30 = 80% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 80%;">
                            <div class="bar-value">24 %</div>
                        </div>
                    </div>
                    <!-- 2020 : 29% (réel 28,5) → height 29/30 = 96.7% — HIGHLIGHT -->
                    <div class="bar-col">
                        <div class="bar-up highlight" style="height: 96.7%;">
                            <div class="bar-value">29 %</div>
                        </div>
                    </div>
                </div>
                <div class="year-labels">
                    <div class="year-label"><div class="year-num">1985</div></div>
                    <div class="year-label"><div class="year-num">2000</div></div>
                    <div class="year-label highlight"><div class="year-num">2020</div></div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Insee · Comptes nationaux · 1985-2020</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

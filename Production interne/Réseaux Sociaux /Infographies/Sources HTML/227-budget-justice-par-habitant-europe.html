<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Budget de la justice par habitant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --bg-mid:  #142b48;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0, 212, 255, 0.10) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 71, 87, 0.07) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 60px 40px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 5.2rem; text-align: center; color: var(--text-primary); line-height: 1.04; margin-top: 18px; letter-spacing: -1.8px; }
        .chart-title .accent { color: var(--accent-electric); font-style: italic; }
        .subtitle { text-align: center; font-size: 1.15rem; color: var(--text-secondary); margin-top: 14px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }

        .chart-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0 8px; min-height: 0; }

        .bars-row { display: flex; align-items: flex-end; justify-content: center; gap: 26px; }
        .bar-group { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--text-primary); line-height: 1; }
        .bar-value.france { color: var(--accent-electric); font-size: 2.3rem; }
        .bar-fill { width: 116px; border-radius: 10px 10px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
        .bar-fill.neutral { background: linear-gradient(180deg, #4a6580 0%, #2d4060 100%); }
        .bar-fill.france  { background: linear-gradient(180deg, #00d4ff 0%, #0090c0 100%); box-shadow: 0 0 45px rgba(0, 212, 255, 0.55); }
        .flag { width: 48px; height: 32px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,0.18); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .flag.fr { background: linear-gradient(90deg, #0055A4 0 33.33%, #ffffff 33.33% 66.66%, #EF4135 66.66% 100%); }
        .flag.it { background: linear-gradient(90deg, #009246 0 33.33%, #f4f5f0 33.33% 66.66%, #CE2B37 66.66% 100%); }
        .flag.de { background: linear-gradient(180deg, #000000 0 33.33%, #DD0000 33.33% 66.66%, #FFCE00 66.66% 100%); }
        .flag.at { background: linear-gradient(180deg, #C8102E 0 33.33%, #ffffff 33.33% 66.66%, #C8102E 66.66% 100%); }
        .flag.es { background: linear-gradient(180deg, #AA151B 0 25%, #F1BF00 25% 75%, #AA151B 75% 100%); }
        .flag.eu { background: #003399; }
        .flag.eu .ring { width: 16px; height: 16px; border: 2px solid #FFCC00; border-radius: 50%; }
        .bar-label { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; color: var(--text-secondary); font-weight: 600; text-align: center; }
        .bar-label.france { color: var(--accent-electric); }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; margin-top: 6px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">Budget de la justice<br><span class="accent">par habitant</span></h2>
            <div class="subtitle">France vs Europe · en euros · CEPEJ 2024</div>

            <div class="chart-area">
                <div class="bars-row">
                    <div class="bar-group">
                        <div class="bar-value">141 €</div>
                        <div class="bar-fill neutral" style="height: 420px;"></div>
                        <div class="flag at"></div>
                        <div class="bar-label">Autriche</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-value">136 €</div>
                        <div class="bar-fill neutral" style="height: 405px;"></div>
                        <div class="flag de"></div>
                        <div class="bar-label">Allemagne</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-value">101 €</div>
                        <div class="bar-fill neutral" style="height: 301px;"></div>
                        <div class="flag it"></div>
                        <div class="bar-label">Italie</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-value">97 €</div>
                        <div class="bar-fill neutral" style="height: 289px;"></div>
                        <div class="flag es"></div>
                        <div class="bar-label">Espagne</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-value">85 €</div>
                        <div class="bar-fill neutral" style="height: 253px;"></div>
                        <div class="flag eu"><span class="ring"></span></div>
                        <div class="bar-label">UE</div>
                    </div>
                    <div class="bar-group">
                        <div class="bar-value france">77 €</div>
                        <div class="bar-fill france" style="height: 229px;"></div>
                        <div class="flag fr"></div>
                        <div class="bar-label france">France</div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>CEPEJ · Conseil de l'Europe · Rapport 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

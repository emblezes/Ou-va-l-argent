<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTF – 126bis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#12050a;--bg-mid:#2a0a14;--accent:#ff4757}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Syne',sans-serif;background:#1a1a2e;display:flex;justify-content:center}
.infographic{width:1080px;height:1080px;position:relative;overflow:hidden}
.bg-base{position:absolute;inset:0;background:linear-gradient(145deg,var(--bg-deep) 0%,var(--bg-mid) 50%,var(--bg-deep) 100%)}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,71,87,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,71,87,0.03) 1px,transparent 1px);background-size:40px 40px}
.bg-glow{position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(255,71,87,0.08) 0%,transparent 60%);top:40%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.content{position:relative;z-index:1;height:100%;padding:40px 60px 30px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{font-family:'Instrument Serif',serif;font-size:3.5rem;color:var(--accent);line-height:1}
.logo-text{font-family:'Instrument Serif',serif;font-size:1.7rem;font-style:italic;color:#fff;line-height:1}

/* Main comparison */
.compare{display:flex;align-items:center;justify-content:center;gap:50px;width:100%}
.side{display:flex;flex-direction:column;align-items:center;gap:20px}
.big-num{font-family:'JetBrains Mono',monospace;font-weight:700;line-height:0.9;text-align:center}
.num-fr{font-size:11rem;color:var(--accent);text-shadow:0 0 60px rgba(255,71,87,0.35)}
.num-ch{font-size:11rem;color:#00ff88;text-shadow:0 0 60px rgba(0,255,136,0.25)}
.flag-label{display:flex;align-items:center;gap:16px}
.flag{font-size:5.5rem;line-height:1}
.country{font-family:'Instrument Serif',serif;font-size:3.8rem;color:#fff}

/* VS */
.vs{font-family:'Instrument Serif',serif;font-size:3rem;font-style:italic;color:rgba(255,255,255,0.25);align-self:center}

/* Title at bottom */
.hook{font-family:'Instrument Serif',serif;font-size:5.5rem;font-style:italic;color:#fff;text-align:center;line-height:1}

.footer{width:100%;text-align:center}
.website{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;color:#fff}
</style></head><body>
<div class="infographic"><div class="bg-base"></div><div class="bg-grid"></div><div class="bg-glow"></div>
<div class="content">
<div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>

<div class="hook">Chômage</div>

<div class="compare">
  <div class="side">
    <div class="big-num num-fr">7,3%</div>
    <div class="flag-label"><span class="flag">🇫🇷</span><span class="country">France</span></div>
  </div>
  <div class="vs">vs</div>
  <div class="side">
    <div class="big-num num-ch">4,2%</div>
    <div class="flag-label"><span class="flag">🇨🇭</span><span class="country">Suisse</span></div>
  </div>
</div>

<div class="footer"><div class="website">ouvalargent.com</div></div>
</div></div></body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le salaire moyen selon les pays</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.10) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 71, 87, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 60px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5.5rem;
            text-align: center;
            margin-top: 30px;
            margin-bottom: 4px;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: var(--accent-electric);
            font-style: italic;
        }

        .chart-subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0;
            padding: 0 40px;
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 24px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .rank-row:last-child { border-bottom: none; }

        .rank-row.highlight .rank-name { color: var(--accent-red); }
        .rank-row.highlight .rank-value { color: var(--accent-red); }

        .rank-flag {
            font-size: 3.5rem;
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }

        .rank-name {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #fff;
            flex: 1;
        }

        .rank-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-electric);
            white-space: nowrap;
        }

        .rank-unit {
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            margin-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-electric);
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">Le <span class="accent">salaire moyen</span><br>selon les pays</h2>
            <div class="chart-subtitle">Salaire net mensuel moyen · 2024</div>

            <div class="chart-area">
                <div class="rank-row"><div class="rank-flag">🇨🇭</div><div class="rank-name">Suisse</div><div class="rank-value">6 500 € <span class="rank-unit">/mois</span></div></div>
                <div class="rank-row"><div class="rank-flag">🇱🇺</div><div class="rank-name">Luxembourg</div><div class="rank-value">4 200 € <span class="rank-unit">/mois</span></div></div>
                <div class="rank-row"><div class="rank-flag">🇺🇸</div><div class="rank-name">États-Unis</div><div class="rank-value">3 500 € <span class="rank-unit">/mois</span></div></div>
                <div class="rank-row highlight"><div class="rank-flag">🇫🇷</div><div class="rank-name">France</div><div class="rank-value">2 730 € <span class="rank-unit">/mois</span></div></div>
                <div class="rank-row"><div class="rank-flag">🇵🇹</div><div class="rank-name">Portugal</div><div class="rank-value">1 430 € <span class="rank-unit">/mois</span></div></div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>OFS · STATEC · Census Bureau · INSEE · INE · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

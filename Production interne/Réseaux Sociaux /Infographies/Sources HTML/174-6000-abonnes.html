<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 000 abonnés</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --bg-mid: #0a1628;
            --accent: #00d4ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }
        .bg-base {
            position: absolute; inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }
        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .bg-glow-1 {
            position: absolute; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.10) 0%, transparent 70%);
            top: -200px; right: -200px; pointer-events: none;
        }
        .bg-glow-2 {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
            bottom: -200px; left: -150px; pointer-events: none;
        }
        .content {
            position: relative; z-index: 1; height: 100%;
            padding: 45px 60px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 14px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.5rem; color: var(--accent); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .center-block {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0;
        }
        .rocket {
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 10px;
        }
        .big-number {
            font-family: 'Instrument Serif', serif;
            font-size: 18rem;
            font-style: italic;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -5px;
        }
        .label-row {
            position: relative;
            margin-top: 15px;
        }
        .label {
            font-family: 'Instrument Serif', serif;
            font-size: 7.5rem;
            font-style: normal;
            color: #ffffff;
            line-height: 1;
        }
        .emoji-side {
            position: absolute;
            right: -120px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 7rem;
            line-height: 1;
        }
        .sub-label {
            font-family: 'Instrument Serif', serif;
            font-size: 3.5rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1;
            margin-top: 20px;
        }
        .merci {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }

        .footer {
            display: flex; align-items: center; justify-content: center;
            width: 100%;
        }
        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="logo">
                <span class="logo-icon">€</span>
                <span class="logo-text">Où Va l'Argent ?</span>
            </div>
            <div class="center-block">
                <div class="big-number">6 000</div>
                <div class="label-row">
                    <div class="label">abonnés !</div>
                    <span class="emoji-side">🤯</span>
                </div>
                <div class="sub-label">en 24h</div>
            </div>
            <div class="footer">
                <span class="website">ouvalargent.com</span>
            </div>
        </div>
    </div>
</body>
</html>

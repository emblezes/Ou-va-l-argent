<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Les marques MAGA peinent à être rentables</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #120c20; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-orange: #ff9f43; --accent-violet: #a855f7; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #120c20 0%, #2a1555 50%, #120c20 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(168,85,247,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 71, 87, 0.08) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: var(--accent-violet); font-style: italic; }
        .chart-unit { font-family: 'Instrument Serif', serif; font-size: 1.5rem; font-style: italic; color: var(--text-secondary); text-align: center; margin-bottom: 40px; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .bar-chart { width: 100%; max-width: 800px; }
        .bar-item { margin-bottom: 30px; display: flex; align-items: center; }
        .bar-label { width: 200px; font-size: 1.4rem; color: var(--text-primary); font-weight: 600; }
        .bar-container { flex: 1; height: 60px; position: relative; background: rgba(255, 255, 255, 0.05); border-radius: 8px; margin-left: 20px; }
        .bar-fill { height: 100%; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: flex-end; padding-right: 15px; }
        .bar-positive { background: linear-gradient(90deg, rgba(0,255,136,0.4) 0%, #00ff88 100%); width: 100%; }
        .bar-negative { background: linear-gradient(90deg, rgba(255,71,87,0.4) 0%, #ff4757 100%); width: 65%; }
        .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 600; color: #ffffff; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .gap-info { background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3); border-radius: 12px; padding: 20px; margin-top: 30px; text-align: center; }
        .gap-value { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--accent-violet); }
        .gap-label { font-size: 1.1rem; color: var(--text-secondary); margin-top: 5px; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="echec-marques-maga-profits">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">Les marques MAGA<br><span class="accent">peinent à être rentables</span></h2>
            <div class="center-area">
                <div class="chart-unit">évolution des bénéfices en %</div>
                <div class="bar-chart">
                    <div class="bar-item">
                        <div class="bar-label">Marques mainstream</div>
                        <div class="bar-container">
                            <div class="bar-fill bar-positive">
                                <div class="bar-value">+8%</div>
                            </div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">Marques MAGA</div>
                        <div class="bar-container">
                            <div class="bar-fill bar-negative">
                                <div class="bar-value">-15%</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="gap-info">
                    <div class="gap-value">23 pts d'écart</div>
                    <div class="gap-label">entre les deux segments</div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>Challenges · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

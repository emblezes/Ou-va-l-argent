<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déficit public : 6,2 % en 2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --bg-mid:  #142b48;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.12) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 50px 60px 40px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 5.6rem; text-align: center; color: var(--text-primary); line-height: 1.0; margin-top: 26px; letter-spacing: -2px; white-space: nowrap; }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }

        .chart-area { flex: 1; display: flex; align-items: stretch; justify-content: center; padding: 36px 0 0; min-height: 0; overflow: hidden; }
        .chart-wrap { width: 100%; max-width: 960px; min-height: 0; }
        .chart-wrap svg { width: 100%; height: 100%; display: block; }

        .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; fill: var(--text-primary); }
        .bar-value  { font-family: 'JetBrains Mono', monospace; font-size: 2.4rem; font-weight: 700; fill: var(--text-primary); }
        .bar-value.proj { fill: var(--accent-red); }
        .year-label { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; fill: var(--text-primary); }
        .year-label.proj { fill: var(--text-secondary); }

        .legend { display: flex; justify-content: center; gap: 40px; padding: 14px 0 4px; }
        .legend-item { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
        .legend-dot { width: 22px; height: 22px; border-radius: 5px; }
        .legend-dot.real { background: linear-gradient(180deg, #4a6580 0%, #2d4060 100%); }
        .legend-dot.proj { background: linear-gradient(180deg, #ff4757 0%, #c0263a 100%); }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; margin-top: 6px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">Déficit public : <span class="accent">6,2 %</span> en 2027</h2>

            <div class="chart-area">
                <div class="chart-wrap">
                    <!-- Déficit = négatif : barres suspendues sous la ligne 0 (haut). 0 �  y=80, -7 % �  y=640. 1 % = 80px. -->
                    <svg viewBox="0 0 960 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gradReal" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#4a6580"/>
                                <stop offset="100%" stop-color="#2d4060"/>
                            </linearGradient>
                            <linearGradient id="gradProj" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#ff4757"/>
                                <stop offset="100%" stop-color="#c0263a"/>
                            </linearGradient>
                            <filter id="redGlow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                        </defs>

                        <!-- Axe Y (négatif, 0 en haut) -->
                        <line x1="92" y1="80" x2="92" y2="640" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                        <text class="axis-label" x="80" y="85"  text-anchor="end">0</text>
                        <text class="axis-label" x="80" y="165" text-anchor="end">−1 %</text>
                        <text class="axis-label" x="80" y="245" text-anchor="end">−2 %</text>
                        <text class="axis-label" x="80" y="325" text-anchor="end">−3 %</text>
                        <text class="axis-label" x="80" y="405" text-anchor="end">−4 %</text>
                        <text class="axis-label" x="80" y="485" text-anchor="end">−5 %</text>
                        <text class="axis-label" x="80" y="565" text-anchor="end">−6 %</text>
                        <text class="axis-label" x="80" y="645" text-anchor="end">−7 %</text>
                        <line x1="92" y1="160" x2="900" y2="160" stroke="rgba(255,255,255,0.05)"/>
                        <line x1="92" y1="240" x2="900" y2="240" stroke="rgba(255,255,255,0.05)"/>
                        <line x1="92" y1="320" x2="900" y2="320" stroke="rgba(255,255,255,0.05)"/>
                        <line x1="92" y1="400" x2="900" y2="400" stroke="rgba(255,255,255,0.05)"/>
                        <line x1="92" y1="480" x2="900" y2="480" stroke="rgba(255,255,255,0.05)"/>
                        <line x1="92" y1="560" x2="900" y2="560" stroke="rgba(255,255,255,0.05)"/>
                        <!-- Ligne 0 forte -->
                        <line x1="92" y1="80" x2="900" y2="80" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>

                        <!-- 5 barres suspendues depuis y=80. width=74. centres : 200, 365, 530, 695, 860 -->

                        <!-- 2023 : −5,5 % -> h=440, bas y=520 -->
                        <text class="year-label" x="200" y="68" text-anchor="middle">2023</text>
                        <rect x="163" y="80" width="74" height="440" fill="url(#gradReal)" rx="6"/>
                        <text class="bar-value" x="200" y="566" text-anchor="middle">5,5%</text>

                        <!-- 2024 : −5,8 % -> h=464, bas y=544 -->
                        <text class="year-label" x="365" y="68" text-anchor="middle">2024</text>
                        <rect x="328" y="80" width="74" height="464" fill="url(#gradReal)" rx="6"/>
                        <text class="bar-value" x="365" y="590" text-anchor="middle">5,8%</text>

                        <!-- 2025 : −5,1 % -> h=408, bas y=488 -->
                        <text class="year-label" x="530" y="68" text-anchor="middle">2025</text>
                        <rect x="493" y="80" width="74" height="408" fill="url(#gradReal)" rx="6"/>
                        <text class="bar-value" x="530" y="534" text-anchor="middle">5,1%</text>

                        <!-- 2026 (p) : −5,4 % -> h=432, bas y=512 -->
                        <text class="year-label proj" x="695" y="68" text-anchor="middle">2026 (p)</text>
                        <rect x="658" y="80" width="74" height="432" fill="url(#gradProj)" rx="6" opacity="0.78"/>
                        <text class="bar-value proj" x="695" y="558" text-anchor="middle">5,4%</text>

                        <!-- 2027 (p) : −6,2 % -> h=496, bas y=576 -->
                        <text class="year-label proj" x="860" y="68" text-anchor="middle">2027 (p)</text>
                        <rect x="823" y="80" width="74" height="496" fill="url(#gradProj)" rx="6" filter="url(#redGlow)"/>
                        <text class="bar-value proj" x="860" y="622" text-anchor="middle">6,2%</text>
                    </svg>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="legend-dot real"></div>Réalisé (INSEE)</div>
                <div class="legend-item"><div class="legend-dot proj"></div>Projection (Bercy)</div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>INSEE (réalisé 2023-2025) · prévisions 2026-2027</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

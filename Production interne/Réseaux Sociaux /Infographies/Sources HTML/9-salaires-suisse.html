<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les salaires en Suisse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.12) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 40px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #ffd700; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5.5rem;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 2px;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: #ffd700;
            font-style: italic;
        }

        .chart-subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0;
            padding: 0 40px;
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 28px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .rank-row:last-child {
            border-bottom: none;
        }

        .rank-emoji {
            font-size: 4rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .rank-name {
            font-family: 'Syne', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: #fff;
            flex: 1;
        }

        .rank-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.6rem;
            font-weight: 800;
            color: #ffd700;
            white-space: nowrap;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .source {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .source span {
            color: var(--text-secondary);
        }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">💰 Les salaires en <span class="accent">Suisse</span> 🇨🇭</h2>
            <div class="chart-subtitle">Salaire médian net mensuel (Office fédéral de la statistique · 2024)</div>

            <div class="chart-area">
                <div class="rank-row"><div class="rank-emoji">🩺</div><div class="rank-name">Médecin</div><div class="rank-value">7 500 €</div></div>
                <div class="rank-row"><div class="rank-emoji">🏦</div><div class="rank-name">Employé banque</div><div class="rank-value">4 200 €</div></div>
                <div class="rank-row"><div class="rank-emoji">🚌</div><div class="rank-name">Chauffeur bus</div><div class="rank-value">4 000 €</div></div>
                <div class="rank-row"><div class="rank-emoji">👷</div><div class="rank-name">Ouvrier BTP</div><div class="rank-value">3 500 €</div></div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Office fédéral de la statistique · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

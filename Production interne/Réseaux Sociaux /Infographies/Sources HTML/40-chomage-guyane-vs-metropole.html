<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chômage Guyane 17% vs Métropole 7,5%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --bg-surface: #0a0e14; --bg-elevated: #111820; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43; --glass: rgba(17, 24, 32, 0.85); --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 71, 87, 0.1) 0%, transparent 70%); top: -200px; left: -200px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%); bottom: -150px; right: -100px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 48px 55px 38px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, var(--accent-electric) 0%, #0099cc 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.4rem; color: var(--bg-deep); }
        .logo-text { font-weight: 700; font-size: 1.3rem; color: var(--text-primary); }
        .tag { padding: 12px 24px; background: rgba(255, 159, 67, 0.15); border: 1px solid rgba(255, 159, 67, 0.3); border-radius: 50px; font-size: 1rem; font-weight: 600; color: var(--accent-orange); text-transform: uppercase; letter-spacing: 0.1em; }
        .section-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; margin-bottom: 30px; color: var(--text-primary); line-height: 1.12; }
        .section-title .accent { color: var(--accent-red); font-style: italic; }
        .comparison-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
        .comparison-item { text-align: center; padding: 35px 30px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; position: relative; }
        .comparison-item.dim { background: linear-gradient(135deg, rgba(255, 71, 87, 0.06) 0%, rgba(255, 71, 87, 0.02) 100%); border-color: rgba(255, 71, 87, 0.2); }
        .comparison-item.dim::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent-red); border-radius: 20px 20px 0 0; }
        .comparison-item.highlight { background: linear-gradient(135deg, rgba(0, 212, 255, 0.06) 0%, rgba(0, 212, 255, 0.02) 100%); border-color: rgba(0, 212, 255, 0.2); }
        .comparison-item.highlight::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent-electric); border-radius: 20px 20px 0 0; }
        .flag { font-size: 4rem; margin-bottom: 10px; }
        .comparison-label { font-size: 2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 20px; }
        .comparison-value { font-family: 'JetBrains Mono', monospace; font-size: 5.5rem; font-weight: 700; line-height: 1; margin-bottom: 12px; }
        .comparison-value.red { color: var(--accent-red); }
        .comparison-value.electric { color: var(--accent-electric); }
        .comparison-desc { font-size: 1.2rem; color: var(--text-secondary); line-height: 1.4; }
        .comparison-desc strong { color: var(--accent-red); }
        .comparison-desc .green { color: var(--accent-green); }
        .vs-badge { position: absolute; top: 50%; right: -28px; transform: translateY(-50%); width: 56px; height: 56px; background: var(--bg-elevated); border: 2px solid var(--accent-electric); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .vs-text { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 700; color: var(--accent-electric); }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: auto; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.9rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">€</div>
                    <span class="logo-text">Où Va l'Argent</span>
                </div>
                <div class="tag">Macro-économie</div>
            </div>
            <h2 class="section-title">Chômage : la Guyane,<br><span class="accent">2x la métropole</span></h2>
            <div class="comparison-grid">
                <div class="comparison-item dim">
                    <div class="vs-badge"><span class="vs-text">VS</span></div>
                    <div class="flag">🇫🇷</div>
                    <div class="comparison-label">Guyane</div>
                    <div class="comparison-value red">17%</div>
                    <div class="comparison-desc">de chômage<br>PIB/hab : <strong>16 800 €</strong><br>53% sous le seuil de pauvreté</div>
                </div>
                <div class="comparison-item highlight">
                    <div class="flag">🇫🇷</div>
                    <div class="comparison-label">Métropole</div>
                    <div class="comparison-value electric">7,5%</div>
                    <div class="comparison-desc">de chômage<br>PIB/hab : <span class="green">42 000 €</span><br>14% sous le seuil de pauvreté</div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Source : <span>INSEE — T3 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

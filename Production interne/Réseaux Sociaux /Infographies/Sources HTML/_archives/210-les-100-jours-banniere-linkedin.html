<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }

        .infographic {
            width: 1584px;
            height: 396px;
            position: relative;
            overflow: hidden;
        }

        .bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, #06080c 0%, #0a1628 40%, #06080c 100%);
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-family: 'Instrument Serif', serif;
            font-size: 5.5rem;
            color: #ffffff;
            line-height: 1;
            text-align: center;
            font-style: italic;
            letter-spacing: -0.01em;
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg"></div>
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="content">
            <div class="title">La rupture libérale dont la France a besoin</div>
        </div>
    </div>
</body>
</html>

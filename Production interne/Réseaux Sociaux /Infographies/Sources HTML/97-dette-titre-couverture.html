<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>5 chocs sur la dette publique française</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 71, 87, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 71, 87, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 800px; height: 800px; background: radial-gradient(circle, rgba(255, 71, 87, 0.15) 0%, transparent 70%); top: -300px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%); bottom: -200px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .title-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .big-title { font-family: 'Instrument Serif', serif; font-size: 5.5rem; color: var(--text-primary); line-height: 1.15; }
        .big-title .number { color: var(--accent-red); font-style: italic; font-size: 8rem; }
        .big-title .gold { color: var(--accent-gold); }
        .swipe { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--text-muted); margin-top: 40px; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="48-dette-titre-couverture">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>
            <div class="title-area">
                <h1 class="big-title"><span class="number">5</span> <span class="gold">chiffres chocs</span><br>sur la dette<br>publique française</h1>
                <div class="swipe">Swipe →</div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>INSEE, Eurostat, Banque de France · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

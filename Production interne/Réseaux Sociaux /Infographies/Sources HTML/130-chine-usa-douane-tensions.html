<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chine-USA : la guerre des droits de douane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #081518; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-orange: #ff9f43; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #081518 0%, #0a3540 50%, #081518 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: var(--accent-electric); font-style: italic; }
        .chart-unit { font-family: 'Instrument Serif', serif; font-size: 1.5rem; font-style: italic; color: var(--text-secondary); text-align: center; margin-top: 15px; margin-bottom: 40px; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 80px; }
        .chart-bars { width: 100%; max-width: 800px; margin: 40px 0; }
        .bar-item { margin-bottom: 60px; }
        .bar-label { font-family: 'Syne', sans-serif; font-size: 1.8rem; color: var(--text-primary); margin-bottom: 15px; font-weight: 600; }
        .bar-container { position: relative; width: 100%; height: 80px; background: rgba(255, 255, 255, 0.05); border-radius: 12px; overflow: hidden; }
        .bar-fill { height: 100%; display: flex; align-items: center; justify-content: flex-end; padding: 0 25px; font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: #ffffff; text-shadow: 0 0 20px rgba(0,0,0,0.5); border-radius: 12px; }
        .bar-1 { width: 100%; background: linear-gradient(90deg, rgba(0,212,255,0.4) 0%, #00d4ff 100%); }
        .bar-2 { width: 85%; background: linear-gradient(90deg, rgba(255,159,67,0.4) 0%, #ff9f43 100%); }
        .stats-bottom { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 16px; padding: 30px; margin-top: 40px; text-align: center; }
        .stats-bottom-title { font-family: 'Instrument Serif', serif; font-size: 1.4rem; color: var(--text-secondary); margin-bottom: 10px; }
        .stats-bottom-value { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; font-weight: 700; color: var(--accent-electric); }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="chine-usa-douane-tensions">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">Chine-USA : la guerre<br><span class="accent">des droits de douane</span></h2>
            <div class="chart-unit">Positions officielles des gouvernements</div>
            <div class="center-area">
                <div class="chart-bars">
                    <div class="bar-item">
                        <div class="bar-label">Cour Suprême US</div>
                        <div class="bar-container">
                            <div class="bar-fill bar-1">Invalidation</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">Demande chinoise</div>
                        <div class="bar-container">
                            <div class="bar-fill bar-2">Suppression</div>
                        </div>
                    </div>
                </div>
                <div class="stats-bottom">
                    <div class="stats-bottom-title">Impact sur les échanges</div>
                    <div class="stats-bottom-value">-15%</div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>Challenges · 2026</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Évolution du prix au m² à Paris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080c0a;
            --bg-mid: #0e1e18;
            --text-primary: #f0f4f8;
            --text-secondary: #88a898;
            --text-muted: #4a6a5a;
            --accent: #00d4ff;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 40px 50px 35px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 0 10px;
        }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 4.5rem;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .chart-title .accent { color: #00d4ff; font-style: italic; }

        .chart-subtitle {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        /* ===== VERTICAL BARS ===== */
        .bars-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 60px;
            padding: 0 80px 0;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .bar-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .bar-body {
            width: 70%;
            border-radius: 12px 12px 0 0;
        }

        .bar-label {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-top: 18px;
        }

        /* Year 2000 — muted teal */
        .bar-2000 .bar-amount { color: var(--text-secondary); }
        .bar-2000 .bar-body {
            background: linear-gradient(180deg, rgba(136, 168, 152, 0.7), rgba(100, 140, 120, 0.4));
        }

        /* Year 2012 — medium cyan */
        .bar-2012 .bar-amount { color: #4dd0e1; }
        .bar-2012 .bar-body {
            background: linear-gradient(180deg, rgba(77, 208, 225, 0.8), rgba(50, 170, 190, 0.5));
            box-shadow: 0 -4px 25px rgba(77, 208, 225, 0.2);
        }

        /* Year 2025 — bright cyan accent */
        .bar-2025 .bar-amount { color: #00d4ff; }
        .bar-2025 .bar-body {
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.9), rgba(0, 170, 210, 0.6));
            box-shadow: 0 -4px 30px rgba(0, 212, 255, 0.3);
        }

        .multiplier {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.3rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="title-area">
                <h2 class="chart-title">Évolution du prix au m²<br><span class="accent">à Paris</span></h2>
            </div>

            <div class="chart-subtitle">Prix moyen au m² — Appartements anciens</div>

            <!-- Heights: 3000/9400 = 32%, 8460/9400 = 90%, 9400/9400 = 100% → scaled to max 70% -->
            <div class="bars-area">
                <div class="bar-col bar-2000">
                    <div class="bar-amount">3 000 €</div>
                    <div class="bar-body" style="height: 22%;"></div>
                    <div class="bar-label">2000</div>
                </div>

                <div class="bar-col bar-2012">
                    <div class="bar-amount">8 460 €</div>
                    <div class="bar-body" style="height: 63%;"></div>
                    <div class="bar-label">2012</div>
                </div>

                <div class="bar-col bar-2025">
                    <div class="bar-amount">9 400 €</div>
                    <div class="bar-body" style="height: 70%;"></div>
                    <div class="bar-label">2025</div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Notaires du Grand Paris · 2025</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

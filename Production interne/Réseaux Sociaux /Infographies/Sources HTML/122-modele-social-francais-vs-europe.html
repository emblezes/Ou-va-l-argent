<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La France dépense 7 points de PIB de plus que la moyenne européenne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #081518; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-cyan: #00d4ff; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #081518 0%, #0a3540 50%, #081518 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 3.4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: var(--accent-cyan); font-style: italic; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .chart-unit { font-family: 'Instrument Serif', serif; font-size: 1.4rem; color: var(--text-secondary); font-style: italic; text-align: center; margin-bottom: 15px; }
        .bar-chart { width: 100%; max-width: 820px; }
        .bar-item { position: relative; margin-bottom: 22px; display: flex; align-items: center; gap: 20px; }
        .bar-label { font-size: 1.6rem; font-weight: 600; color: var(--text-primary); width: 140px; text-align: right; flex-shrink: 0; }
        .bar-track { flex: 1; height: 55px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 12px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 12px; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px; }
        .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; color: #fff; white-space: nowrap; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div class="infographic" data-name="modele-social-francais-vs-europe">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">La France dépense<br><span class="accent">7 points de PIB de plus</span><br>que la moyenne européenne</h2>
            <div class="center-area">
                <div class="chart-unit">Dépenses sociales publiques, en % du PIB (2024)</div>
                <div class="bar-chart">
                    <div class="bar-item">
                        <div class="bar-label" style="color: #00d4ff;">France</div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 100%; background: linear-gradient(90deg, rgba(0,212,255,0.4) 0%, #00d4ff 100%); box-shadow: 0 0 20px rgba(0,212,255,0.3);">
                                <span class="bar-value">31,7%</span>
                            </div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">Italie</div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 94%; background: linear-gradient(90deg, rgba(255,159,67,0.4) 0%, #ff9f43 100%);">
                                <span class="bar-value">29,8%</span>
                            </div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">Allemagne</div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 90%; background: linear-gradient(90deg, rgba(255,215,0,0.4) 0%, #ffd700 100%);">
                                <span class="bar-value">28,4%</span>
                            </div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label">Espagne</div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 82%; background: linear-gradient(90deg, rgba(0,255,136,0.4) 0%, #00ff88 100%);">
                                <span class="bar-value">26,1%</span>
                            </div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-label" style="color: #a855f7;">Moyenne UE</div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: 77%; background: linear-gradient(90deg, rgba(168,85,247,0.4) 0%, #a855f7 100%);">
                                <span class="bar-value">24,3%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>Eurostat · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

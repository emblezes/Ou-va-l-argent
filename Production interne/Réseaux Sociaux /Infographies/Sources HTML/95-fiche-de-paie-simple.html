<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de paie : 3 000€ brut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c; --bg-surface: #0a0e14;
            --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a;
            --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757;
            --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 255, 136, 0.06) 0%, transparent 70%); bottom: -200px; left: -100px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 44px; display: flex; flex-direction: column; justify-content: center; }

        /* Titre "Où Va l'Argent" en gros */
        .main-title {
            font-family: 'Instrument Serif', serif;
            font-size: 4.2rem;
            font-style: italic;
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.1;
        }
        .main-title .euro { color: var(--accent-electric); font-style: normal; }

        .subtitle {
            font-family: 'Syne', sans-serif;
            font-size: 1.15rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 38px;
        }
        .subtitle strong { color: var(--accent-gold); font-weight: 700; }

        /* Flow rows */
        .flow { display: flex; flex-direction: column; gap: 0; padding: 0 10px; }

        .flow-row {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 28px 36px;
            border-radius: 18px;
            position: relative;
        }

        .flow-row .label { font-family: 'Syne', sans-serif; font-size: 2.7rem; font-weight: 700; flex: 1; white-space: nowrap; }
        .flow-row .amount { font-family: 'JetBrains Mono', monospace; font-size: 3.8rem; font-weight: 700; text-align: right; white-space: nowrap; }

        .row-employer { background: rgba(255,159,67,0.08); border: 1.5px solid rgba(255,159,67,0.25); }
        .row-employer .label { color: #ffe0b0; }
        .row-employer .amount { color: var(--accent-orange); }

        .row-brut { background: rgba(0,212,255,0.08); border: 1.5px solid rgba(0,212,255,0.25); }
        .row-brut .label { color: #b0e8ff; }
        .row-brut .amount { color: var(--accent-electric); }

        .row-net { background: rgba(168,85,247,0.08); border: 1.5px solid rgba(168,85,247,0.25); }
        .row-net .label { color: #e0d0ff; }
        .row-net .amount { color: var(--accent-purple); }

        .row-final { background: rgba(0,255,136,0.10); border: 2px solid rgba(0,255,136,0.35); }
        .row-final .label { color: #b0ffd8; font-size: 2.9rem; }
        .row-final .amount { color: var(--accent-green); font-size: 4.2rem; }

        /* Simple arrow between rows */
        .arrow-down {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 36px;
        }
        .arrow-down svg { width: 36px; height: 36px; }

        /* Big website */
        .big-website {
            text-align: center;
            margin-top: 38px;
        }
        .big-website span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent-electric);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">

            <div class="main-title"><span class="euro">€</span> Où Va l'Argent ?</div>
            <div class="subtitle">Exemple : <strong>3 000 € brut / mois</strong> · Célibataire sans enfant</div>

            <div class="flow">
                <div class="flow-row row-employer">
                    <div class="label">Ton employeur paye</div>
                    <div class="amount">4 140 €</div>
                </div>

                <div class="arrow-down">
                    <svg viewBox="0 0 36 36" fill="none"><path d="M18 4 L18 28 M10 22 L18 30 L26 22" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>

                <div class="flow-row row-brut">
                    <div class="label">Salaire brut</div>
                    <div class="amount">3 000 €</div>
                </div>

                <div class="arrow-down">
                    <svg viewBox="0 0 36 36" fill="none"><path d="M18 4 L18 28 M10 22 L18 30 L26 22" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>

                <div class="flow-row row-net">
                    <div class="label">Salaire net</div>
                    <div class="amount">2 340 €</div>
                </div>

                <div class="arrow-down">
                    <svg viewBox="0 0 36 36" fill="none"><path d="M18 4 L18 28 M10 22 L18 30 L26 22" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>

                <div class="flow-row row-final">
                    <div class="label">Ce que tu reçois</div>
                    <div class="amount">2 210 €</div>
                </div>
            </div>

            <div class="big-website">
                <span>ouvalargent.com</span>
            </div>

        </div>
    </div>
</body>
</html>

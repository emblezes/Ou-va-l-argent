<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version C — Orange / Vert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060c08;
            --bg-mid: #0a1e14;
            --text-primary: #f0f4f8;
            --text-secondary: #88a898;
            --text-muted: #4a6a5a;
            --accent-1: #ff9f43;
            --accent-2: #00ff88;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 159, 67, 0.08) 0%, transparent 70%);
            bottom: -200px;
            left: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.05) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 40px 50px 35px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: var(--accent-2); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0 20px;
        }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 3.8rem;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .chart-title .accent-1 { color: var(--accent-1); font-style: italic; }
        .chart-title .accent-2 { color: var(--accent-2); font-style: italic; }

        /* ===== VERTICAL BARS ===== */
        .bars-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 60px;
            padding: 0 100px 0;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .bar-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .bar-body {
            width: 70%;
            border-radius: 12px 12px 0 0;
        }

        .bar-label {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            margin-top: 18px;
            line-height: 1.3;
        }

        .bar-social .bar-amount { color: var(--accent-1); }
        .bar-social .bar-body {
            background: linear-gradient(180deg, var(--accent-1), rgba(255, 159, 67, 0.6));
            box-shadow: 0 -4px 30px rgba(255, 159, 67, 0.2);
        }

        .bar-regalien .bar-amount { color: var(--accent-2); }
        .bar-regalien .bar-body {
            background: linear-gradient(180deg, var(--accent-2), rgba(0, 255, 136, 0.5));
            box-shadow: 0 -4px 30px rgba(0, 255, 136, 0.2);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-2); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="title-area">
                <h2 class="chart-title">L'État français dépense<br><span class="accent-1">neuf fois plus</span> pour le social<br>que pour le <span class="accent-2">régalien</span></h2>
            </div>

            <div class="bars-area">
                <div class="bar-col bar-social">
                    <div class="bar-amount">954 Md€</div>
                    <div class="bar-body" style="height: 75%;"></div>
                    <div class="bar-label">Protection sociale<br>+ Santé</div>
                </div>

                <div class="bar-col bar-regalien">
                    <div class="bar-amount">106 Md€</div>
                    <div class="bar-body" style="height: 8.3%;"></div>
                    <div class="bar-label">Défense, police,<br>justice</div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>INSEE COFOG · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

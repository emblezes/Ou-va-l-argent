<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le monde vieillit à une vitesse alarmante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0f1a;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, #1a2540 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 159, 67, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 159, 67, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 159, 67, 0.1) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 50px 55px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #ff9f43; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5.5rem;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-primary);
            line-height: 1.05;
        }

        .chart-title .accent {
            color: #ff9f43;
            font-style: italic;
        }

        /* ===== BAR CHART ===== */
        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 30px;
            padding: 0 5px;
        }

        .bars-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        .bar-up {
            width: 85%;
            border-radius: 10px 10px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 10px;
        }

        .bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            white-space: nowrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .bar-flag {
            font-size: 4rem;
            line-height: 1;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
        }

        /* Labels row — all aligned on same baseline */
        .labels-row {
            display: flex;
            gap: 10px;
            padding: 10px 0 0;
            flex-shrink: 0;
        }

        .label-col {
            flex: 1;
            text-align: center;
        }

        .bar-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .bar-name.highlight { color: #ff4757; font-weight: 700; }
        .bar-name.muted { color: rgba(255, 215, 0, 0.85); font-style: italic; }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: 15px;
            border-top: 1px solid var(--glass-border);
        }

        .source {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .source span {
            color: var(--text-secondary);
        }

        .website {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: #ff9f43;
        }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <h2 class="chart-title">Part des plus de <span class="accent">65 ans</span><br>dans la population en 2070</h2>

            <div class="chart-area">
                <div class="bars-wrapper">
                    <!-- UNE SEULE couleur (gris-bleu neutre) sauf France (rouge + glow) et Monde (or pointillé) -->

                    <!-- Corée du Sud: 46% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 92%; background: linear-gradient(180deg, #5d7494, #2d3f5c);">
                            <div class="bar-value" style="color: #f0f4f8;">46%</div>
                            <div class="bar-flag">🇰🇷</div>
                        </div>
                    </div>

                    <!-- Chine: 42% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 84%; background: linear-gradient(180deg, #5d7494, #2d3f5c);">
                            <div class="bar-value" style="color: #f0f4f8;">42%</div>
                            <div class="bar-flag">🇨🇳</div>
                        </div>
                    </div>

                    <!-- Japon: 37% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 74%; background: linear-gradient(180deg, #5d7494, #2d3f5c);">
                            <div class="bar-value" style="color: #f0f4f8;">37%</div>
                            <div class="bar-flag">🇯🇵</div>
                        </div>
                    </div>

                    <!-- Italie: 37% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 74%; background: linear-gradient(180deg, #5d7494, #2d3f5c);">
                            <div class="bar-value" style="color: #f0f4f8;">37%</div>
                            <div class="bar-flag">🇮🇹</div>
                        </div>
                    </div>

                    <!-- Espagne: 36% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 72%; background: linear-gradient(180deg, #5d7494, #2d3f5c);">
                            <div class="bar-value" style="color: #f0f4f8;">36%</div>
                            <div class="bar-flag">🇪🇸</div>
                        </div>
                    </div>

                    <!-- Allemagne: 32% -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 64%; background: linear-gradient(180deg, #5d7494, #2d3f5c);">
                            <div class="bar-value" style="color: #f0f4f8;">32%</div>
                            <div class="bar-flag">🇩🇪</div>
                        </div>
                    </div>

                    <!-- France: 29% — HIGHLIGHT barre rouge + glow, valeur en blanc -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 58%; background: linear-gradient(180deg, #ff4757, #8a1828); box-shadow: 0 -4px 30px rgba(255, 71, 87, 0.5);">
                            <div class="bar-value" style="color: #f0f4f8;">29%</div>
                            <div class="bar-flag">🇫🇷</div>
                        </div>
                    </div>

                    <!-- Monde: 21% — gris neutre comme les autres -->
                    <div class="bar-col">
                        <div class="bar-up" style="height: 42%; background: linear-gradient(180deg, #5d7494, #2d3f5c);">
                            <div class="bar-value" style="color: #f0f4f8;">21%</div>
                            <div class="bar-flag">🌍</div>
                        </div>
                    </div>
                </div>

                <!-- Country names — all aligned on same row below bars -->
                <div class="labels-row">
                    <div class="label-col"><div class="bar-name">Corée<br>du Sud</div></div>
                    <div class="label-col"><div class="bar-name">Chine</div></div>
                    <div class="label-col"><div class="bar-name">Japon</div></div>
                    <div class="label-col"><div class="bar-name">Italie</div></div>
                    <div class="label-col"><div class="bar-name">Espagne</div></div>
                    <div class="label-col"><div class="bar-name">Allemagne</div></div>
                    <div class="label-col"><div class="bar-name highlight">France</div></div>
                    <div class="label-col"><div class="bar-name">Monde</div></div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Sources : <span>ONU, World Population Prospects · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

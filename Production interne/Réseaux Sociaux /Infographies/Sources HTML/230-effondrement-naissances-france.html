<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Plus de décès que de naissances en France</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a1220;
            --bg-mid:  #142b48;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.10) 0%, transparent 70%); top: -200px; right: -200px; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 255, 136, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }

        .content { position: relative; z-index: 1; height: 100%; padding: 40px 60px 28px; display: flex; flex-direction: column; }

        .header { display: flex; align-items: center; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.6rem; color: var(--accent-electric); line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4.8rem; text-align: center; color: var(--text-primary); line-height: 1.05; margin-top: 22px; letter-spacing: -1.6px; }
        .chart-title .accent { color: var(--accent-electric); font-style: italic; }
        .subtitle { text-align: center; font-size: 1.15rem; color: var(--text-secondary); margin-top: 14px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }

        .chart-area { flex: 1; display: flex; align-items: stretch; justify-content: center; padding: 18px 0 0; min-height: 0; overflow: hidden; }
        .chart-wrap { width: 100%; max-width: 960px; min-height: 0; }
        .chart-wrap svg { width: 100%; height: 100%; display: block; }

        .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;  fill: var(--text-primary); }
        .tick       { font-family: 'JetBrains Mono', monospace; font-size: 1.7rem;  fill: var(--text-primary); font-weight: 600; }
        .bar-value  { font-family: 'JetBrains Mono', monospace; font-size: 1.85rem; font-weight: 700; }
        .bar-value.births { fill: var(--accent-green); }
        .bar-value.deaths { fill: var(--accent-red); }

        .legend { display: flex; justify-content: center; gap: 40px; padding: 12px 0 4px; }
        .legend-item { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
        .legend-dot { width: 22px; height: 22px; border-radius: 5px; }
        .legend-dot.births { background: linear-gradient(180deg, #00ff88 0%, #00b85f 100%); }
        .legend-dot.deaths { background: linear-gradient(180deg, #ff4757 0%, #c0263a 100%); }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: 6px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.95rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">Il y a désormais plus de <span class="accent">décès</span><br>que de <span class="accent">naissances</span> en France</h2>
            <div class="subtitle">Bilan démographique France · Milliers</div>

            <div class="chart-area">
                <div class="chart-wrap">
                    <svg viewBox="0 0 960 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gradBirth" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#00ff88"/>
                                <stop offset="100%" stop-color="#00b85f"/>
                            </linearGradient>
                            <linearGradient id="gradDeath" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#ff4757"/>
                                <stop offset="100%" stop-color="#c0263a"/>
                            </linearGradient>
                            <filter id="redGlow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                        </defs>

                        <!-- Axe Y : 500-850, zone y[50..640], baseline 640 -->
                        <g>
                            <line x1="100" y1="50" x2="100" y2="640" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
                            <text class="axis-label" x="88" y="135" text-anchor="end">800</text>
                            <text class="axis-label" x="88" y="305" text-anchor="end">700</text>
                            <text class="axis-label" x="88" y="475" text-anchor="end">600</text>
                            <text class="axis-label" x="88" y="645" text-anchor="end">500</text>
                            <line x1="100" y1="130" x2="900" y2="130" stroke="rgba(255,255,255,0.05)"/>
                            <line x1="100" y1="300" x2="900" y2="300" stroke="rgba(255,255,255,0.05)"/>
                            <line x1="100" y1="470" x2="900" y2="470" stroke="rgba(255,255,255,0.05)"/>
                            <line x1="100" y1="640" x2="900" y2="640" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
                        </g>

                        <!-- 5 années pour aérer le graphique. Bar=46, intra=10, inter=70. Groupe=102, centre-à-centre=172 -->

                        <!-- Chiffres verts (births) décalés systématiquement +14px par rapport aux rouges (deaths) pour éviter collisions horizontales -->

                        <!-- Chiffres verts à 12px au-dessus de leur barre (au lieu de 2px), sauf 2025 où le 645 reste sous le 651 -->

                        <!-- 2010 — N:833 / D:540 -->
                        <rect x="110" y="78"  width="46" height="562" fill="url(#gradBirth)" rx="5"/>
                        <text class="bar-value births" x="133" y="66" text-anchor="middle">833</text>
                        <rect x="166" y="573" width="46" height="67"  fill="url(#gradDeath)" rx="5"/>
                        <text class="bar-value deaths" x="189" y="557" text-anchor="middle">540</text>
                        <text class="tick" x="161" y="688" text-anchor="middle">2010</text>

                        <!-- 2015 — N:799 / D:594 -->
                        <rect x="282" y="136" width="46" height="504" fill="url(#gradBirth)" rx="5"/>
                        <text class="bar-value births" x="305" y="124" text-anchor="middle">799</text>
                        <rect x="338" y="482" width="46" height="158" fill="url(#gradDeath)" rx="5"/>
                        <text class="bar-value deaths" x="361" y="466" text-anchor="middle">594</text>
                        <text class="tick" x="333" y="688" text-anchor="middle">2015</text>

                        <!-- 2020 — N:735 / D:669 -->
                        <rect x="454" y="244" width="46" height="396" fill="url(#gradBirth)" rx="5"/>
                        <text class="bar-value births" x="477" y="232" text-anchor="middle">735</text>
                        <rect x="510" y="355" width="46" height="285" fill="url(#gradDeath)" rx="5"/>
                        <text class="bar-value deaths" x="533" y="339" text-anchor="middle">669</text>
                        <text class="tick" x="505" y="688" text-anchor="middle">2020</text>

                        <!-- 2024 — N:663 / D:642 -->
                        <rect x="626" y="365" width="46" height="275" fill="url(#gradBirth)" rx="5"/>
                        <text class="bar-value births" x="649" y="353" text-anchor="middle">663</text>
                        <rect x="682" y="401" width="46" height="239" fill="url(#gradDeath)" rx="5"/>
                        <text class="bar-value deaths" x="705" y="385" text-anchor="middle">642</text>
                        <text class="tick" x="677" y="688" text-anchor="middle">2024</text>

                        <!-- 2025 — INVERSION : N:645 / D:651. Le 645 reste décalé en dessous (y=384, juste -12 du top barre) -->
                        <rect x="798" y="396" width="46" height="244" fill="url(#gradBirth)" rx="5"/>
                        <text class="bar-value births" x="821" y="384" text-anchor="middle">645</text>
                        <rect x="854" y="386" width="46" height="254" fill="url(#gradDeath)" rx="5" filter="url(#redGlow)"/>
                        <text class="bar-value deaths" x="877" y="370" text-anchor="middle" style="font-size:2rem;">651</text>
                        <text class="tick" x="849" y="688" text-anchor="middle" font-weight="700" fill="#ff4757">2025</text>
                    </svg>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="legend-dot births"></div>Naissances</div>
                <div class="legend-item"><div class="legend-dot deaths"></div>Décès</div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>INSEE · Bilan démographique 2025 · janvier 2026</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTF – 116ter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#060c12;--bg-mid:#0a1e38;--accent:#00d4ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Syne',sans-serif;background:#1a1a2e;display:flex;justify-content:center}
.infographic{width:1080px;height:1080px;position:relative;overflow:hidden}
.bg-base{position:absolute;inset:0;background:linear-gradient(145deg,var(--bg-deep) 0%,var(--bg-mid) 50%,var(--bg-deep) 100%)}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:40px 40px}
.math{position:absolute;font-family:'JetBrains Mono',monospace;color:rgba(0,212,255,0.06);font-size:4rem;font-weight:700;pointer-events:none}
.m1{top:80px;right:60px;font-size:5rem;transform:rotate(12deg)}
.m2{top:200px;left:40px;font-size:3.5rem;transform:rotate(-8deg)}
.m3{bottom:180px;right:100px;font-size:4.5rem;transform:rotate(5deg)}
.m4{bottom:100px;left:80px;font-size:3rem;transform:rotate(-15deg)}

.content{position:relative;z-index:1;height:100%;padding:40px 60px 30px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{font-family:'Instrument Serif',serif;font-size:3.5rem;color:var(--accent);line-height:1}
.logo-text{font-family:'Instrument Serif',serif;font-size:1.7rem;font-style:italic;color:#fff;line-height:1}

.message{display:flex;flex-direction:column;align-items:center;gap:40px;max-width:900px}
.headline{font-family:'Instrument Serif',serif;font-size:4.5rem;font-style:italic;color:#fff;text-align:center;line-height:1.1}
.headline span{color:var(--accent)}
.detail{font-family:'Syne',sans-serif;font-size:2rem;font-weight:400;color:rgba(255,255,255,0.6);text-align:center;line-height:1.5}
.flags{display:flex;align-items:center;gap:30px;font-size:5rem}

.footer{width:100%;text-align:center}
.website{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;color:#fff}
</style></head><body>
<div class="infographic"><div class="bg-base"></div><div class="bg-grid"></div>
<div class="math m1">∑</div>
<div class="math m2">π</div>
<div class="math m3">∫</div>
<div class="math m4">√</div>
<div class="content">
<div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>

<div class="message">
  <div class="flags">🇰🇷</div>
  <div class="headline">De <span>meilleures performances</span><br>avec des coûts <span>moins élevés</span></div>
  <div class="detail">Le problème n'est pas le budget.<br>C'est la façon dont il est dépensé.</div>
</div>

<div class="footer"><div class="website">ouvalargent.com</div></div>
</div></div></body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Proman grimpe au top 10 mondial de l'intérim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #081510; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent: #00d488; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #081510 0%, #0d3528 50%, #081510 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,136,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,136,0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0,212,136,0.1) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,212,136,0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: var(--accent); font-style: italic; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .chart-unit { font-family: 'Instrument Serif', serif; font-size: 1.5rem; font-style: italic; color: var(--text-secondary); text-align: center; margin-bottom: 40px; }
        .bar-chart { width: 100%; max-width: 800px; }
        .bar-item { position: relative; margin-bottom: 25px; height: 80px; display: flex; align-items: center; }
        .bar-bg { position: absolute; left: 0; top: 0; height: 100%; border-radius: 12px; }
        .bar-bg-1 { width: 100%; background: linear-gradient(90deg, rgba(0,212,255,0.4) 0%, #00d4ff 100%); }
        .bar-bg-2 { width: 90%; background: linear-gradient(90deg, rgba(255,159,67,0.4) 0%, #ff9f43 100%); }
        .bar-bg-3 { width: 85%; background: linear-gradient(90deg, rgba(255,215,0,0.4) 0%, #ffd700 100%); }
        .bar-bg-4 { width: 45%; background: linear-gradient(90deg, rgba(0,255,136,0.4) 0%, #00ff88 100%); }
        .bar-content { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 25px; }
        .bar-label { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 600; color: var(--text-primary); }
        .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="infographic" data-name="proman-top-10-interim-mondial">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">Proman grimpe au<br><span class="accent">top 10 mondial</span> de l'intérim</h2>
            <div class="center-area">
                <div class="chart-unit">Classement mondial des leaders de l'intérim</div>
                <div class="bar-chart">
                    <div class="bar-item">
                        <div class="bar-bg bar-bg-1"></div>
                        <div class="bar-content">
                            <div class="bar-label">Adecco (Suisse)</div>
                            <div class="bar-value">1er</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-bg bar-bg-2"></div>
                        <div class="bar-content">
                            <div class="bar-label">Randstad (Pays-Bas)</div>
                            <div class="bar-value">2e</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-bg bar-bg-3"></div>
                        <div class="bar-content">
                            <div class="bar-label">ManpowerGroup (USA)</div>
                            <div class="bar-value">3e</div>
                        </div>
                    </div>
                    <div class="bar-item">
                        <div class="bar-bg bar-bg-4"></div>
                        <div class="bar-content">
                            <div class="bar-label">Proman (France)</div>
                            <div class="bar-value">10e</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>La Tribune · 2026</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #0a0a0a; display: flex; justify-content: center; padding: 30px; }

        .infographic {
            width: 1080px; height: 1080px; position: relative; overflow: hidden;
        }
        .bg { position: absolute; inset: 0; background: linear-gradient(145deg, #06080c 0%, #0a1628 50%, #06080c 100%); }
        .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,71,87,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,71,87,0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .glow { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255,71,87,0.14) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }

        .content { position: relative; z-index: 1; height: 100%; padding: 45px 55px 40px; display: flex; flex-direction: column; }

        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo .euro { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo .text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #fff; line-height: 1; }

        .slide-title {
            font-family: 'Instrument Serif', serif;
            font-size: 3.2rem;
            text-align: center;
            color: #f0f4f8;
            line-height: 1.15;
            margin-top: 30px;
        }
        .slide-subtitle {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            text-align: center;
            color: #8899a8;
            margin-top: 6px;
            font-weight: 500;
        }

        .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .chart-area {
            display: flex; align-items: flex-end; gap: 30px; justify-content: center; width: 100%;
            padding: 0 20px 10px;
        }
        .bar-group {
            display: flex; flex-direction: column; align-items: center; gap: 0;
        }
        .bar-label {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 10px;
        }
        .bar-label .pct {
            font-family: 'JetBrains Mono', monospace; font-weight: 700; line-height: 1;
        }
        .bar {
            width: 200px; border-radius: 12px 12px 0 0;
        }
        .bar-year {
            font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; color: #8899a8;
            margin-top: 12px;
        }

        /* Bar colors & heights */
        .b1 { height: 120px; background: linear-gradient(180deg, #4a5a6a, #3a4a5a); }
        .b1-label .pct { font-size: 2.6rem; color: #8899a8; }

        .b2 { height: 200px; background: linear-gradient(180deg, #ffd700, #ccac00); }
        .b2-label .pct { font-size: 2.8rem; color: #ffd700; }

        .b3 { height: 310px; background: linear-gradient(180deg, #ff6b6b, #ff4757); }
        .b3-label .pct { font-size: 3rem; color: #ff4757; }

        .b4 { height: 370px; background: linear-gradient(180deg, #ff1a2e, #cc0018); }
        .b4-label .pct { font-size: 3.2rem; color: #ff1a2e; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
        .footer .src { font-size: 1rem; color: #4a5a6a; }
        .footer .src span { color: #8899a8; }
        .footer .url { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg"></div>
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="euro">€</span><span class="text">Où Va l'Argent</span></div>
            </div>
            <div class="slide-title">L'explosion de la dette<br>publique française</div>
            <div class="slide-subtitle">(pourcentage du PIB)</div>
            <div class="center">
                <div class="chart-area">
                    <div class="bar-group">
                        <div class="bar-label b1-label">
                            <span class="pct">64 %</span>
                        </div>
                        <div class="bar b1"></div>
                        <span class="bar-year">2003</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar-label b2-label">
                            <span class="pct">95 %</span>
                        </div>
                        <div class="bar b2"></div>
                        <span class="bar-year">2014</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar-label b3-label">
                            <span class="pct">112 %</span>
                        </div>
                        <div class="bar b3"></div>
                        <span class="bar-year">2023</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar-label b4-label">
                            <span class="pct">117 %</span>
                        </div>
                        <div class="bar b4"></div>
                        <span class="bar-year">2025</span>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="src">Sources : <span>INSEE · Eurostat · T3 2025</span></div>
                <div class="url">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

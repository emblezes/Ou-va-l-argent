<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Success story : les PER cartonnent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #18120a; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757; --accent-green: #00ff88; --accent-orange: #ff9f43; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #18120a 0%, #3d2a0a 50%, #18120a 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 215, 0, 0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: #ffd700; font-style: italic; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }
        .donut-container { position: relative; width: 400px; height: 400px; }
        .donut-chart { width: 100%; height: 100%; transform: rotate(-90deg); }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .donut-main-value { font-family: 'JetBrains Mono', monospace; font-size: 5rem; font-weight: 700; color: #ffd700; line-height: 1; text-shadow: 0 0 60px rgba(255, 215, 0, 0.4); }
        .donut-main-label { font-family: 'Instrument Serif', serif; font-size: 2rem; color: var(--text-primary); font-style: italic; margin-top: 8px; }
        .legend { display: flex; flex-direction: column; gap: 20px; }
        .legend-item { display: flex; align-items: center; gap: 15px; font-size: 1.6rem; }
        .legend-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
        .legend-label { color: var(--text-primary); font-weight: 600; }
        .legend-value { color: #ffd700; font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-left: auto; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="success-story-per-epargne-retraite">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent</span></div>
            </div>
            <h2 class="chart-title">Success story :<br><span class="accent">les PER cartonnent</span></h2>
            <div class="center-area">
                <div class="donut-container">
                    <svg class="donut-chart" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="80" fill="none" stroke="#ddd" stroke-width="30" stroke-dasharray="115.04 384.96" stroke-dashoffset="0"></circle>
                        <circle cx="100" cy="100" r="80" fill="none" stroke="#ffd700" stroke-width="30" stroke-dasharray="384.96 115.04" stroke-dashoffset="0" style="filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));"></circle>
                    </svg>
                    <div class="donut-center">
                        <div class="donut-main-value">77%</div>
                        <div class="donut-main-label">des nouveaux contrats</div>
                    </div>
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #ffd700;"></div>
                        <span class="legend-label">PER (Plan Épargne Retraite)</span>
                        <span class="legend-value">77%</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #ddd;"></div>
                        <span class="legend-label">Anciens produits d'épargne retraite</span>
                        <span class="legend-value">23%</span>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>DREES · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

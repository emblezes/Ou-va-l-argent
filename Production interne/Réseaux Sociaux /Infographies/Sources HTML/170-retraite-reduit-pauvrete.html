<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Le passage à la retraite réduit le taux de pauvreté</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a;
            --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757;
            --accent-green: #00ff88; --accent-orange: #ff9f43; --accent-purple: #a855f7;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%); top: -100px; left: -200px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0, 255, 136, 0.06) 0%, transparent 70%); bottom: -200px; right: -100px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 46px 50px 40px; display: flex; flex-direction: column; }

        .header { display: flex; justify-content: flex-start; align-items: flex-start; margin-bottom: 14px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 3.5rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-style: italic; color: #ffffff; line-height: 1; }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 5rem;
            color: var(--text-primary);
            line-height: 1.1;
            text-align: center;
            margin-bottom: 22px;
        }
        .chart-title .accent { color: var(--accent-electric); font-style: italic; }

        .sankey-area { flex: 1; display: flex; flex-direction: column; }

        .col-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 10px;
        }
        .col-label {
            font-family: 'Syne', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }

        .sankey-svg-wrapper { flex: 1; }
        .sankey-svg-wrapper svg { width: 100%; height: 100%; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="167-retraite-reduit-pauvrete">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>

            <h2 class="chart-title">Le passage à la retraite<br><span class="accent">réduit</span> le taux de pauvreté</h2>

            <div class="sankey-area">
                <div class="col-labels">
                    <span class="col-label">Avant la retraite</span>
                    <span class="col-label">Après la retraite</span>
                </div>
                <div class="sankey-svg-wrapper">
                    <svg id="sankey-svg"></svg>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>Drees</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const cats = [
            { name: 'Aisé',        left: 17, right: 12, color: '#a855f7' },
            { name: 'Plutôt aisé', left: 28, right: 27, color: '#00d4ff' },
            { name: 'Médian',      left: 23, right: 29, color: '#ffd700' },
            { name: 'Modeste',     left: 20, right: 24, color: '#ff9f43' },
            { name: 'Pauvre',      left: 12, right: 8,  color: '#ff4757' }
        ];

        // Flows: [fromIdx, toIdx, absoluteValue]
        const flows = [
            [0, 0, 9.35],  [0, 1, 6.12],  [0, 2, 1.53],
            [1, 1, 14.84], [1, 2, 8.96],   [1, 0, 4.2],
            [2, 1, 4.37],  [2, 2, 11.5],   [2, 3, 5.98],  [2, 4, 1.15],
            [3, 2, 5.8],   [3, 3, 10.0],   [3, 4, 2.6],   [3, 1, 1.6],
            [4, 3, 5.4],   [4, 4, 4.44],   [4, 2, 1.44],  [4, 1, 0.72],
        ];

        const svg = document.getElementById('sankey-svg');
        const W = 980, H = 630;
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

        const barW = 140, gap = 9;
        const leftX = 0, rightX = W - barW;

        function positions(values) {
            const total = values.reduce((a, b) => a + b, 0);
            const totalGap = (values.length - 1) * gap;
            const availH = H - totalGap;
            let y = 0;
            return values.map(v => {
                const h = (v / total) * availH;
                const pos = { y, h };
                y += h + gap;
                return pos;
            });
        }

        const lPos = positions(cats.map(c => c.left));
        const rPos = positions(cats.map(c => c.right));

        // Right-side actual totals from flows
        const rTotals = [0, 0, 0, 0, 0];
        flows.forEach(f => { rTotals[f[1]] += f[2]; });

        const lOff = lPos.map(() => 0);
        const rOff = rPos.map(() => 0);

        // Sort: draw diagonal (stay) flows last so they appear on top
        const sorted = [...flows].sort((a, b) => (a[0] === a[1] ? 1 : 0) - (b[0] === b[1] ? 1 : 0));

        // Draw flows (no percentage labels)
        sorted.forEach(([from, to, val]) => {
            if (val < 0.3) return;
            const lBarH = lPos[from].h;
            const rBarH = rPos[to].h;
            const flowLH = (val / cats[from].left) * lBarH;
            const flowRH = (val / rTotals[to]) * rBarH;
            const y1 = lPos[from].y + lOff[from];
            const y2 = rPos[to].y + rOff[to];
            lOff[from] += flowLH;
            rOff[to] += flowRH;

            const x1 = leftX + barW, x2 = rightX;
            const mx = (x1 + x2) / 2;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d',
                `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2} L ${x2} ${y2 + flowRH} C ${mx} ${y2 + flowRH}, ${mx} ${y1 + flowLH}, ${x1} ${y1 + flowLH} Z`
            );
            const isDiag = from === to;
            path.setAttribute('fill', cats[from].color);
            path.setAttribute('opacity', isDiag ? '0.35' : '0.18');
            svg.appendChild(path);
        });

        // Draw bars + labels (percentages in WHITE)
        cats.forEach((cat, i) => {
            addBar(leftX, lPos[i].y, barW, lPos[i].h, cat.color);
            addLabel(leftX + barW / 2, lPos[i].y, lPos[i].h, cat.name, cat.left);

            addBar(rightX, rPos[i].y, barW, rPos[i].h, cat.color);
            addLabel(rightX + barW / 2, rPos[i].y, rPos[i].h, cat.name, cat.right);
        });

        function addBar(x, y, w, h, color) {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', x); rect.setAttribute('y', y);
            rect.setAttribute('width', w); rect.setAttribute('height', h);
            rect.setAttribute('rx', 10); rect.setAttribute('fill', color);
            rect.setAttribute('opacity', '0.88');
            svg.appendChild(rect);
        }

        function addLabel(cx, y, h, name, pct) {
            const midY = y + h / 2;
            const small = h < 65;

            const nameEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            nameEl.setAttribute('x', cx); nameEl.setAttribute('y', midY - (small ? 4 : 8));
            nameEl.setAttribute('text-anchor', 'middle');
            nameEl.setAttribute('font-family', 'Syne, sans-serif');
            nameEl.setAttribute('font-size', small ? '15' : '18');
            nameEl.setAttribute('font-weight', '700');
            nameEl.setAttribute('fill', '#ffffff');
            nameEl.textContent = name;
            svg.appendChild(nameEl);

            const pctEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            pctEl.setAttribute('x', cx); pctEl.setAttribute('y', midY + (small ? 16 : 20));
            pctEl.setAttribute('text-anchor', 'middle');
            pctEl.setAttribute('font-family', 'JetBrains Mono, monospace');
            pctEl.setAttribute('font-size', small ? '17' : '22');
            pctEl.setAttribute('font-weight', '700');
            pctEl.setAttribute('fill', '#ffffff');
            pctEl.textContent = `(${pct} %)`;
            svg.appendChild(pctEl);
        }

    })();
    </script>
</body>
</html>

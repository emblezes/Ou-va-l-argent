<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OUIGO : +75% en 7 ans
Le low cost n'en est plus un</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #06080c; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent-electric: #00d4ff; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 71, 87, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 71, 87, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255, 71, 87, 0.14) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, var(--accent-electric) 0%, #0099cc 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.4rem; color: var(--bg-deep); }
        .logo-text { font-weight: 700; font-size: 1.3rem; color: var(--text-primary); }
        .tag { padding: 12px 24px; background: #ff475726; border: 1px solid #ff47574d; border-radius: 50px; font-size: 1rem; font-weight: 600; color: #ff4757; text-transform: uppercase; letter-spacing: 0.1em; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 3.8rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 15px; }
        .chart-title .accent { color: var(--accent-electric); font-style: italic; }
        .chart-title .accent-red { color: #ff4757; font-style: italic; }
        .chart-title .accent-gold { color: #ffd700; font-style: italic; }
        
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 25px; }
        .arrow-compare { display: flex; align-items: center; gap: 40px; }
        .time-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .time-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; line-height: 1; }
        .time-label { font-size: 1.2rem; color: var(--text-secondary); }
        .arrow { font-size: 5rem; color: #ff4757; }
        .sub-stat { display: flex; align-items: center; gap: 15px; background: #ff47571a; border: 1px solid #ff475733; border-radius: 16px; padding: 18px 35px; }
        .sub-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 2.8rem; font-weight: 700; color: #ff4757; }
        .sub-stat-label { font-size: 1.3rem; color: var(--text-secondary); line-height: 1.3; }
  
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic" data-name="69-ouigo-prix-explosion">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><div class="logo-icon">€</div><span class="logo-text">Où Va l'Argent</span></div>
                <div class="tag">Transport</div>
            </div>
            <h2 class="chart-title">OUIGO : <span class='accent-red'>+75% en 7 ans</span><br>Le low cost n'en est plus un</h2>
            
        <div class="center-area">
            <div class="arrow-compare">
                <div class="time-box">
                    <div class="time-val" style="font-size: 7rem; color: #00ff88;">+75%</div>
                    <div class="time-label">Avant</div>
                </div>
                <div class="arrow">→</div>
                <div class="time-box">
                    <div class="time-val" style="font-size: 9rem; color: #ff4757;"></div>
                    <div class="time-label">Aujourd'hui</div>
                </div>
            </div>
            <div class="sub-stat"><div class="sub-stat-val">L'écart</div><div class="sub-stat-label">avec les TGV Inoui se réduit drastiquement</div></div>
        </div>
            <div class="footer">
                <div class="source">Sources : <span>20 Minutes · 2026</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Répartition de 1 000 € de dépenses publiques</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c;
            --bg-mid: #0a1628;
            --text-primary: #f0f4f8;
            --text-secondary: #8899a8;
            --text-muted: #4a5a6a;
            --accent-electric: #00d4ff;
            --accent-gold: #ffd700;
            --accent-red: #ff4757;
            --accent-green: #00ff88;
            --accent-orange: #ff9f43;
            --accent-violet: #a855f7;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Syne', sans-serif;
            background: #1a1a2e;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .infographic {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .bg-base {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.06) 0%, transparent 70%);
            bottom: -250px;
            right: -150px;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 40px 50px 35px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }

        .title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0 18px;
        }

        .chart-title {
            font-family: 'Instrument Serif', serif;
            font-size: 3.8rem;
            text-align: center;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .chart-title .accent { color: var(--accent-gold); font-style: italic; }

        /* ===== TREEMAP ===== */
        .treemap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 5px;
        }

        .treemap-row {
            display: flex;
            gap: 4px;
        }

        .treemap-block {
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .block-label {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .block-amount {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Large block */
        .block-lg .block-label { font-size: 2.2rem; }
        .block-lg .block-amount { font-size: 3rem; margin-top: 8px; }

        /* Medium block */
        .block-md .block-label { font-size: 1.5rem; }
        .block-md .block-amount { font-size: 2rem; margin-top: 5px; }

        /* Small block */
        .block-sm .block-label { font-size: 1.1rem; }
        .block-sm .block-amount { font-size: 1.4rem; margin-top: 3px; }

        /* Extra small block */
        .block-xs .block-label { font-size: 0.95rem; }
        .block-xs .block-amount { font-size: 1.15rem; margin-top: 2px; }

        /* Colors */
        .c-social { background: linear-gradient(135deg, rgba(255, 71, 87, 0.85), rgba(255, 71, 87, 0.65)); }
        .c-admin { background: linear-gradient(135deg, rgba(168, 85, 247, 0.85), rgba(168, 85, 247, 0.65)); }
        .c-eco { background: linear-gradient(135deg, rgba(255, 159, 67, 0.85), rgba(255, 159, 67, 0.65)); }
        .c-educ { background: linear-gradient(135deg, rgba(0, 212, 255, 0.85), rgba(0, 212, 255, 0.65)); }
        .c-defense { background: linear-gradient(135deg, rgba(100, 130, 160, 0.85), rgba(80, 110, 140, 0.65)); }
        .c-police { background: linear-gradient(135deg, rgba(0, 255, 136, 0.7), rgba(0, 200, 100, 0.5)); }
        .c-culture { background: linear-gradient(135deg, rgba(255, 215, 0, 0.8), rgba(255, 180, 0, 0.6)); }
        .c-culture .block-label, .c-culture .block-amount { color: rgba(0, 0, 0, 0.75); }
        .c-logement { background: linear-gradient(135deg, rgba(180, 130, 255, 0.75), rgba(150, 100, 220, 0.55)); }
        .c-enviro { background: linear-gradient(135deg, rgba(0, 180, 120, 0.75), rgba(0, 140, 90, 0.55)); }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>

        <div class="content">
            <div class="header">
                <div class="logo">
                    <span class="logo-icon">€</span>
                    <span class="logo-text">Où Va l'Argent ?</span>
                </div>
            </div>

            <div class="title-area">
                <h2 class="chart-title">Répartition de <span class="accent">1 000 €</span><br>de dépenses publiques</h2>
            </div>

            <!-- Total = 1000€. Proportions: Social+Santé 570, Admin 108, Éco 99, Éduc 89, Défense 32, Police 31, Culture 26, Logement 25, Enviro 18 -->
            <!-- Row 1: Social+Santé (57%) -->
            <div class="treemap">
                <div class="treemap-row" style="flex: 570;">
                    <div class="treemap-block block-lg c-social" style="flex: 1;">
                        <div class="block-label">Protection sociale + Santé</div>
                        <div class="block-amount">570 €</div>
                    </div>
                </div>

                <!-- Row 2: Admin (108) + Éco (99) + Éduc (89) = 296 -->
                <div class="treemap-row" style="flex: 296;">
                    <div class="treemap-block block-md c-admin" style="flex: 108;">
                        <div class="block-label">Services généraux</div>
                        <div class="block-amount">108 €</div>
                    </div>
                    <div class="treemap-block block-md c-eco" style="flex: 99;">
                        <div class="block-label">Affaires éco.</div>
                        <div class="block-amount">99 €</div>
                    </div>
                    <div class="treemap-block block-md c-educ" style="flex: 89;">
                        <div class="block-label">Enseignement</div>
                        <div class="block-amount">89 €</div>
                    </div>
                </div>

                <!-- Row 3: Défense (32) + Police (31) + Culture (26) + Logement (25) + Enviro (18) = 132 -->
                <div class="treemap-row" style="flex: 132;">
                    <div class="treemap-block block-sm c-defense" style="flex: 32;">
                        <div class="block-label">Défense</div>
                        <div class="block-amount">32 €</div>
                    </div>
                    <div class="treemap-block block-sm c-police" style="flex: 31;">
                        <div class="block-label">Police &amp; Justice</div>
                        <div class="block-amount">31 €</div>
                    </div>
                    <div class="treemap-block block-xs c-culture" style="flex: 26;">
                        <div class="block-label">Culture</div>
                        <div class="block-amount">26 €</div>
                    </div>
                    <div class="treemap-block block-xs c-logement" style="flex: 25;">
                        <div class="block-label">Logement</div>
                        <div class="block-amount">25 €</div>
                    </div>
                    <div class="treemap-block block-xs c-enviro" style="flex: 18;">
                        <div class="block-label">Enviro.</div>
                        <div class="block-amount">18 €</div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div class="source">Source : <span>INSEE COFOG · 2024</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

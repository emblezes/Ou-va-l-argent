<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mix énergétique français : les objectifs 2030</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #081510; --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a; --accent: #00d488; --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, #081510 0%, #0d3528 50%, #081510 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,136,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,136,0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(0,212,136,0.1) 0%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,212,136,0.06) 0%, transparent 70%); bottom: -150px; left: -150px; }
        .content { position: relative; z-index: 1; height: 100%; padding: 50px 55px 40px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-family: 'Instrument Serif', serif; font-size: 4rem; color: #00d4ff; line-height: 1; }
        .logo-text { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-style: italic; color: #ffffff; line-height: 1; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; color: var(--text-primary); line-height: 1.1; margin-top: 20px; }
        .chart-title .accent { color: var(--accent); font-style: italic; }
        .chart-unit { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.5rem; color: var(--text-secondary); text-align: center; margin-top: 15px; }
        .center-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }
        .donut-container { display: flex; align-items: center; gap: 80px; }
        .donut-chart { position: relative; }
        .donut-svg { transform: rotate(-90deg); }
        .legend { display: flex; flex-direction: column; gap: 25px; }
        .legend-item { display: flex; align-items: center; gap: 15px; }
        .legend-color { width: 24px; height: 24px; border-radius: 50%; }
        .legend-label { font-size: 1.8rem; color: var(--text-primary); font-weight: 500; }
        .legend-value { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--accent); margin-left: auto; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--glass-border); }
        .source { font-size: 1rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="infographic" data-name="mix-energetique-france-2030">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo"><span class="logo-icon">€</span><span class="logo-text">Où Va l'Argent ?</span></div>
            </div>
            <h2 class="chart-title">Mix énergétique français :<br><span class="accent">les objectifs 2030</span></h2>
            <div class="chart-unit">Répartition de la production électrique française</div>
            <div class="center-area">
                <div class="donut-container">
                    <div class="donut-chart">
                        <svg class="donut-svg" width="350" height="350" viewBox="0 0 350 350">
                            <circle cx="175" cy="175" r="140" fill="none" stroke="#0984e3" stroke-width="60" stroke-dasharray="439.82 879.64" stroke-dashoffset="0"></circle>
                            <circle cx="175" cy="175" r="140" fill="none" stroke="#00b894" stroke-width="60" stroke-dasharray="307.88 879.64" stroke-dashoffset="-439.82"></circle>
                            <circle cx="175" cy="175" r="140" fill="none" stroke="#636e72" stroke-width="60" stroke-dasharray="131.94 879.64" stroke-dashoffset="-747.7"></circle>
                        </svg>
                    </div>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #0984e3;"></div>
                            <div class="legend-label">Nucléaire</div>
                            <div class="legend-value">50%</div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #00b894;"></div>
                            <div class="legend-label">Renouvelables</div>
                            <div class="legend-value">35%</div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: #636e72;"></div>
                            <div class="legend-label">Fossiles</div>
                            <div class="legend-value">15%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Sources : <span>Challenges · 2026</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>

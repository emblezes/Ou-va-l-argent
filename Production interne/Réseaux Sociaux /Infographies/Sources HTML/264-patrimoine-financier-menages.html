.chart-area{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
svg{overflow:visible;}
.footer{display:flex;justify-content:space-between;align-items:center;padding-top:16px;margin-top:6px;border-top:1px solid var(--glass-border);}
.source{font-size:0.95rem;color:var(--text-muted);max-width:680px;}.source span{color:var(--text-secondary);}
.website-url{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;color:var(--accent-electric);}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orpaillage illégal : le vrai coût</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06080c; --bg-surface: #0a0e14; --bg-elevated: #111820;
            --text-primary: #f0f4f8; --text-secondary: #8899a8; --text-muted: #4a5a6a;
            --accent-electric: #00d4ff; --accent-gold: #ffd700; --accent-red: #ff4757;
            --accent-green: #00ff88; --accent-purple: #a855f7; --accent-orange: #ff9f43;
            --glass: rgba(17, 24, 32, 0.85); --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: #1a1a2e; padding: 2rem; display: flex; justify-content: center; }
        .infographic { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
        .bg-base { position: absolute; inset: 0; background: linear-gradient(145deg, var(--bg-deep) 0%, #0a1628 50%, var(--bg-deep) 100%); }
        .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 71, 87, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 71, 87, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .bg-glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 71, 87, 0.12) 0%, transparent 70%); top: -200px; right: -100px; pointer-events: none; }
        .bg-glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255, 159, 67, 0.08) 0%, transparent 70%); bottom: -150px; left: -150px; pointer-events: none; }
        .content { position: relative; z-index: 1; height: 100%; padding: 48px 55px 38px; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, var(--accent-electric) 0%, #0099cc 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.4rem; color: var(--bg-deep); }
        .logo-text { font-weight: 700; font-size: 1.3rem; color: var(--text-primary); }
        .tag { padding: 12px 24px; background: rgba(255, 71, 87, 0.15); border: 1px solid rgba(255, 71, 87, 0.3); border-radius: 50px; font-size: 1rem; font-weight: 600; color: var(--accent-red); text-transform: uppercase; letter-spacing: 0.1em; }
        .chart-container { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .chart-title { font-family: 'Instrument Serif', serif; font-size: 4rem; text-align: center; margin-bottom: 30px; color: var(--text-primary); line-height: 1.12; }
        .chart-title .accent { color: var(--accent-red); font-style: italic; }
        .waterfall-chart { display: flex; align-items: flex-end; justify-content: center; gap: 12px; height: 480px; padding: 0 20px; position: relative; }
        .waterfall-col { display: flex; flex-direction: column; align-items: center; min-width: 120px; }
        .waterfall-value { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .waterfall-value.red { color: var(--accent-red); }
        .waterfall-value.orange { color: var(--accent-orange); }
        .waterfall-value.purple { color: var(--accent-purple); }
        .waterfall-value.electric { color: var(--accent-electric); }
        .waterfall-bar { width: 80px; border-radius: 8px 8px 0 0; position: relative; }
        .waterfall-bar.red { background: linear-gradient(to top, rgba(255, 71, 87, 0.4), var(--accent-red)); }
        .waterfall-bar.orange { background: linear-gradient(to top, rgba(255, 159, 67, 0.4), var(--accent-orange)); }
        .waterfall-bar.purple { background: linear-gradient(to top, rgba(168, 85, 247, 0.4), var(--accent-purple)); }
        .waterfall-bar.electric { background: linear-gradient(to top, rgba(0, 212, 255, 0.4), var(--accent-electric)); }
        .waterfall-bar.total { background: linear-gradient(to top, rgba(255, 71, 87, 0.6), var(--accent-red)); border: 2px solid var(--accent-red); }
        .waterfall-label { font-size: 0.95rem; color: var(--text-secondary); text-align: center; margin-top: 12px; line-height: 1.3; max-width: 120px; }
        .waterfall-connector { position: absolute; top: 0; right: -14px; width: 14px; border-top: 2px dashed var(--text-muted); }
        .total-label { font-size: 1.1rem; font-weight: 700; color: var(--accent-red); margin-top: 8px; }
        .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: auto; border-top: 1px solid var(--glass-border); }
        .source { font-size: 0.9rem; color: var(--text-muted); }
        .source span { color: var(--text-secondary); }
        .website { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 500; color: var(--accent-electric); }
    </style>
</head>
<body>
    <div class="infographic">
        <div class="bg-base"></div>
        <div class="bg-grid"></div>
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>
        <div class="content">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">€</div>
                    <span class="logo-text">Où Va l'Argent</span>
                </div>
                <div class="tag">Finances publiques</div>
            </div>
            <div class="chart-container">
                <h2 class="chart-title">Orpaillage illégal :<br>le <span class="accent">vrai coût</span> pour la France</h2>
                <div class="waterfall-chart">
                    <div class="waterfall-col">
                        <div class="waterfall-value red">80 M€</div>
                        <div class="waterfall-bar red" style="height: 130px"><div class="waterfall-connector"></div></div>
                        <div class="waterfall-label">Opérations militaires</div>
                    </div>
                    <div class="waterfall-col">
                        <div class="waterfall-value orange">200 M€</div>
                        <div class="waterfall-bar orange" style="height: 260px"><div class="waterfall-connector"></div></div>
                        <div class="waterfall-label">Manque à gagner fiscal</div>
                    </div>
                    <div class="waterfall-col">
                        <div class="waterfall-value purple">150 M€</div>
                        <div class="waterfall-bar purple" style="height: 200px"><div class="waterfall-connector"></div></div>
                        <div class="waterfall-label">Dégâts environn.</div>
                    </div>
                    <div class="waterfall-col">
                        <div class="waterfall-value electric">50 M€</div>
                        <div class="waterfall-bar electric" style="height: 90px"><div class="waterfall-connector"></div></div>
                        <div class="waterfall-label">Santé publique</div>
                    </div>
                    <div class="waterfall-col">
                        <div class="waterfall-value red" style="font-size: 2rem;">520 M€</div>
                        <div class="waterfall-bar total" style="height: 380px"></div>
                        <div class="waterfall-label">COÛT TOTAL<br>/an</div>
                    </div>
                </div>
            </div>
            <div class="footer">
                <div class="source">Source : <span>Min. Armées, INSEE, ARS, rapports parlementaires</span></div>
                <div class="website">ouvalargent.com</div>
            </div>
        </div>
    </div>
</body>
</html>
